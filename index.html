<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mon Atlas</title>

    <!-- MAPLIBRE -->
    <link
        href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"
        rel="stylesheet"
    >

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            font-family: Arial, sans-serif;
        }


        body {

            display: flex;
            flex-direction: column;
        }


        /* ==============================
           EN-TÊTE
           ============================== */

        header {

            min-height: 60px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            padding: 0 20px;

            box-sizing: border-box;

            background: white;

            border-bottom: 1px solid #ddd;

            z-index: 10;
        }


        h1 {

            margin: 0;

            font-size: 22px;

            white-space: nowrap;
        }


        /* ==============================
           FILTRES
           ============================== */

        #filtres {

            display: flex;

            align-items: center;

            gap: 8px;

            flex-wrap: wrap;

            justify-content: flex-end;
        }


        .filtre {

            padding: 7px 10px;

            border: 1px solid #ccc;

            border-radius: 6px;

            background: white;

            font-size: 13px;

            max-width: 190px;
        }


        #compteur {

            font-size: 13px;

            color: #666;

            white-space: nowrap;
        }


        /* ==============================
           CARTE
           ============================== */

        main {

            flex: 1;

            min-height: 0;
        }


        #map {

            width: 100%;
            height: 100%;
        }


        /* ==============================
           MESSAGE
           ============================== */

        #message {

            position: fixed;

            top: 70px;
            left: 10px;
            right: 10px;

            z-index: 1000;

            padding: 12px;

            background: white;

            border-radius: 8px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.2);

            display: none;

            color: #b00020;
        }


        /* ==============================
           FICHE
           ============================== */

        .fiche-lieu {

            font-family: Arial, sans-serif;

            line-height: 1.4;

            width: 100%;
        }


        .fiche-titre {

            font-size: 19px;

            font-weight: bold;

            margin-bottom: 4px;
        }


        .fiche-localisation {

            color: #666;

            margin-bottom: 10px;
        }


        .fiche-rubrique {

            margin-top: 8px;
        }


        .fiche-infos {

            margin-top: 8px;
        }


        .fiche-sous-titre {

            font-weight: bold;

            margin-bottom: 5px;
        }


        .fiche-description {

            margin-top: 12px;

            padding-top: 10px;

            border-top: 1px solid #ddd;
        }


        .fiche-notes {

            margin-top: 10px;

            padding-top: 10px;

            border-top: 1px solid #ddd;

            color: #555;
        }


        /* ==============================
           PHOTO PRINCIPALE
           ============================== */

        .fiche-photo {

            display: block;

            width: 100%;

            height: 220px;

            object-fit: cover;

            border-radius: 8px;

            margin-bottom: 10px;

            cursor: pointer;
        }


        /* ==============================
           GALERIE
           ============================== */

        .fiche-galerie {

            display: flex;

            gap: 6px;

            overflow-x: auto;

            margin-bottom: 12px;

            padding-bottom: 3px;
        }


        .fiche-miniature {

            width: 64px;

            height: 50px;

            object-fit: cover;

            border-radius: 6px;

            flex-shrink: 0;

            cursor: pointer;
        }


        .fiche-miniature:hover {

            opacity: 0.75;
        }


        .icone {

            margin-right: 4px;
        }


        /* ==============================
           MARQUEURS
           ============================== */

        .maplibregl-marker {

            cursor: pointer;
        }


        /* ==============================
           MOBILE
           ============================== */

        @media (max-width: 700px) {

            header {

                min-height: auto;

                padding: 10px;

                align-items: flex-start;

                flex-direction: column;
            }


            #filtres {

                width: 100%;

                justify-content: flex-start;
            }


            .filtre {

                flex: 1;

                min-width: 0;

                max-width: none;
            }


            #compteur {

                width: 100%;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>Mon Atlas</h1>


    <div id="filtres">

        <!-- MODE D'AFFICHAGE -->

        <select
            id="modeCarte"
            class="filtre"
        >

            <option value="marqueurs">
                📍 Lieux
            </option>

            <option value="heatmap">
                🔥 Heatmap
            </option>

        </select>


        <!-- FILTRE VOYAGE -->

        <select
            id="filtreVoyage"
            class="filtre"
        >

            <option value="">
                Tous les voyages
            </option>

        </select>


        <!-- FILTRE CONTEXTE -->

        <select
            id="filtreContexte"
            class="filtre"
        >

            <option value="">
                Tous les contextes
            </option>

        </select>


        <!-- FILTRE TYPE DE LIEU -->

        <select
            id="filtreTypeLieu"
            class="filtre"
        >

            <option value="">
                Tous les types
            </option>

        </select>


        <!-- FILTRE EXPERIENCE -->

        <select
            id="filtreExperience"
            class="filtre"
        >

            <option value="">
                Toutes les expériences
            </option>

        </select>


        <!-- COMPTEUR -->

        <span id="compteur">
            Chargement...
        </span>

    </div>

</header>


<div id="message"></div>


<main>

    <div id="map"></div>

</main>


<!-- MAPLIBRE -->

<script
    src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js">
</script>


<script>


// ==========================================================
// CONFIGURATION
// ==========================================================

const SUPABASE_URL =
    "https://xiddtmzehxwfncnyuvid.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_5Sgu_vod3bSaf1ecQeaD8A_BqZ_8HYj";


const MAPTILER_KEY =
    "knGFRadbYDcoOEytbBIZ";


// ==========================================================
// ELEMENTS HTML
// ==========================================================

const compteur =
    document.getElementById("compteur");


const message =
    document.getElementById("message");


const filtreVoyage =
    document.getElementById("filtreVoyage");


const filtreContexte =
    document.getElementById("filtreContexte");


const filtreTypeLieu =
    document.getElementById("filtreTypeLieu");


const filtreExperience =
    document.getElementById("filtreExperience");


const modeCarte =
    document.getElementById("modeCarte");


// ==========================================================
// DONNEES GLOBALES
// ==========================================================

let tousLesLieux = [];

let tousLesVoyages = [];

let toutesLesVisites = [];

let tousLesTypesContexte = [];

let toutesLesPhotos = [];


// Index des données

let voyagesParId = {};

let visitesParLieu = {};

let typesContexteParCode = {};

let photosParLieu = {};


// Affichage

let marqueurs = [];

let modeAffichage = "marqueurs";


// ==========================================================
// AFFICHAGE DES ERREURS
// ==========================================================

function afficherErreur(texte) {

    console.error(texte);

    compteur.textContent =
        "Erreur";

    message.textContent =
        "⚠️ " + texte;

    message.style.display =
        "block";
}


// ==========================================================
// ECHAPPEMENT HTML
// ==========================================================

function echapperHTML(texte) {

    if (
        texte === null ||
        texte === undefined
    ) {

        return "";
    }


    return String(texte)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}


// ==========================================================
// FORMAT DATE
// ==========================================================

function formaterDate(date) {

    if (!date) {

        return "";
    }


    const morceaux =
        String(date).split("-");


    if (morceaux.length !== 3) {

        return String(date);
    }


    return (
        morceaux[2] +
        "/" +
        morceaux[1] +
        "/" +
        morceaux[0]
    );
}


// ==========================================================
// PERIODE
// ==========================================================

function afficherPeriode(
    dateDebut,
    dateFin,
    precision,
    dateTexte
) {

    if (dateTexte) {

        return echapperHTML(
            dateTexte
        );
    }


    if (!dateDebut) {

        return "";
    }


    const debut =
        formaterDate(dateDebut);


    if (
        !dateFin ||
        dateFin === dateDebut
    ) {

        return debut;
    }


    return (
        debut +
        " → " +
        formaterDate(dateFin)
    );
}


// ==========================================================
// URL PHOTO SUPABASE STORAGE
// ==========================================================

function construireUrlPhoto(
    fichier
) {

    if (!fichier) {

        return "";
    }


    const cheminEncode =
        String(fichier)

            .split("/")

            .map(
                segment =>
                    encodeURIComponent(segment)
            )

            .join("/");


    return (
        SUPABASE_URL +
        "/storage/v1/object/public/photos/" +
        cheminEncode
    );
}


// ==========================================================
// CARTE
// ==========================================================

let map;


try {

    map =
        new maplibregl.Map({

            container: "map",

            style:
                "https://api.maptiler.com/maps/streets-v4/style.json?key=" +
                MAPTILER_KEY,

            center: [
                2.5,
                46.5
            ],

            zoom: 4
        });


    map.addControl(
        new maplibregl.NavigationControl(),
        "top-right"
    );


} catch (erreur) {

    afficherErreur(
        "Impossible d'initialiser la carte : " +
        erreur.message
    );
}


// ==========================================================
// RECUPERATION DE LA VISITE D'UN LIEU
// ==========================================================

function obtenirVisite(
    lieu
) {

    if (!lieu || !lieu.lieu_id) {

        return null;
    }


    const visites =
        visitesParLieu[
            lieu.lieu_id
        ];


    if (
        !Array.isArray(visites) ||
        visites.length === 0
    ) {

        return null;
    }


    return visites[0];
}


// ==========================================================
// RECUPERATION DU CONTEXTE
// ==========================================================

function obtenirNomContexte(
    visite
) {

    if (
        !visite ||
        !visite.type_contexte
    ) {

        return "";
    }


    const contexte =
        typesContexteParCode[
            visite.type_contexte
        ];


    if (contexte) {

        return (
            contexte.nom ||
            contexte.code ||
            visite.type_contexte
        );
    }


    return visite.type_contexte;
}


// ==========================================================
// CREATION DE LA FICHE
// ==========================================================

function creerFiche(
    lieu,
    voyage,
    visite,
    photos
) {

    let html = `
        <div class="fiche-lieu">
    `;


    // ======================================================
    // PHOTO PRINCIPALE
    // ======================================================

    let photoPrincipale = null;


    if (Array.isArray(photos)) {

        photoPrincipale =
            photos.find(
                photo =>
                    photo.photo_principale === true
            ) || photos[0];
    }


    if (
        photoPrincipale &&
        photoPrincipale.fichier
    ) {

        const urlPhoto =
            construireUrlPhoto(
                photoPrincipale.fichier
            );


        html += `
            <img
                class="fiche-photo"
                src="${echapperHTML(urlPhoto)}"
                alt="${echapperHTML(
                    photoPrincipale.titre ||
                    lieu.nom
                )}"
            >
        `;
    }


    // ======================================================
    // GALERIE PHOTO
    // ======================================================

    if (
        Array.isArray(photos) &&
        photos.length > 1
    ) {

        html += `
            <div class="fiche-galerie">
        `;


        photos.forEach(
            photo => {

                if (!photo.fichier) {

                    return;
                }


                const urlPhoto =
                    construireUrlPhoto(
                        photo.fichier
                    );


                html += `
                    <img
                        class="fiche-miniature"

                        src="${echapperHTML(
                            urlPhoto
                        )}"

                        data-photo-url="${echapperHTML(
                            urlPhoto
                        )}"

                        data-photo-titre="${echapperHTML(
                            photo.titre ||
                            lieu.nom
                        )}"

                        alt="${echapperHTML(
                            photo.titre ||
                            lieu.nom
                        )}"
                    >
                `;
            }
        );


        html += `
            </div>
        `;
    }


    // ======================================================
    // TITRE
    // ======================================================

    html += `
        <div class="fiche-titre">
            ${echapperHTML(lieu.nom)}
        </div>
    `;


    // ======================================================
    // LOCALISATION
    // ======================================================

    const localisation = [

        lieu.ville,

        lieu.pays

    ]
        .filter(Boolean)
        .map(echapperHTML)
        .join(" · ");


    if (localisation) {

        html += `
            <div class="fiche-localisation">
                📍 ${localisation}
            </div>
        `;
    }


    // ======================================================
    // INFORMATIONS PRINCIPALES
    // ======================================================

    html += `
        <div class="fiche-infos">
    `;


    // ------------------------------------------------------
    // VOYAGE
    // ------------------------------------------------------

    if (voyage) {

        html += `
            <div class="fiche-rubrique">
                <span class="icone">✈️</span>
                <strong>Voyage :</strong>
                ${echapperHTML(voyage.nom)}
            </div>
        `;
    }


    // ------------------------------------------------------
    // DATE
    // ------------------------------------------------------

    // On privilégie la date de la visite.
    // Si elle n'existe pas, on utilise celle du lieu.

    let dateDebut =
        visite?.date_debut ||
        lieu.date_debut;


    let dateFin =
        visite?.date_fin ||
        lieu.date_fin;


    let datePrecision =
        visite?.date_precision ||
        lieu.date_precision;


    let dateTexte =
        visite?.date_texte ||
        lieu.date_texte;


    const dateLieu =
        afficherPeriode(

            dateDebut,

            dateFin,

            datePrecision,

            dateTexte
        );


    if (dateLieu) {

        html += `
            <div class="fiche-rubrique">
                <span class="icone">📅</span>
                <strong>Date :</strong>
                ${dateLieu}
            </div>
        `;
    }


    // ------------------------------------------------------
    // CONTEXTE
    // ------------------------------------------------------

    const nomContexte =
        obtenirNomContexte(
            visite
        );


    if (nomContexte) {

        html += `
            <div class="fiche-rubrique">
                <span class="icone">🧭</span>
                <strong>Contexte :</strong>
                ${echapperHTML(nomContexte)}
            </div>
        `;
    }


    // ------------------------------------------------------
    // EXPERIENCE
    // ------------------------------------------------------

    if (
        visite &&
        visite.type_experience
    ) {

        html += `
            <div class="fiche-rubrique">
                <span class="icone">✨</span>
                <strong>Expérience :</strong>
                ${echapperHTML(
                    visite.type_experience
                )}
            </div>
        `;
    }


    // ------------------------------------------------------
    // NOTE
    // ------------------------------------------------------

    const note =
        visite?.note ??
        lieu.note;


    if (
        note !== null &&
        note !== undefined
    ) {

        html += `
            <div class="fiche-rubrique">
                <span class="icone">⭐</span>
                <strong>Note :</strong>
                ${echapperHTML(note)}/5
            </div>
        `;
    }


    // ------------------------------------------------------
    // TYPE DE LIEU
    // ------------------------------------------------------

    if (lieu.type_lieu) {

        html += `
            <div class="fiche-rubrique">
                <span class="icone">📍</span>
                <strong>Type :</strong>
                ${echapperHTML(
                    lieu.type_lieu
                )}
            </div>
        `;
    }


    // ------------------------------------------------------
    // ADRESSE
    // ------------------------------------------------------

    if (lieu.adresse) {

        html += `
            <div class="fiche-rubrique">
                <span class="icone">🏠</span>
                <strong>Adresse :</strong><br>
                ${echapperHTML(
                    lieu.adresse
                )}
            </div>
        `;
    }


    html += `
        </div>
    `;


    // ======================================================
    // DESCRIPTION
    // ======================================================

    const description =
        visite?.description ||
        lieu.description;


    if (description) {

        html += `
            <div class="fiche-description">

                <div class="fiche-sous-titre">
                    Description
                </div>

                <div>
                    ${echapperHTML(
                        description
                    )}
                </div>

            </div>
        `;
    }


    // ======================================================
    // NOTES PERSONNELLES
    // ======================================================

    const notes =
        visite?.notes ||
        lieu.notes;


    if (notes) {

        html += `
            <div class="fiche-notes">

                <div class="fiche-sous-titre">
                    Notes personnelles
                </div>

                <div>
                    ${echapperHTML(
                        notes
                    )}
                </div>

            </div>
        `;
    }


    // ======================================================
    // FIN
    // ======================================================

    html += `
        </div>
    `;


    return html;
}


// ==========================================================
// REMPLISSAGE DES FILTRES
// ==========================================================

function remplirFiltres() {


    // ======================================================
    // VOYAGES
    // ======================================================

    filtreVoyage.innerHTML = `
        <option value="">
            Tous les voyages
        </option>
    `;


    const voyagesTries =
        [...tousLesVoyages].sort(
            (a, b) =>
                String(a.nom || "")
                    .localeCompare(
                        String(b.nom || ""),
                        "fr"
                    )
        );


    voyagesTries.forEach(
        voyage => {

            if (!voyage.voyage_id) {

                return;
            }


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                voyage.voyage_id;


            option.textContent =
                voyage.nom ||
                voyage.voyage_id;


            filtreVoyage.appendChild(
                option
            );
        }
    );


    // ======================================================
    // CONTEXTES
    // ======================================================

    filtreContexte.innerHTML = `
        <option value="">
            Tous les contextes
        </option>
    `;


    const contextesUtilises =
        new Set(

            toutesLesVisites

                .map(
                    visite =>
                        visite.type_contexte
                )

                .filter(Boolean)

        );


    const contextesTries =
        [...tousLesTypesContexte]

            .filter(
                contexte =>
                    contextesUtilises.has(
                        contexte.code
                    )
            )

            .sort(
                (a, b) =>
                    String(
                        a.nom || a.code || ""
                    ).localeCompare(
                        String(
                            b.nom || b.code || ""
                        ),
                        "fr"
                    )
            );


    contextesTries.forEach(
        contexte => {

            if (!contexte.code) {

                return;
            }


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                contexte.code;


            option.textContent =
                contexte.nom ||
                contexte.code;


            filtreContexte.appendChild(
                option
            );
        }
    );


    // ======================================================
    // TYPES DE LIEU
    // ======================================================

    filtreTypeLieu.innerHTML = `
        <option value="">
            Tous les types
        </option>
    `;


    const typesLieu =
        [
            ...new Set(

                tousLesLieux

                    .map(
                        lieu =>
                            lieu.type_lieu
                    )

                    .filter(Boolean)

            )
        ]

        .sort(
            (a, b) =>
                String(a).localeCompare(
                    String(b),
                    "fr"
                )
        );


    typesLieu.forEach(
        type => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                type;


            option.textContent =
                type;


            filtreTypeLieu.appendChild(
                option
            );
        }
    );


    // ======================================================
    // EXPERIENCES
    // ======================================================

    filtreExperience.innerHTML = `
        <option value="">
            Toutes les expériences
        </option>
    `;


    const experiences =
        [
            ...new Set(

                toutesLesVisites

                    .map(
                        visite =>
                            visite.type_experience
                    )

                    .filter(Boolean)

            )
        ]

        .sort(
            (a, b) =>
                String(a).localeCompare(
                    String(b),
                    "fr"
                )
        );


    experiences.forEach(
        experience => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                experience;


            option.textContent =
                experience;


            filtreExperience.appendChild(
                option
            );
        }
    );
}


// ==========================================================
// SUPPRESSION DES MARQUEURS
// ==========================================================

function supprimerMarqueurs() {

    marqueurs.forEach(
        marqueur => {

            marqueur.remove();
        }
    );


    marqueurs = [];
}


// ==========================================================
// SUPPRESSION DE LA HEATMAP
// ==========================================================

function supprimerHeatmap() {

    if (
        !map ||
        !map.isStyleLoaded()
    ) {

        return;
    }


    if (
        map.getLayer(
            "heatmap-lieux"
        )
    ) {

        map.removeLayer(
            "heatmap-lieux"
        );
    }


    if (
        map.getSource(
            "lieux-heatmap"
        )
    ) {

        map.removeSource(
            "lieux-heatmap"
        );
    }
}


// ==========================================================
// AFFICHAGE DES LIEUX FILTRES
// ==========================================================

function afficherLieuxFiltres() {


    // ------------------------------------------------------
    // SECURITE
    // ------------------------------------------------------

    if (
        !map ||
        !map.isStyleLoaded()
    ) {

        return;
    }


    // ------------------------------------------------------
    // NETTOYAGE
    // ------------------------------------------------------

    supprimerMarqueurs();

    supprimerHeatmap();


    // ------------------------------------------------------
    // VALEURS DES FILTRES
    // ------------------------------------------------------

    const voyageSelectionne =
        filtreVoyage.value;


    const contexteSelectionne =
        filtreContexte.value;


    const typeLieuSelectionne =
        filtreTypeLieu.value;


    const experienceSelectionnee =
        filtreExperience.value;


    // ------------------------------------------------------
    // FILTRAGE
    // ------------------------------------------------------

    const lieuxFiltres =
        tousLesLieux.filter(
            lieu => {


                // ------------------------------------------
                // VOYAGE
                // ------------------------------------------

                if (
                    voyageSelectionne &&
                    String(lieu.voyage_id) !==
                        String(voyageSelectionne)
                ) {

                    return false;
                }


                // ------------------------------------------
                // VISITE
                // ------------------------------------------

                const visite =
                    obtenirVisite(lieu);


                // ------------------------------------------
                // CONTEXTE
                // ------------------------------------------

                if (
                    contexteSelectionne &&
                    (
                        !visite ||
                        visite.type_contexte !==
                            contexteSelectionne
                    )
                ) {

                    return false;
                }


                // ------------------------------------------
                // TYPE DE LIEU
                // ------------------------------------------

                if (
                    typeLieuSelectionne &&
                    lieu.type_lieu !==
                        typeLieuSelectionne
                ) {

                    return false;
                }


                // ------------------------------------------
                // EXPERIENCE
                // ------------------------------------------

                if (
                    experienceSelectionnee &&
                    (
                        !visite ||
                        visite.type_experience !==
                            experienceSelectionnee
                    )
                ) {

                    return false;
                }


                // ------------------------------------------
                // GEOLOCALISATION
                // ------------------------------------------

                return (
                    lieu.latitude !== null &&
                    lieu.longitude !== null
                );

            }
        );


    // ======================================================
    // COMPTEUR
    // ======================================================

    compteur.textContent =
        lieuxFiltres.length +
        (
            lieuxFiltres.length > 1
                ? " lieux"
                : " lieu"
        );


    // ======================================================
    // AUCUN RESULTAT
    // ======================================================

    if (lieuxFiltres.length === 0) {

        return;
    }


    // ======================================================
    // CADRAGE
    // ======================================================

    const bounds =
        new maplibregl.LngLatBounds();


    lieuxFiltres.forEach(
        lieu => {

            bounds.extend([

                Number(
                    lieu.longitude
                ),

                Number(
                    lieu.latitude
                )

            ]);

        }
    );


    // ======================================================
    // MODE HEATMAP
    // ======================================================

    if (
        modeAffichage === "heatmap"
    ) {

        const geojson = {

            type: "FeatureCollection",

            features:
                lieuxFiltres.map(
                    lieu => ({

                        type: "Feature",

                        geometry: {

                            type: "Point",

                            coordinates: [

                                Number(
                                    lieu.longitude
                                ),

                                Number(
                                    lieu.latitude
                                )

                            ]

                        },

                        properties: {

                            lieu_id:
                                lieu.lieu_id

                        }

                    })
                )
        };


        map.addSource(
            "lieux-heatmap",
            {

                type: "geojson",

                data: geojson

            }
        );


        map.addLayer({

            id: "heatmap-lieux",

            type: "heatmap",

            source: "lieux-heatmap",

            maxzoom: 12,

            paint: {

                "heatmap-intensity": [

                    "interpolate",

                    ["linear"],

                    ["zoom"],

                    2,
                    0.7,

                    4,
                    0.9,

                    6,
                    1.15,

                    8,
                    1.4,

                    10,
                    1.7,

                    12,
                    2.0

                ],


                "heatmap-radius": [

                    "interpolate",

                    ["linear"],

                    ["zoom"],

                    2,
                    14,

                    4,
                    20,

                    6,
                    27,

                    8,
                    34,

                    10,
                    40,

                    12,
                    46

                ],


                "heatmap-opacity": [

                    "interpolate",

                    ["linear"],

                    ["zoom"],

                    2,
                    0.70,

                    5,
                    0.75,

                    8,
                    0.80,

                    12,
                    0.84

                ],


                "heatmap-color": [

                    "interpolate",

                    ["linear"],

                    ["heatmap-density"],

                    0,
                    "rgba(33,102,172,0)",

                    0.08,
                    "rgba(33,102,172,0.30)",

                    0.20,
                    "rgba(103,169,207,0.55)",

                    0.35,
                    "rgba(209,229,240,0.70)",

                    0.50,
                    "rgba(253,219,199,0.78)",

                    0.65,
                    "rgba(239,138,98,0.84)",

                    0.80,
                    "rgba(215,48,39,0.90)",

                    1,
                    "rgba(165,0,38,0.96)"

                ]

            }

        });


        map.fitBounds(

            bounds,

            {

                padding: 70,

                maxZoom: 6,

                duration: 700

            }

        );


        return;
    }


    // ======================================================
    // MODE MARQUEURS
    // ======================================================

    lieuxFiltres.forEach(
        lieu => {


            const voyage =
                voyagesParId[
                    lieu.voyage_id
                ];


            const visite =
                obtenirVisite(lieu);


            const photosLieu =
                photosParLieu[
                    lieu.lieu_id
                ] || [];


            const popup =
                new maplibregl.Popup({

                    offset: 25,

                    maxWidth:
                        "420px"

                });


            popup.setHTML(

                creerFiche(

                    lieu,

                    voyage,

                    visite,

                    photosLieu

                )

            );


            const marqueur =
                new maplibregl.Marker()

                    .setLngLat([

                        Number(
                            lieu.longitude
                        ),

                        Number(
                            lieu.latitude
                        )

                    ])

                    .setPopup(popup)

                    .addTo(map);


            marqueurs.push(
                marqueur
            );

        }
    );


    // ======================================================
    // CADRAGE
    // ======================================================

    map.fitBounds(

        bounds,

        {

            padding: 70,

            maxZoom: 6,

            duration: 700

        }

    );
}


// ==========================================================
// FONCTION GENERIQUE SUPABASE
// ==========================================================

async function recupererTable(
    table,
    select = "*",
    order = null
) {

    let url =
        SUPABASE_URL +
        "/rest/v1/" +
        table +
        "?select=" +
        encodeURIComponent(select);


    if (order) {

        url +=
            "&order=" +
            encodeURIComponent(order);
    }


    const response =
        await fetch(

            url,

            {

                method: "GET",

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_KEY,

                    "Accept":
                        "application/json"

                }

            }

        );


    if (!response.ok) {

        let details = "";

        try {

            details =
                await response.text();

        } catch (_) {

            details = "";
        }


        throw new Error(

            table +
            " : HTTP " +
            response.status +
            (
                details
                    ? " — " + details
                    : ""
            )

        );
    }


    return await response.json();
}


// ==========================================================
// CHARGEMENT DES DONNEES
// ==========================================================

async function chargerDonnees() {

    compteur.textContent =
        "Connexion à Supabase...";


    message.style.display =
        "none";


    try {


        // ==================================================
        // CHARGEMENT DES 5 TABLES
        // ==================================================

        const [

            lieux,
            voyages,
            visites,
            typesContexte,
            photos

        ] = await Promise.all([

            recupererTable(
                "lieux",
                "*",
                "lieu_id.asc"
            ),

            recupererTable(
                "voyages",
                "*",
                "voyage_id.asc"
            ),

            recupererTable(
                "visites",
                "*",
                "lieu_id.asc"
            ),

            recupererTable(
                "types_contexte",
                "code,nom",
                "nom.asc"
            ),

            recupererTable(
                "photos",
                "*",
                "ordre.asc"
            )

        ]);


        // ==================================================
        // STOCKAGE
        // ==================================================

        tousLesLieux =
            lieux;


        tousLesVoyages =
            voyages;


        toutesLesVisites =
            visites;


        tousLesTypesContexte =
            typesContexte;


        toutesLesPhotos =
            photos;


        console.log(
            "Lieux chargés :",
            tousLesLieux.length
        );


        console.log(
            "Voyages chargés :",
            tousLesVoyages.length
        );


        console.log(
            "Visites chargées :",
            toutesLesVisites.length
        );


        console.log(
            "Contextes chargés :",
            tousLesTypesContexte.length
        );


        console.log(
            "Photos chargées :",
            toutesLesPhotos.length
        );


        // ==================================================
        // INDEX VOYAGES
        // ==================================================

        voyagesParId = {};


        tousLesVoyages.forEach(
            voyage => {

                if (voyage.voyage_id) {

                    voyagesParId[
                        voyage.voyage_id
                    ] = voyage;

                }

            }
        );


        // ==================================================
        // INDEX VISITES PAR LIEU
        // ==================================================

        visitesParLieu = {};


        toutesLesVisites.forEach(
            visite => {

                if (!visite.lieu_id) {

                    return;
                }


                if (
                    !visitesParLieu[
                        visite.lieu_id
                    ]
                ) {

                    visitesParLieu[
                        visite.lieu_id
                    ] = [];
                }


                visitesParLieu[
                    visite.lieu_id
                ].push(visite);

            }
        );


        // ==================================================
        // INDEX CONTEXTES
        // ==================================================

        typesContexteParCode = {};


        tousLesTypesContexte.forEach(
            contexte => {

                if (contexte.code) {

                    typesContexteParCode[
                        contexte.code
                    ] = contexte;

                }

            }
        );


        // ==================================================
        // INDEX PHOTOS
        // ==================================================

        photosParLieu = {};


        toutesLesPhotos.forEach(
            photo => {

                if (!photo.lieu_id) {

                    return;
                }


                if (
                    !photosParLieu[
                        photo.lieu_id
                    ]
                ) {

                    photosParLieu[
                        photo.lieu_id
                    ] = [];
                }


                photosParLieu[
                    photo.lieu_id
                ].push(photo);

            }
        );


        // ==================================================
        // FILTRES
        // ==================================================

        remplirFiltres();


        // ==================================================
        // AFFICHAGE INITIAL
        // ==================================================

        if (map.isStyleLoaded()) {

            afficherLieuxFiltres();

        } else {

            map.once(
                "load",
                function() {

                    afficherLieuxFiltres();

                }
            );

        }


    } catch (erreur) {

        console.error(
            "ERREUR ATLAS :",
            erreur
        );


        afficherErreur(

            "Impossible de charger les données : " +
            erreur.message

        );

    }
}

// ==========================================================
// GALERIE PHOTO
// ==========================================================

document.addEventListener(
    "click",

    function(event) {


        const miniature =
            event.target.closest(
                ".fiche-miniature"
            );


        if (!miniature) {

            return;
        }


        const popup =
            miniature.closest(
                ".maplibregl-popup"
            );


        if (!popup) {

            return;
        }


        const grandePhoto =
            popup.querySelector(
                ".fiche-photo"
            );


        if (!grandePhoto) {

            return;
        }


        grandePhoto.src =
            miniature.dataset.photoUrl;


        grandePhoto.alt =
            miniature.dataset.photoTitre ||
            "";

    }
);


// ==========================================================
// LANCEMENT
// ==========================================================

chargerDonnees();
