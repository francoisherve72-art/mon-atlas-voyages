    <!-- ======================================================
         MAPLIBRE
         ====================================================== -->

    <link
        href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"
        rel="stylesheet"
    >


    <style>

        /* =====================================================
           GLOBAL
           ===================================================== */

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            font-family: Arial, sans-serif;
        }


        body {

            display: flex;

            flex-direction: column;

            background: #f5f5f5;
        }


        /* =====================================================
           EN-TÊTE
           ===================================================== */

        header {

            min-height: 60px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            padding: 0 20px;

            box-sizing: border-box;

            background: white;

            border-bottom: 1px solid #ddd;

            z-index: 10;
        }


        h1 {

            margin: 0;

            font-size: 22px;

            white-space: nowrap;
        }


        /* =====================================================
           FILTRES
           ===================================================== */

        #filtres {

            display: flex;

            align-items: center;

            gap: 8px;

            flex-wrap: wrap;

            justify-content: flex-end;
        }


        .filtre {

            padding: 7px 10px;

            border: 1px solid #ccc;

            border-radius: 6px;

            background: white;

            font-size: 13px;

            max-width: 200px;
        }


        #compteur {

            font-size: 13px;

            color: #666;

            white-space: nowrap;
        }


        /* =====================================================
           CARTE
           ===================================================== */

        main {

            flex: 1;

            min-height: 0;
        }


        #map {

            width: 100%;

            height: 100%;
        }


        /* =====================================================
           MESSAGE ERREUR
           ===================================================== */

        #message {

            position: fixed;

            top: 70px;

            left: 10px;

            right: 10px;

            z-index: 1000;

            padding: 12px;

            background: white;

            border-radius: 8px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.2);

            display: none;

            color: #b00020;
        }


        /* =====================================================
           FICHE LIEU
           ===================================================== */

        .fiche-lieu {

            font-family: Arial, sans-serif;

            line-height: 1.4;

            width: 100%;
        }


        .fiche-titre {

            font-size: 19px;

            font-weight: bold;

            margin-bottom: 4px;
        }


        .fiche-localisation {

            color: #666;

            margin-bottom: 10px;
        }


        .fiche-rubrique {

            margin-top: 8px;
        }


        .fiche-infos {

            margin-top: 8px;
        }


        .fiche-sous-titre {

            font-weight: bold;

            margin-bottom: 5px;
        }


        .fiche-description {

            margin-top: 12px;

            padding-top: 10px;

            border-top: 1px solid #ddd;
        }


        .fiche-notes {

            margin-top: 10px;

            padding-top: 10px;

            border-top: 1px solid #ddd;

            color: #555;
        }


        /* =====================================================
           VISITES
           ===================================================== */

        .fiche-visites {

            margin-top: 14px;

            padding-top: 10px;

            border-top: 1px solid #ddd;
        }


        .fiche-visite {

            padding: 8px 10px;

            margin-top: 8px;

            background: #f7f7f7;

            border-radius: 6px;

            border-left: 3px solid #ccc;
        }


        .fiche-visite:first-child {

            margin-top: 4px;
        }


        .visite-titre {

            font-weight: bold;

            margin-bottom: 3px;
        }


        .visite-detail {

            font-size: 13px;

            color: #555;

            margin-top: 3px;
        }


        /* =====================================================
           PHOTO
           ===================================================== */

        .fiche-photo {

            display: block;

            width: 100%;

            height: 220px;

            object-fit: cover;

            border-radius: 8px;

            margin-bottom: 10px;

            cursor: pointer;
        }


        /* =====================================================
           GALERIE
           ===================================================== */

        .fiche-galerie {

            display: flex;

            gap: 6px;

            overflow-x: auto;

            margin-bottom: 12px;

            padding-bottom: 3px;
        }


        .fiche-miniature {

            width: 64px;

            height: 50px;

            object-fit: cover;

            border-radius: 6px;

            flex-shrink: 0;

            cursor: pointer;
        }


        .fiche-miniature:hover {

            opacity: 0.75;
        }


        /* =====================================================
           ICÔNES
           ===================================================== */

        .icone {

            margin-right: 4px;
        }


        /* =====================================================
           BADGES
           ===================================================== */

        .badge {

            display: inline-block;

            padding: 2px 7px;

            margin-left: 4px;

            border-radius: 10px;

            background: #e8e8e8;

            font-size: 11px;

            color: #555;
        }


        /* =====================================================
           MARQUEURS
           ===================================================== */

        .maplibregl-marker {

            cursor: pointer;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 700px) {

            header {

                min-height: auto;

                padding: 10px;

                align-items: flex-start;

                flex-direction: column;
            }


            #filtres {

                width: 100%;

                justify-content: flex-start;
            }


            .filtre {

                flex: 1;

                min-width: 0;

                max-width: none;
            }


            #compteur {

                width: 100%;
            }

        }

    </style>

</head>

<!-- ==========================================================

<script
    src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js">
</script>


<script>


// ==========================================================
// CONFIGURATION
// ==========================================================

const SUPABASE_URL =
    "https://xiddtmzehxwfncnyuvid.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_5Sgu_vod3bSaf1ecQeaD8A_BqZ_8HYj";


const MAPTILER_KEY =
    "knGFRadbYDcoOEytbBIZ";


// ==========================================================
// ELEMENTS HTML
// ==========================================================

const compteur =
    document.getElementById("compteur");


const message =
    document.getElementById("message");


const filtreVoyage =
    document.getElementById("filtreVoyage");


const filtreContexte =
    document.getElementById("filtreContexte");


const filtreTypeLieu =
    document.getElementById("filtreTypeLieu");


const filtreExperience =
    document.getElementById("filtreExperience");


const modeCarte =
    document.getElementById("modeCarte");


// ==========================================================
// DONNEES GLOBALES
// ==========================================================

let tousLesLieux = [];

let tousLesVoyages = [];

let toutesLesVisites = [];

let toutesLesPhotos = [];

let tousLesContextes = [];


let voyagesParId = {};

let visitesParLieu = {};

let photosParLieu = {};

let contextesParCode = {};


let marqueurs = [];

let modeAffichage = "marqueurs";


// ==========================================================
// AFFICHAGE DES ERREURS
// ==========================================================

function afficherErreur(texte) {

    console.error(texte);

    compteur.textContent =
        "Erreur";

    message.textContent =
        "⚠️ " + texte;

    message.style.display =
        "block";
}


// ==========================================================
// ECHAPPEMENT HTML
// ==========================================================

function echapperHTML(texte) {

    if (
        texte === null ||
        texte === undefined
    ) {

        return "";
    }


    return String(texte)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}


// ==========================================================
// FORMAT DATE
// ==========================================================

function formaterDate(date) {

    if (!date) {

        return "";
    }


    const morceaux =
        String(date).split("-");


    if (morceaux.length !== 3) {

        return date;
    }


    return (
        morceaux[2] +
        "/" +
        morceaux[1] +
        "/" +
        morceaux[0]
    );
}


// ==========================================================
// AFFICHER UNE PERIODE
// ==========================================================

function afficherPeriode(
    dateDebut,
    dateFin,
    precision,
    dateTexte
) {

    if (dateTexte) {

        return echapperHTML(
            dateTexte
        );
    }


    if (!dateDebut) {

        return "";
    }


    const debut =
        formaterDate(dateDebut);


    if (
        !dateFin ||
        dateFin === dateDebut
    ) {

        return debut;
    }


    return (
        debut +
        " → " +
        formaterDate(dateFin)
    );
}


// ==========================================================
// LIBELLE D'UN CONTEXTE
// ==========================================================
//
// La table types_contexte peut évoluer.
// On cherche donc plusieurs noms de colonnes possibles.
//
// Le code reste toujours utilisable même si la table ne
// possède qu'une colonne "code".
// ==========================================================

function obtenirLibelleContexte(code) {

    if (!code) {

        return "";
    }


    const contexte =
        contextesParCode[code];


    if (!contexte) {

        return code;
    }


    return (
        contexte.nom ||
        contexte.libelle ||
        contexte.label ||
        contexte.description ||
        contexte.code ||
        code
    );
}


// ==========================================================
// RECUPERATION DES VISITES D'UN LIEU
// ==========================================================

function obtenirVisitesLieu(lieuId) {

    return (
        visitesParLieu[lieuId] ||
        []
    );
}


// ==========================================================
// RECUPERATION DES CONTEXTES D'UN LIEU
// ==========================================================

function obtenirContextesLieu(lieuId) {

    const visites =
        obtenirVisitesLieu(lieuId);


    return [
        ...new Set(

            visites

                .map(
                    visite =>
                        visite.type_contexte
                )

                .filter(Boolean)

        )
    ];
}


// ==========================================================
// RECUPERATION DES VOYAGES D'UN LIEU
// ==========================================================

function obtenirVoyagesLieu(lieuId) {

    const visites =
        obtenirVisitesLieu(lieuId);


    return [
        ...new Set(

            visites

                .map(
                    visite =>
                        visite.voyage_id
                )

                .filter(Boolean)

        )
    ];
}


// ==========================================================
// CARTE
// ==========================================================

let map;


try {

    map =
        new maplibregl.Map({

            container: "map",

            style:
                "https://api.maptiler.com/maps/streets-v4/style.json?key=" +
                MAPTILER_KEY,

            center: [

                2.5,

                46.5

            ],

            zoom: 4
        });


    map.addControl(

        new maplibregl.NavigationControl(),

        "top-right"
    );


} catch (erreur) {

    afficherErreur(

        "Impossible d'initialiser la carte : " +

        erreur.message
    );
}


// ==========================================================
// CREATION DE LA FICHE D'UN LIEU
// ==========================================================

function creerFiche(
    lieu,
    photos
) {

    let html = `

        <div class="fiche-lieu">

    `;


    // ======================================================
    // PHOTO PRINCIPALE
    // ======================================================

    let photoPrincipale = null;


    if (Array.isArray(photos)) {

        photoPrincipale =

            photos.find(

                photo =>
                    photo.photo_principale === true

            ) ||

            photos[0];
    }


    if (

        photoPrincipale &&

        photoPrincipale.fichier

    ) {

        const urlPhoto =

            SUPABASE_URL +

            "/storage/v1/object/public/photos/" +

            photoPrincipale.fichier;


        html += `

            <img

                class="fiche-photo"

                src="${echapperHTML(
                    urlPhoto
                )}"

                alt="${echapperHTML(

                    photoPrincipale.titre ||

                    lieu.nom

                )}"

            >

        `;
    }


    // ======================================================
    // GALERIE
    // ======================================================

    if (

        Array.isArray(photos) &&

        photos.length > 1

    ) {

        html += `

            <div class="fiche-galerie">

        `;


        photos.forEach(

            photo => {

                if (!photo.fichier) {

                    return;
                }


                const urlPhoto =

                    SUPABASE_URL +

                    "/storage/v1/object/public/photos/" +

                    photo.fichier;


                html += `

                    <img

                        class="fiche-miniature"

                        src="${echapperHTML(
                            urlPhoto
                        )}"

                        data-photo-url="${echapperHTML(
                            urlPhoto
                        )}"

                        data-photo-titre="${echapperHTML(

                            photo.titre ||

                            lieu.nom

                        )}"

                        alt="${echapperHTML(

                            photo.titre ||

                            lieu.nom

                        )}"

                    >

                `;
            }
        );


        html += `

            </div>

        `;
    }


    // ======================================================
    // TITRE
    // ======================================================

    html += `

        <div class="fiche-titre">

            ${echapperHTML(lieu.nom)}

        </div>

    `;


    // ======================================================
    // LOCALISATION
    // ======================================================

    const localisation = [

        lieu.ville,

        lieu.pays

    ]

        .filter(Boolean)

        .map(echapperHTML)

        .join(" · ");


    if (localisation) {

        html += `

            <div class="fiche-localisation">

                📍 ${localisation}

            </div>

        `;
    }


    // ======================================================
    // INFORMATIONS PROPRES AU LIEU
    // ======================================================

    html += `

        <div class="fiche-infos">

    `;


    // ------------------------------------------------------
    // TYPE DE LIEU
    // ------------------------------------------------------

    if (lieu.type_lieu) {

        html += `

            <div class="fiche-rubrique">

                <span class="icone">📍</span>

                <strong>Type :</strong>

                ${echapperHTML(
                    lieu.type_lieu
                )}

            </div>

        `;
    }


    // ------------------------------------------------------
    // NOTE DU LIEU
    // ------------------------------------------------------

    if (

        lieu.note !== null &&

        lieu.note !== undefined

    ) {

        html += `

            <div class="fiche-rubrique">

                <span class="icone">⭐</span>

                <strong>Note :</strong>

                ${echapperHTML(
                    lieu.note
                )}/5

            </div>

        `;
    }


    // ------------------------------------------------------
    // ADRESSE
    // ------------------------------------------------------

    if (lieu.adresse) {

        html += `

            <div class="fiche-rubrique">

                <span class="icone">🏠</span>

                <strong>Adresse :</strong><br>

                ${echapperHTML(
                    lieu.adresse
                )}

            </div>

        `;
    }


    html += `

        </div>

    `;


    // ======================================================
    // VISITES
    // ======================================================

    const visites =
        obtenirVisitesLieu(
            lieu.lieu_id
        );


    if (visites.length > 0) {

        html += `

            <div class="fiche-visites">

                <div class="fiche-sous-titre">

                    🗓️ Visites

                </div>

        `;


        visites.forEach(

            visite => {

                const voyage =

                    visite.voyage_id

                        ? voyagesParId[
                            visite.voyage_id
                        ]

                        : null;


                const nomContexte =

                    obtenirLibelleContexte(

                        visite.type_contexte
                    );


                const periode =

                    afficherPeriode(

                        visite.date_debut,

                        visite.date_fin,

                        visite.date_precision,

                        visite.date_texte
                    );


                html += `

                    <div class="fiche-visite">

                        <div class="visite-titre">

                            ${echapperHTML(
                                nomContexte ||
                                "Visite"
                            )}

                        </div>

                `;


                // ------------------------------------------
                // VOYAGE
                // ------------------------------------------

                if (voyage) {

                    html += `

                        <div class="visite-detail">

                            ✈️

                            <strong>Voyage :</strong>

                            ${echapperHTML(
                                voyage.nom
                            )}

                        </div>

                    `;
                }


                // ------------------------------------------
                // DATE
                // ------------------------------------------

                if (periode) {

                    html += `

                        <div class="visite-detail">

                            📅

                            <strong>Date :</strong>

                            ${periode}

                        </div>

                    `;
                }


                // ------------------------------------------
                // EXPERIENCE
                // ------------------------------------------

                if (visite.type_experience) {

                    html += `

                        <div class="visite-detail">

                            ✨

                            <strong>Expérience :</strong>

                            ${echapperHTML(

                                visite.type_experience

                            )}

                        </div>

                    `;
                }


                // ------------------------------------------
                // NOTE
                // ------------------------------------------

                if (

                    visite.note !== null &&

                    visite.note !== undefined

                ) {

                    html += `

                        <div class="visite-detail">

                            ⭐

                            <strong>Note :</strong>

                            ${echapperHTML(
                                visite.note
                            )}/5

                        </div>

                    `;
                }


                // ------------------------------------------
                // DESCRIPTION
                // ------------------------------------------

                if (visite.description) {

                    html += `

                        <div class="visite-detail">

                            ${echapperHTML(
                                visite.description
                            )}

                        </div>

                    `;
                }


                // ------------------------------------------
                // NOTES
                // ------------------------------------------

                if (visite.notes) {

                    html += `

                        <div class="visite-detail">

                            <em>

                                ${echapperHTML(
                                    visite.notes
                                )}

                            </em>

                        </div>

                    `;
                }


                html += `

                    </div>

                `;
            }
        );


        html += `

            </div>

        `;
    }


    // ======================================================
    // DESCRIPTION DU LIEU
    // ======================================================

    if (lieu.description) {

        html += `

            <div class="fiche-description">

                <div class="fiche-sous-titre">

                    Description

                </div>

                <div>

                    ${echapperHTML(
                        lieu.description
                    )}

                </div>

            </div>

        `;
    }


    // ======================================================
    // NOTES PERSONNELLES DU LIEU
    // ======================================================

    if (lieu.notes) {

        html += `

            <div class="fiche-notes">

                <div class="fiche-sous-titre">

                    Notes personnelles

                </div>

                <div>

                    ${echapperHTML(
                        lieu.notes
                    )}

                </div>

            </div>

        `;
    }


    // ======================================================
    // FIN
    // ======================================================

    html += `

        </div>

    `;


    return html;
}


// ==========================================================
// REMPLISSAGE DES FILTRES
// ==========================================================

function remplirFiltres() {


    // ======================================================
    // VOYAGES
    // ======================================================

    filtreVoyage.innerHTML = `

        <option value="">

            Tous les voyages

        </option>

    `;


    const voyagesTries =

        [...tousLesVoyages]

            .sort(

                (a, b) =>

                    String(a.nom || "")

                        .localeCompare(

                            String(b.nom || ""),

                            "fr"
                        )
            );


    voyagesTries.forEach(

        voyage => {

            if (!voyage.voyage_id) {

                return;
            }


            const option =

                document.createElement(
                    "option"
                );


            option.value =

                voyage.voyage_id;


            option.textContent =

                voyage.nom ||

                voyage.voyage_id;


            filtreVoyage.appendChild(
                option
            );
        }
    );


    // ======================================================
    // CONTEXTES
    // ======================================================

    filtreContexte.innerHTML = `

        <option value="">

            Tous les contextes

        </option>

    `;


    const contextesCodes =

        [

            ...new Set(

                toutesLesVisites

                    .map(

                        visite =>

                            visite.type_contexte

                    )

                    .filter(Boolean)

            )

        ];


    contextesCodes

        .sort(

            (a, b) =>

                obtenirLibelleContexte(a)

                    .localeCompare(

                        obtenirLibelleContexte(b),

                        "fr"
                    )
        )

        .forEach(

            code => {

                const option =

                    document.createElement(
                        "option"
                    );


                option.value = code;


                option.textContent =

                    obtenirLibelleContexte(
                        code
                    );


                filtreContexte.appendChild(
                    option
                );
            }
        );


    // ======================================================
    // TYPES DE LIEU
    // ======================================================

    filtreTypeLieu.innerHTML = `

        <option value="">

            Tous les types

        </option>

    `;


    const typesLieu =

        [

            ...new Set(

                tousLesLieux

                    .map(

                        lieu =>

                            lieu.type_lieu

                    )

                    .filter(Boolean)

            )

        ]

            .sort(

                (a, b) =>

                    String(a)

                        .localeCompare(

                            String(b),

                            "fr"
                        )
            );


    typesLieu.forEach(

        type => {

            const option =

                document.createElement(
                    "option"
                );


            option.value = type;


            option.textContent = type;


            filtreTypeLieu.appendChild(
                option
            );
        }
    );


    // ======================================================
    // EXPERIENCES
    // ======================================================

    filtreExperience.innerHTML = `

        <option value="">

            Toutes les expériences

        </option>

    `;


    const experiences =

        [

            ...new Set(

                toutesLesVisites

                    .map(

                        visite =>

                            visite.type_experience

                    )

                    .filter(Boolean)

            )

        ]

            .sort(

                (a, b) =>

                    String(a)

                        .localeCompare(

                            String(b),

                            "fr"
                        )
            );


    experiences.forEach(

        experience => {

            const option =

                document.createElement(
                    "option"
                );


            option.value = experience;


            option.textContent = experience;


            filtreExperience.appendChild(
                option
            );
        }
    );
}


// ==========================================================
// SUPPRESSION DES MARQUEURS
// ==========================================================

function supprimerMarqueurs() {

    marqueurs.forEach(

        marqueur => {

            marqueur.remove();

        }
    );


    marqueurs = [];
}


// ==========================================================
// SUPPRESSION HEATMAP
// ==========================================================

function supprimerHeatmap() {

    if (

        !map ||

        !map.isStyleLoaded()

    ) {

        return;
    }


    if (

        map.getLayer(
            "heatmap-lieux"
        )

    ) {

        map.removeLayer(
            "heatmap-lieux"
        );
    }


    if (

        map.getSource(
            "lieux-heatmap"
        )

    ) {

        map.removeSource(
            "lieux-heatmap"
        );
    }
}


// ==========================================================
// FILTRAGE DES LIEUX
// ==========================================================

function lieuCorrespondAuxFiltres(lieu) {


    // ======================================================
    // FILTRE VOYAGE
    // ======================================================

    const voyageSelectionne =

        filtreVoyage.value;


    if (voyageSelectionne) {

        const voyages =

            obtenirVoyagesLieu(
                lieu.lieu_id
            );


        if (

            !voyages.some(

                voyageId =>

                    String(voyageId) ===

                    String(voyageSelectionne)

            )

        ) {

            return false;
        }
    }


    // ======================================================
    // FILTRE CONTEXTE
    // ======================================================

    const contexteSelectionne =

        filtreContexte.value;


    if (contexteSelectionne) {

        const contextes =

            obtenirContextesLieu(
                lieu.lieu_id
            );


        if (

            !contextes.some(

                contexte =>

                    String(contexte) ===

                    String(contexteSelectionne)

            )

        ) {

            return false;
        }
    }


    // ======================================================
    // FILTRE TYPE DE LIEU
    // ======================================================

    const typeLieuSelectionne =

        filtreTypeLieu.value;


    if (

        typeLieuSelectionne &&

        lieu.type_lieu !==
            typeLieuSelectionne

    ) {

        return false;
    }


    // ======================================================
    // FILTRE EXPERIENCE
    // ======================================================

    const experienceSelectionnee =

        filtreExperience.value;


    if (experienceSelectionnee) {

        const visites =

            obtenirVisitesLieu(
                lieu.lieu_id
            );


        const correspond =

            visites.some(

                visite =>

                    visite.type_experience ===

                    experienceSelectionnee

            );


        if (!correspond) {

            return false;
        }
    }


    // ======================================================
    // GEOLOCALISATION
    // ======================================================

    if (

        lieu.latitude === null ||

        lieu.longitude === null ||

        lieu.latitude === undefined ||

        lieu.longitude === undefined

    ) {

        return false;
    }


    return true;
}


// ==========================================================
// AFFICHAGE DES LIEUX FILTRES
// ==========================================================

function afficherLieuxFiltres() {


    // ======================================================
    // ATTENDRE LA CARTE
    // ======================================================

    if (

        !map ||

        !map.isStyleLoaded()

    ) {

        return;
    }


    // ======================================================
    // NETTOYAGE
    // ======================================================

    supprimerMarqueurs();

    supprimerHeatmap();


    // ======================================================
    // FILTRAGE
    // ======================================================

    const lieuxFiltres =

        tousLesLieux.filter(

            lieu =>

                lieuCorrespondAuxFiltres(
                    lieu
                )

        );


    // ======================================================
    // COMPTEUR
    // ======================================================

    compteur.textContent =

        lieuxFiltres.length +

        " lieux";


    // ======================================================
    // AUCUN RESULTAT
    // ======================================================

    if (lieuxFiltres.length === 0) {

        return;
    }


    // ======================================================
    // BOUNDS
    // ======================================================

    const bounds =

        new maplibregl.LngLatBounds();


    lieuxFiltres.forEach(

        lieu => {

            bounds.extend([

                Number(
                    lieu.longitude
                ),

                Number(
                    lieu.latitude
                )

            ]);
        }
    );


    // ======================================================
    // HEATMAP
    // ======================================================

    if (

        modeAffichage ===
        "heatmap"

    ) {


        const geojson = {

            type:
                "FeatureCollection",

            features:

                lieuxFiltres.map(

                    lieu => ({

                        type:
                            "Feature",

                        geometry: {

                            type:
                                "Point",

                            coordinates: [

                                Number(
                                    lieu.longitude
                                ),

                                Number(
                                    lieu.latitude
                                )

                            ]

                        },

                        properties: {

                            lieu_id:
                                lieu.lieu_id

                        }

                    })

                )

        };


        map.addSource(

            "lieux-heatmap",

            {

                type:
                    "geojson",

                data:
                    geojson

            }

        );


        map.addLayer({

            id:
                "heatmap-lieux",

            type:
                "heatmap",

            source:
                "lieux-heatmap",

            maxzoom:
                12,

            paint: {


                "heatmap-intensity": [

                    "interpolate",

                    ["linear"],

                    ["zoom"],

                    2,
                    0.7,

                    4,
                    0.9,

                    6,
                    1.15,

                    8,
                    1.4,

                    10,
                    1.7,

                    12,
                    2.0

                ],


                "heatmap-radius": [

                    "interpolate",

                    ["linear"],

                    ["zoom"],

                    2,
                    14,

                    4,
                    20,

                    6,
                    27,

                    8,
                    34,

                    10,
                    40,

                    12,
                    46

                ],


                "heatmap-opacity": [

                    "interpolate",

                    ["linear"],

                    ["zoom"],

                    2,
                    0.70,

                    5,
                    0.75,

                    8,
                    0.80,

                    12,
                    0.84

                ],


                "heatmap-color": [

                    "interpolate",

                    ["linear"],

                    ["heatmap-density"],

                    0,
                    "rgba(33,102,172,0)",

                    0.08,
                    "rgba(33,102,172,0.30)",

                    0.20,
                    "rgba(103,169,207,0.55)",

                    0.35,
                    "rgba(209,229,240,0.70)",

                    0.50,
                    "rgba(253,219,199,0.78)",

                    0.65,
                    "rgba(239,138,98,0.84)",

                    0.80,
                    "rgba(215,48,39,0.90)",

                    1,
                    "rgba(165,0,38,0.96)"

                ]

            }

        });


        map.fitBounds(

            bounds,

            {

                padding:
                    70,

                maxZoom:
                    6,

                duration:
                    700

            }

        );


        return;
    }


    // ======================================================
    // MARQUEURS
    // ======================================================

    lieuxFiltres.forEach(

        lieu => {

            const photosLieu =

                photosParLieu[
                    lieu.lieu_id
                ] || [];


            const popup =

                new maplibregl.Popup({

                    offset:
                        25,

                    maxWidth:
                        "420px"

                });


            popup.setHTML(

                creerFiche(

                    lieu,

                    photosLieu

                )

            );


            const marqueur =

                new maplibregl.Marker()

                    .setLngLat([

                        Number(
                            lieu.longitude
                        ),

                        Number(
                            lieu.latitude
                        )

                    ])

                    .setPopup(
                        popup
                    )

                    .addTo(
                        map
                    );


            marqueurs.push(
                marqueur
            );

        }
    );


    // ======================================================
    // CADRAGE
    // ======================================================

    map.fitBounds(

        bounds,

        {

            padding:
                70,

            maxZoom:
                6,

            duration:
                700

        }

    );
}


// ==========================================================
// FONCTION GENERIQUE SUPABASE
// ==========================================================

async function chargerTable(

    nomTable,

    options = ""

) {

    const url =

        SUPABASE_URL +

        "/rest/v1/" +

        nomTable +

        "?select=*" +

        options;


    const response =

        await fetch(

            url,

            {

                method:
                    "GET",

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_KEY,

                    "Accept":
                        "application/json"

                }

            }

        );


    if (!response.ok) {

        throw new Error(

            nomTable +

            " : HTTP " +

            response.status

        );
    }


    return await response.json();
}


// ==========================================================
// CHARGEMENT DES DONNEES
// ==========================================================

async function chargerDonnees() {

    compteur.textContent =

        "Connexion à Supabase...";


    try {


        // ==================================================
        // 1. LIEUX
        // ==================================================

        tousLesLieux =

            await chargerTable(

                "lieux",

                "&order=lieu_id.asc"

            );


        console.log(

            "Lieux chargés :",

            tousLesLieux.length

        );


        // ==================================================
        // 2. VOYAGES
        // ==================================================

        tousLesVoyages =

            await chargerTable(

                "voyages",

                "&order=voyage_id.asc"

            );


        console.log(

            "Voyages chargés :",

            tousLesVoyages.length

        );


        // ==================================================
        // 3. VISITES
        // ==================================================

        toutesLesVisites =

            await chargerTable(

                "visites",

                "&order=visite_id.asc"

            );


        console.log(

            "Visites chargées :",

            toutesLesVisites.length

        );


        // ==================================================
        // 4. PHOTOS
        // ==================================================

        toutesLesPhotos =

            await chargerTable(

                "photos",

                "&order=ordre.asc"

            );


        console.log(

            "Photos chargées :",

            toutesLesPhotos.length

        );


        // ==================================================
        // 5. TYPES DE CONTEXTE
        // ==================================================

        try {

            tousLesContextes =

                await chargerTable(

                    "types_contexte",

                    "&order=code.asc"

                );


        } catch (erreurContexte) {

            console.warn(

                "Impossible de charger " +
                "types_contexte :",

                erreurContexte

            );


            tousLesContextes = [];
        }


        console.log(

            "Contextes chargés :",

            tousLesContextes.length

        );


        // ==================================================
        // 6. INDEX VOYAGES
        // ==================================================

        voyagesParId = {};


        tousLesVoyages.forEach(

            voyage => {

                if (voyage.voyage_id) {

                    voyagesParId[
                        voyage.voyage_id
                    ] = voyage;

                }

            }

        );


        // ==================================================
        // 7. INDEX VISITES PAR LIEU
        // ==================================================

        visitesParLieu = {};


        toutesLesVisites.forEach(

            visite => {

                if (!visite.lieu_id) {

                    return;
                }


                if (

                    !visitesParLieu[
                        visite.lieu_id
                    ]

                ) {

                    visitesParLieu[
                        visite.lieu_id
                    ] = [];

                }


                visitesParLieu[
                    visite.lieu_id
                ].push(

                    visite

                );

            }

        );


        // ==================================================
        // 8. INDEX PHOTOS PAR LIEU
        // ==================================================

        photosParLieu = {};


        toutesLesPhotos.forEach(

            photo => {

                if (!photo.lieu_id) {

                    return;
                }


                if (

                    !photosParLieu[
                        photo.lieu_id
                    ]

                ) {

                    photosParLieu[
                        photo.lieu_id
                    ] = [];

                }


                photosParLieu[
                    photo.lieu_id
                ].push(

                    photo

                );

            }

        );


        // ==================================================
        // 9. INDEX CONTEXTES
        // ==================================================

        contextesParCode = {};


        tousLesContextes.forEach(

            contexte => {

                if (contexte.code) {

                    contextesParCode[
                        contexte.code
                    ] = contexte;

                }

            }

        );


        // ==================================================
        // 10. FILTRES
        // ==================================================

        remplirFiltres();


        // ==================================================
        // 11. AFFICHAGE INITIAL
        // ==================================================

        if (

            map.isStyleLoaded()

        ) {

            afficherLieuxFiltres();

        } else {

            map.once(

                "load",

                function() {

                    afficherLieuxFiltres();

                }

            );

        }


    } catch (erreur) {

        console.error(

            "ERREUR ATLAS :",

            erreur

        );


        afficherErreur(

            "Impossible de charger les données : " +

            erreur.message

        );

    }

}


// ==========================================================
// EVENEMENTS DES FILTRES
// ==========================================================

filtreVoyage.addEventListener(

    "change",

    afficherLieuxFiltres

);


filtreContexte.addEventListener(

    "change",

    afficherLieuxFiltres

);


filtreTypeLieu.addEventListener(

    "change",

    afficherLieuxFiltres

);


filtreExperience.addEventListener(

    "change",

    afficherLieuxFiltres

);


// ==========================================================
// CHANGEMENT DU MODE CARTE
// ==========================================================

modeCarte.addEventListener(

    "change",

    function() {

        modeAffichage =

            modeCarte.value;


        afficherLieuxFiltres();

    }

);


// ==========================================================
// GALERIE PHOTO
// ==========================================================

document.addEventListener(

    "click",

    function(event) {


        const miniature =

            event.target.closest(

                ".fiche-miniature"

            );


        if (!miniature) {

            return;
        }


        const popup =

            miniature.closest(

                ".maplibregl-popup"

            );


        if (!popup) {

            return;
        }


        const grandePhoto =

            popup.querySelector(

                ".fiche-photo"

            );


        if (!grandePhoto) {

            return;
        }


        grandePhoto.src =

            miniature.dataset.photoUrl;


        grandePhoto.alt =

            miniature.dataset.photoTitre ||

            "";

    }

);


// ==========================================================
// LANCEMENT
// ==========================================================

chargerDonnees();


</script>
