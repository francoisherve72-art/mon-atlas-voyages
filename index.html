<!-- MAPLIBRE -->

<script
    src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js">

<script>


// ==========================================================
// CONFIGURATION
// ==========================================================

const SUPABASE_URL =
    "https://xiddtmzehxwfncnyuvid.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_5Sgu_vod3bSaf1ecQeaD8A_BqZ_8HYj";


const MAPTILER_KEY =
    "knGFRadbYDcoOEytbBIZ";


// ==========================================================
// ELEMENTS HTML
// ==========================================================

const compteur =
    document.getElementById("compteur");


const message =
    document.getElementById("message");


const filtreVoyage =
    document.getElementById("filtreVoyage");


const filtreTypeLieu =
    document.getElementById("filtreTypeLieu");


const filtreExperience =
    document.getElementById("filtreExperience");


// ==========================================================
// DONNEES GLOBALES
// ==========================================================

let tousLesLieux = [];

let tousLesVoyages = [];

let toutesLesPhotos = [];

let voyagesParId = {};

let photosParLieu = {};

let marqueurs = [];


// ==========================================================
// AFFICHAGE DES ERREURS
// ==========================================================

function afficherErreur(texte) {

    console.error(texte);

    compteur.textContent =
        "Erreur";

    message.textContent =
        "⚠️ " + texte;

    message.style.display =
        "block";
}


// ==========================================================
// ECHAPPEMENT HTML
// ==========================================================

function echapperHTML(texte) {

    if (
        texte === null ||
        texte === undefined
    ) {

        return "";
    }


    return String(texte)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}


// ==========================================================
// FORMAT DATE
// ==========================================================

function formaterDate(date) {

    if (!date) {

        return "";
    }


    const morceaux =
        String(date).split("-");


    if (morceaux.length !== 3) {

        return date;
    }


    return (
        morceaux[2] +
        "/" +
        morceaux[1] +
        "/" +
        morceaux[0]
    );
}


// ==========================================================
// PERIODE
// ==========================================================

function afficherPeriode(
    dateDebut,
    dateFin,
    precision,
    dateTexte
) {

    if (dateTexte) {

        return echapperHTML(
            dateTexte
        );
    }


    if (!dateDebut) {

        return "";
    }


    const debut =
        formaterDate(dateDebut);


    if (
        !dateFin ||
        dateFin === dateDebut
    ) {

        return debut;
    }


    return (
        debut +
        " → " +
        formaterDate(dateFin)
    );
}


// ==========================================================
// CARTE
// ==========================================================

let map;


try {

    map =
        new maplibregl.Map({

            container: "map",

            style:
                "https://api.maptiler.com/maps/streets-v4/style.json?key=" +
                MAPTILER_KEY,

            center: [
                2.5,
                46.5
            ],

            zoom: 4
        });


    map.addControl(
        new maplibregl.NavigationControl(),
        "top-right"
    );


} catch (erreur) {

    afficherErreur(
        "Impossible d'initialiser la carte : " +
        erreur.message
    );
}

// ==========================================================
// CREATION DE LA FICHE
// ==========================================================

function creerFiche(
    lieu,
    voyage,
    photos
) {

    let html = `
        <div class="fiche-lieu">
    `;


    // ======================================================
    // PHOTO PRINCIPALE
    // ======================================================

    let photoPrincipale = null;


    if (Array.isArray(photos)) {

        photoPrincipale =
            photos.find(
                photo =>
                    photo.photo_principale === true
            ) || photos[0];
    }


    if (
        photoPrincipale &&
        photoPrincipale.fichier
    ) {

        const urlPhoto =
            SUPABASE_URL +
            "/storage/v1/object/public/photos/" +
            photoPrincipale.fichier;


        html += `
            <img
                class="fiche-photo"
                src="${echapperHTML(urlPhoto)}"
                alt="${echapperHTML(
                    photoPrincipale.titre ||
                    lieu.nom
                )}"
            >
        `;
    }


    // ======================================================
    // GALERIE PHOTO
    // ======================================================

    if (
        Array.isArray(photos) &&
        photos.length > 1
    ) {

        html += `
            <div class="fiche-galerie">
        `;


        photos.forEach(
            photo => {

                if (!photo.fichier) {
                    return;
                }


                const urlPhoto =
                    SUPABASE_URL +
                    "/storage/v1/object/public/photos/" +
                    photo.fichier;


                html += `
                    <img
                        class="fiche-miniature"

                        src="${echapperHTML(
                            urlPhoto
                        )}"

                        data-photo-url="${echapperHTML(
                            urlPhoto
                        )}"

                        data-photo-titre="${echapperHTML(
                            photo.titre ||
                            lieu.nom
                        )}"

                        alt="${echapperHTML(
                            photo.titre ||
                            lieu.nom
                        )}"
                    >
                `;
            }
        );


        html += `
            </div>
        `;
    }


    // ======================================================
    // TITRE
    // ======================================================

    html += `
        <div class="fiche-titre">
            ${echapperHTML(lieu.nom)}
        </div>
    `;


    // ======================================================
    // LOCALISATION
    // ======================================================

    const localisation = [

        lieu.ville,

        lieu.pays

    ]
        .filter(Boolean)
        .map(echapperHTML)
        .join(" · ");


    if (localisation) {

        html += `
            <div class="fiche-localisation">
                📍 ${localisation}
            </div>
        `;
    }


    // ======================================================
    // INFORMATIONS PRINCIPALES
    // ======================================================

    html += `
        <div class="fiche-infos">
    `;


    // ------------------------------------------------------
    // VOYAGE
    // ------------------------------------------------------

    if (voyage) {

        html += `
            <div class="fiche-rubrique">
                <span class="icone">✈️</span>
                <strong>Voyage :</strong>
                ${echapperHTML(voyage.nom)}
            </div>
        `;
    }


    // ------------------------------------------------------
    // DATE
    // ------------------------------------------------------

    const dateLieu =
        afficherPeriode(

            lieu.date_debut,

            lieu.date_fin,

            lieu.date_precision,

            lieu.date_texte
        );


    if (dateLieu) {

        html += `
            <div class="fiche-rubrique">
                <span class="icone">📅</span>
                <strong>Date :</strong>
                ${dateLieu}
            </div>
        `;
    }


    // ------------------------------------------------------
    // NOTE
    // ------------------------------------------------------

    if (
        lieu.note !== null &&
        lieu.note !== undefined
    ) {

        html += `
            <div class="fiche-rubrique">
                <span class="icone">⭐</span>
                <strong>Note :</strong>
                ${echapperHTML(lieu.note)}/5
            </div>
        `;
    }


    // ------------------------------------------------------
    // TYPE DE LIEU
    // ------------------------------------------------------

    if (lieu.type_lieu) {

        html += `
            <div class="fiche-rubrique">
                <span class="icone">📍</span>
                <strong>Type :</strong>
                ${echapperHTML(
                    lieu.type_lieu
                )}
            </div>
        `;
    }


    // ------------------------------------------------------
    // TYPE D'EXPERIENCE
    // ------------------------------------------------------

    if (lieu.type_experience) {

        html += `
            <div class="fiche-rubrique">
                <span class="icone">✨</span>
                <strong>Expérience :</strong>
                ${echapperHTML(
                    lieu.type_experience
                )}
            </div>
        `;
    }


    // ------------------------------------------------------
    // ADRESSE
    // ------------------------------------------------------

    if (lieu.adresse) {

        html += `
            <div class="fiche-rubrique">
                <span class="icone">🏠</span>
                <strong>Adresse :</strong><br>
                ${echapperHTML(
                    lieu.adresse
                )}
            </div>
        `;
    }


    html += `
        </div>
    `;


    // ======================================================
    // DESCRIPTION
    // ======================================================

    if (lieu.description) {

        html += `
            <div class="fiche-description">

                <div class="fiche-sous-titre">
                    Description
                </div>

                <div>
                    ${echapperHTML(
                        lieu.description
                    )}
                </div>

            </div>
        `;
    }


    // ======================================================
    // NOTES PERSONNELLES
    // ======================================================

    if (lieu.notes) {

        html += `
            <div class="fiche-notes">

                <div class="fiche-sous-titre">
                    Notes personnelles
                </div>

                <div>
                    ${echapperHTML(
                        lieu.notes
                    )}
                </div>

            </div>
        `;
    }


    // ======================================================
    // FIN DE LA FICHE
    // ======================================================

    html += `
        </div>
    `;


    return html;

}


// ==========================================================
// REMPLISSAGE DES FILTRES
// ==========================================================

function remplirFiltres() {


    // ======================================================
    // VOYAGES
    // ======================================================

    filtreVoyage.innerHTML = `

        <option value="">
            Tous les voyages
        </option>

    `;


    const voyagesTries =
        [...tousLesVoyages].sort(
            (a, b) =>
                String(a.nom || "")
                    .localeCompare(
                        String(b.nom || ""),
                        "fr"
                    )
        );


    voyagesTries.forEach(
        voyage => {

            if (!voyage.voyage_id) {

                return;
            }


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                voyage.voyage_id;


            option.textContent =
                voyage.nom ||
                voyage.voyage_id;


            filtreVoyage.appendChild(
                option
            );
        }
    );


    // ======================================================
    // TYPES DE LIEU
    // ======================================================

    filtreTypeLieu.innerHTML = `

        <option value="">
            Tous les types
        </option>

    `;


    const typesLieu =
        [
            ...new Set(

                tousLesLieux

                    .map(
                        lieu =>
                            lieu.type_lieu
                    )

                    .filter(Boolean)

            )
        ]
        .sort(
            (a, b) =>
                String(a).localeCompare(
                    String(b),
                    "fr"
                )
        );


    typesLieu.forEach(
        type => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                type;


            option.textContent =
                type;


            filtreTypeLieu.appendChild(
                option
            );
        }
    );


    // ======================================================
    // EXPERIENCES
    // ======================================================

    filtreExperience.innerHTML = `

        <option value="">
            Toutes les expériences
        </option>

    `;


    const experiences =
        [
            ...new Set(

                tousLesLieux

                    .map(
                        lieu =>
                            lieu.type_experience
                    )

                    .filter(Boolean)

            )
        ]
        .sort(
            (a, b) =>
                String(a).localeCompare(
                    String(b),
                    "fr"
                )
        );


    experiences.forEach(
        experience => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                experience;


            option.textContent =
                experience;


            filtreExperience.appendChild(
                option
            );
        }
    );
}


// ==========================================================
// SUPPRESSION DES MARQUEURS
// ==========================================================

function supprimerMarqueurs() {

    marqueurs.forEach(
        marqueur => {

            marqueur.remove();
        }
    );


    marqueurs = [];
}


// ==========================================================
// AFFICHAGE DES LIEUX FILTRES
// ==========================================================

function afficherLieuxFiltres() {


    supprimerMarqueurs();


    const voyageSelectionne =
        filtreVoyage.value;


    const typeLieuSelectionne =
        filtreTypeLieu.value;


    const experienceSelectionnee =
        filtreExperience.value;


    const lieuxFiltres =
        tousLesLieux.filter(
            lieu => {


                // ------------------------------
                // FILTRE VOYAGE
                // ------------------------------

                if (
    voyageSelectionne &&
    String(lieu.voyage_id) !==
        String(voyageSelectionne)
) {

    return false;
}


                // ------------------------------
                // FILTRE TYPE DE LIEU
                // ------------------------------

                if (
                    typeLieuSelectionne &&
                    lieu.type_lieu !==
                        typeLieuSelectionne
                ) {

                    return false;
                }


                // ------------------------------
                // FILTRE EXPERIENCE
                // ------------------------------

                if (
                    experienceSelectionnee &&
                    lieu.type_experience !==
                        experienceSelectionnee
                ) {

                    return false;
                }


                return (
                    lieu.latitude !== null &&
                    lieu.longitude !== null
                );

            }
        );


    // ======================================================
    // COMPTEUR
    // ======================================================

    compteur.textContent =
        lieuxFiltres.length +
        " lieux";


    // ======================================================
    // NOUVEAUX MARQUEURS
    // ======================================================

    const bounds =
        new maplibregl.LngLatBounds();


    lieuxFiltres.forEach(
        lieu => {


            const voyage =
                voyagesParId[
                    lieu.voyage_id
                ];


            const photosLieu =
                photosParLieu[
                    lieu.lieu_id
                ] || [];


            const popup =
                new maplibregl.Popup({

                    offset: 25,

                    maxWidth:
                        "420px"
                });


            popup.setHTML(

                creerFiche(

                    lieu,

                    voyage,

                    photosLieu
                )
            );


            const marqueur =
                new maplibregl.Marker()

                    .setLngLat([

                        Number(
                            lieu.longitude
                        ),

                        Number(
                            lieu.latitude
                        )

                    ])

                    .setPopup(popup)

                    .addTo(map);


            marqueurs.push(
                marqueur
            );


            bounds.extend([

                Number(
                    lieu.longitude
                ),

                Number(
                    lieu.latitude
                )

            ]);

        }
    );


    // ======================================================
    // CADRAGE
    // ======================================================

    if (lieuxFiltres.length > 0) {

        map.fitBounds(

            bounds,

            {

                padding: 70,

                maxZoom: 6,

                duration: 700
            }
        );
    }
}


// ==========================================================
// CHARGEMENT DES DONNEES
// ==========================================================

async function chargerDonnees() {

    compteur.textContent =
        "Connexion à Supabase...";


    try {


        // ==================================================
        // 1. LIEUX
        // ==================================================

        const urlLieux =
            SUPABASE_URL +
            "/rest/v1/lieux" +
            "?select=*" +
            "&order=lieu_id.asc";


        const responseLieux =
            await fetch(

                urlLieux,

                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Accept":
                            "application/json"
                    }
                }
            );


        if (!responseLieux.ok) {

            throw new Error(
                "Lieux : HTTP " +
                responseLieux.status
            );
        }


        tousLesLieux =
            await responseLieux.json();


        console.log(
            "Lieux chargés :",
            tousLesLieux.length
        );


        // ==================================================
        // 2. VOYAGES
        // ==================================================

        const urlVoyages =
            SUPABASE_URL +
            "/rest/v1/voyages" +
            "?select=*";


        const responseVoyages =
            await fetch(

                urlVoyages,

                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Accept":
                            "application/json"
                    }
                }
            );


        if (!responseVoyages.ok) {

            throw new Error(
                "Voyages : HTTP " +
                responseVoyages.status
            );
        }


        tousLesVoyages =
            await responseVoyages.json();


        console.log(
            "Voyages chargés :",
            tousLesVoyages.length
        );


        // ==================================================
        // 3. PHOTOS
        // ==================================================

        const urlPhotos =
            SUPABASE_URL +
            "/rest/v1/photos" +
            "?select=*" +
            "&order=ordre.asc";


        const responsePhotos =
            await fetch(

                urlPhotos,

                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Accept":
                            "application/json"
                    }
                }
            );


        if (!responsePhotos.ok) {

            throw new Error(
                "Photos : HTTP " +
                responsePhotos.status
            );
        }


        toutesLesPhotos =
            await responsePhotos.json();


        console.log(
            "Photos chargées :",
            toutesLesPhotos.length
        );


        // ==================================================
        // 4. INDEX VOYAGES
        // ==================================================

        voyagesParId = {};


        tousLesVoyages.forEach(
            voyage => {

                if (voyage.voyage_id) {

                    voyagesParId[
                        voyage.voyage_id
                    ] = voyage;
                }
            }
        );


        // ==================================================
        // 5. INDEX PHOTOS
        // ==================================================

        photosParLieu = {};


        toutesLesPhotos.forEach(
            photo => {

                if (!photo.lieu_id) {

                    return;
                }


                if (
                    !photosParLieu[
                        photo.lieu_id
                    ]
                ) {

                    photosParLieu[
                        photo.lieu_id
                    ] = [];
                }


                photosParLieu[
                    photo.lieu_id
                ].push(photo);
            }
        );


        // ==================================================
        // 6. FILTRES
        // ==================================================

        remplirFiltres();


        // ==================================================
        // 7. AFFICHAGE INITIAL
        // ==================================================

        afficherLieuxFiltres();


    } catch (erreur) {


        console.error(
            "ERREUR ATLAS :",
            erreur
        );


        afficherErreur(

            "Impossible de charger les données : " +
            erreur.message
        );
    }
}


// ==========================================================
// EVENEMENTS DES FILTRES
// ==========================================================

filtreVoyage.addEventListener(
    "change",
    afficherLieuxFiltres
);


filtreTypeLieu.addEventListener(
    "change",
    afficherLieuxFiltres
);


filtreExperience.addEventListener(
    "change",
    afficherLieuxFiltres
);


// ==========================================================
// GALERIE PHOTO
// ==========================================================

document.addEventListener(
    "click",

    function(event) {


        const miniature =
            event.target.closest(
                ".fiche-miniature"
            );


        if (!miniature) {

            return;
        }


        const popup =
            miniature.closest(
                ".maplibregl-popup"
            );


        if (!popup) {

            return;
        }


        const grandePhoto =
            popup.querySelector(
                ".fiche-photo"
            );


        if (!grandePhoto) {

            return;
        }


        grandePhoto.src =
            miniature.dataset.photoUrl;


        grandePhoto.alt =
            miniature.dataset.photoTitre ||
            "";
    }
);


// ==========================================================
// LANCEMENT
// ==========================================================

chargerDonnees();


</script>

</html>
