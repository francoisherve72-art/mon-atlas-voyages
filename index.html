<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon Atlas</title>

    <link
        href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"
        rel="stylesheet"
    />

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            background: white;
            border-bottom: 1px solid #ddd;
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        #compteur {
            font-size: 14px;
            color: #666;
        }

        main {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* ==================================================
           PANNEAU VOYAGE
           ================================================== */

        #panneau-voyage {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 5;

            width: 300px;
            max-width: calc(100% - 30px);

            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.20);

            padding: 16px;
            box-sizing: border-box;

            display: none;
        }

        #panneau-voyage.visible {
            display: block;
        }

        .voyage-titre {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .voyage-dates {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .voyage-infos {
            font-size: 14px;
            line-height: 1.5;
        }

        .voyage-description {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
            font-size: 14px;
            line-height: 1.45;
        }

        .voyage-fermer {
            position: absolute;
            top: 8px;
            right: 10px;

            border: none;
            background: none;

            font-size: 22px;
            color: #777;

            cursor: pointer;
        }

        .voyage-fermer:hover {
            color: #000;
        }

        /* ==================================================
           MESSAGE D'ERREUR
           ================================================== */

        #message {
            position: fixed;
            top: 70px;
            left: 10px;
            right: 10px;
            z-index: 1000;

            padding: 10px;

            background: white;
            border-radius: 6px;

            box-shadow: 0 2px 8px rgba(0,0,0,0.2);

            display: none;
        }

        /* ==================================================
           FICHES LIEUX
           ================================================== */

        .fiche-lieu {
            font-family: Arial, sans-serif;
            line-height: 1.4;
        }

        .fiche-titre {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .fiche-localisation {
            color: #666;
            margin-bottom: 10px;
        }

        .fiche-rubrique {
            margin-top: 7px;
        }

        .fiche-description {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
        }

        .fiche-notes {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
            color: #555;
        }

        .fiche-photo {
            display: block;
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .fiche-galerie {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            margin-bottom: 10px;
        }

        .fiche-miniature {
            width: 64px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .fiche-miniature:active {
            opacity: 0.7;
        }

        .icone {
            margin-right: 4px;
        }

    </style>
</head>

<body>

<header>
    <h1>Mon Atlas</h1>
    <span id="compteur">Chargement...</span>
</header>

<div id="message"></div>

<main>

    <div id="map"></div>

    <!-- ==================================================
         PANNEAU VOYAGE
         ================================================== -->

    <div id="panneau-voyage">

        <button
            class="voyage-fermer"
            id="fermer-voyage"
