<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mon Atlas</title>

    <!-- MAPLIBRE -->
    <link
        href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"
        rel="stylesheet"
    >

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            font-family: Arial, sans-serif;
        }


        body {

            display: flex;
            flex-direction: column;
        }


        /* ==============================
           EN-TÊTE
           ============================== */

        header {

            min-height: 60px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            padding: 0 20px;

            box-sizing: border-box;

            background: white;

            border-bottom: 1px solid #ddd;

            z-index: 10;
        }


        h1 {

            margin: 0;

            font-size: 22px;

            white-space: nowrap;
        }


        /* ==============================
           ZONE FILTRE
           ============================== */

        #zone-filtre {

            display: flex;

            align-items: center;

            gap: 8px;

            flex: 1;

            justify-content: center;
        }


        #filtre-voyage {

            max-width: 300px;

            padding: 8px 10px;

            border: 1px solid #ccc;

            border-radius: 6px;

            background: white;

            font-size: 14px;

            cursor: pointer;
        }


        #compteur {

            font-size: 14px;

            color: #666;

            white-space: nowrap;
        }


        /* ==============================
           CARTE
           ============================== */

        main {

            flex: 1;

            min-height: 0;
        }


        #map {

            width: 100%;
            height: 100%;
        }


        /* ==============================
           MESSAGE D'ERREUR
           ============================== */

        #message {

            position: fixed;

            top: 70px;
            left: 10px;
            right: 10px;

            z-index: 1000;

            padding: 12px;

            background: white;

            border-radius: 8px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.2);

            display: none;

            color: #b00020;
        }


        /* ==============================
           FICHE LIEU
           ============================== */

        .fiche-lieu {

            font-family: Arial, sans-serif;

            line-height: 1.4;

            width: 100%;
        }


        .fiche-titre {

            font-size: 19px;

            font-weight: bold;

            margin-bottom: 4px;
        }


        .fiche-localisation {

            color: #666;

            margin-bottom: 10px;
        }


        .fiche-rubrique {

            margin-top: 8px;
        }


        .fiche-description {

            margin-top: 12px;

            padding-top: 10px;

            border-top: 1px solid #ddd;
        }


        .fiche-notes {

            margin-top: 10px;

            padding-top: 10px;

            border-top: 1px solid #ddd;

            color: #555;
        }


        /* ==============================
           PHOTO PRINCIPALE
           ============================== */

        .fiche-photo {

            display: block;

            width: 100%;

            height: 220px;

            object-fit: cover;

            border-radius: 8px;

            margin-bottom: 10px;

            cursor: pointer;
        }


        /* ==============================
           GALERIE
           ============================== */

        .fiche-galerie {

            display: flex;

            gap: 6px;

            overflow-x: auto;

            margin-bottom: 12px;

            padding-bottom: 3px;
        }


        .fiche-miniature {

            width: 64px;

            height: 50px;

            object-fit: cover;

            border-radius: 6px;

            flex-shrink: 0;

            cursor: pointer;
        }


        .fiche-miniature:hover {

            opacity: 0.75;
        }


        .icone {

            margin-right: 4px;
        }


        /* ==============================
           MARQUEURS
           ============================== */

        .maplibregl-marker {

            cursor: pointer;
        }


        /* ==============================
           VERSION MOBILE
           ============================== */

        @media (max-width: 600px) {

            header {

                height: auto;

                min-height: 60px;

                padding: 8px 12px;

                flex-wrap: wrap;
            }


            h1 {

                font-size: 20px;
            }


            #zone-filtre {

                order: 3;

                width: 100%;

                justify-content: stretch;
            }


            #filtre-voyage {

                width: 100%;

                max-width: none;
            }


            #compteur {

                font-size: 13px;
            }
        }

    </style>

</head>


<body>


<header>

    <h1>
        Mon Atlas
    </h1>


    <div id="zone-filtre">

        <select id="filtre-voyage">

            <option value="">
                Tous les voyages
            </option>

        </select>

    </div>


    <span id="compteur">
        Chargement...
    </span>

</header>


<div id="message"></div>


<main>

    <div id="map"></div>

</main>


<!-- MAPLIBRE -->

<script
    src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js">
</script>


<script>


// ==========================================================
// CONFIGURATION
// ==========================================================

const SUPABASE_URL =
    "https://xiddtmzehxwfncnyuvid.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_5Sgu_vod3bSaf1ecQeaD8A_BqZ_8HYj";


const MAPTILER_KEY =
    "knGFRadbYDcoOEytbBIZ";


// ==========================================================
// ELEMENTS HTML
// ==========================================================

const compteur =
    document.getElementById("compteur");


const message =
    document.getElementById("message");


const filtreVoyage =
    document.getElementById("filtre-voyage");


// ==========================================================
// VARIABLES GLOBALES
// ==========================================================

let map = null;

let lieuxGeolocalises = [];

let voyagesParId = {};

let photosParLieu = {};

let marqueurs = [];


// ==========================================================
// AFFICHAGE DES ERREURS
// ==========================================================

function afficherErreur(texte) {

    console.error(texte);

    compteur.textContent =
        "Erreur";

    message.textContent =
        "⚠️ " + texte;

    message.style.display =
        "block";
}


// ==========================================================
// ECHAPPEMENT HTML
// ==========================================================

function echapperHTML(texte) {

    if (
        texte === null ||
        texte === undefined
    ) {

        return "";
    }


    return String(texte)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}


// ==========================================================
// FORMAT DATE
// ==========================================================

function formaterDate(date) {

    if (!date) {

        return "";
    }


    const morceaux =
        String(date).split("-");


    if (morceaux.length !== 3) {

        return date;
    }


    return (
        morceaux[2] +
        "/" +
        morceaux[1] +
        "/" +
        morceaux[0]
    );
}


// ==========================================================
// PERIODE
// ==========================================================

function afficherPeriode(
    dateDebut,
    dateFin,
    precision,
    dateTexte
) {

    if (dateTexte) {

        return echapperHTML(
            dateTexte
        );
    }


    if (!dateDebut) {

        return "";
    }


    const debut =
        formaterDate(dateDebut);


    if (
        !dateFin ||
        dateFin === dateDebut
    ) {

        return debut;
    }


    return (
        debut +
        " → " +
        formaterDate(dateFin)
    );
}


// ==========================================================
// INITIALISATION DE LA CARTE
// ==========================================================

try {

    map =
        new maplibregl.Map({

            container: "map",

            style:
                "https://api.maptiler.com/maps/streets-v4/style.json?key=" +
                MAPTILER_KEY,

            center: [
                2.5,
                46.5
            ],

            zoom: 4
        });


    map.addControl(

        new maplibregl.NavigationControl(),

        "top-right"
    );


} catch (erreur) {

    afficherErreur(
        "Impossible d'initialiser la carte : " +
        erreur.message
    );
}


// ==========================================================
// CREATION DE LA FICHE
// ==========================================================

function creerFiche(
    lieu,
    voyage,
    photos
) {

    let html = `

        <div class="fiche-lieu">

    `;


    // ------------------------------------------------------
    // PHOTO PRINCIPALE
    // ------------------------------------------------------

    let photoPrincipale =
        null;


    if (
        Array.isArray(photos)
    ) {

        photoPrincipale =
            photos.find(

                photo =>
                    photo.photo_principale === true

            ) || photos[0];
    }


    if (
        photoPrincipale &&
        photoPrincipale.fichier
    ) {

        const urlPhoto =
            SUPABASE_URL +
            "/storage/v1/object/public/photos/" +
            photoPrincipale.fichier;


        html += `

            <img
                class="fiche-photo"

                src="${echapperHTML(
                    urlPhoto
                )}"

                alt="${echapperHTML(
                    photoPrincipale.titre ||
                    lieu.nom
                )}"
            >

        `;
    }


    // ------------------------------------------------------
    // GALERIE
    // ------------------------------------------------------

    if (
        Array.isArray(photos) &&
        photos.length > 1
    ) {

        html += `

            <div class="fiche-galerie">

        `;


        photos.forEach(

            photo => {

                if (!photo.fichier) {

                    return;
                }


                const urlPhoto =
                    SUPABASE_URL +
                    "/storage/v1/object/public/photos/" +
                    photo.fichier;


                html += `

                    <img

                        class="fiche-miniature"

                        src="${echapperHTML(
                            urlPhoto
                        )}"

                        data-photo-url="${echapperHTML(
                            urlPhoto
                        )}"

                        data-photo-titre="${echapperHTML(
                            photo.titre ||
                            lieu.nom
                        )}"

                        alt="${echapperHTML(
                            photo.titre ||
                            lieu.nom
                        )}"

                    >

                `;
            }
        );


        html += `

            </div>

        `;
    }


    // ------------------------------------------------------
    // NOM
    // ------------------------------------------------------

    html += `

        <div class="fiche-titre">

            ${echapperHTML(
                lieu.nom
            )}

        </div>

    `;


    // ------------------------------------------------------
    // LOCALISATION
    // ------------------------------------------------------

    const localisation = [

        lieu.ville,

        lieu.pays

    ]

        .filter(Boolean)

        .map(echapperHTML)

        .join(" · ");


    if (localisation) {

        html += `

            <div class="fiche-localisation">

                ${localisation}

            </div>

        `;
    }


    // ------------------------------------------------------
    // VOYAGE
    // ------------------------------------------------------

    if (voyage) {

        html += `

            <div class="fiche-rubrique">

                <span class="icone">
                    ✈️
                </span>

                <strong>

                    ${echapperHTML(
                        voyage.nom
                    )}

                </strong>

            </div>

        `;
    }


    // ------------------------------------------------------
    // DATE
    // ------------------------------------------------------

    const dateLieu =
        afficherPeriode(

            lieu.date_debut,

            lieu.date_fin,

            lieu.date_precision,

            lieu.date_texte
        );


    if (dateLieu) {

        html += `

            <div class="fiche-rubrique">

                <span class="icone">
                    📅
                </span>

                ${dateLieu}

            </div>

        `;
    }


    // ------------------------------------------------------
    // DESCRIPTION
    // ------------------------------------------------------

    if (lieu.description) {

        html += `

            <div class="fiche-description">

                ${echapperHTML(
                    lieu.description
                )}

            </div>

        `;
    }


    // ------------------------------------------------------
    // NOTE
    // ------------------------------------------------------

    if (
        lieu.note !== null &&
        lieu.note !== undefined
    ) {

        html += `

            <div class="fiche-rubrique">

                <span class="icone">
                    ⭐
                </span>

                ${echapperHTML(
                    lieu.note
                )}/5

            </div>

        `;
    }


    // ------------------------------------------------------
    // TYPE DE LIEU
    // ------------------------------------------------------

    if (lieu.type_lieu) {

        html += `

            <div class="fiche-rubrique">

                <strong>
                    Type :
                </strong>

                ${echapperHTML(
                    lieu.type_lieu
                )}

            </div>

        `;
    }


    // ------------------------------------------------------
    // TYPE EXPERIENCE
    // ------------------------------------------------------

    if (lieu.type_experience) {

        html += `

            <div class="fiche-rubrique">

                <strong>
                    Expérience :
                </strong>

                ${echapperHTML(
                    lieu.type_experience
                )}

            </div>

        `;
    }


    // ------------------------------------------------------
    // ADRESSE
    // ------------------------------------------------------

    if (lieu.adresse) {

        html += `

            <div class="fiche-rubrique">

                <strong>
                    Adresse :
                </strong>

                <br>

                ${echapperHTML(
                    lieu.adresse
                )}

            </div>

        `;
    }


    // ------------------------------------------------------
    // NOTES
    // ------------------------------------------------------

    if (lieu.notes) {

        html += `

            <div class="fiche-notes">

                ${echapperHTML(
                    lieu.notes
                )}

            </div>

        `;
    }


    html += `

        </div>

    `;


    return html;
}


// ==========================================================
// CREATION DES OPTIONS DE FILTRE
// ==========================================================

function creerFiltreVoyages(
    voyages
) {

    filtreVoyage.innerHTML = `

        <option value="">
            Tous les voyages
        </option>

    `;


    const voyagesTries =
        [...voyages].sort(

            (a, b) =>

                String(
                    a.nom || ""
                ).localeCompare(

                    String(
                        b.nom || ""
                    ),

                    "fr",

                    {
                        sensitivity:
                            "base"
                    }
                )
        );


    voyagesTries.forEach(

        voyage => {

            if (!voyage.voyage_id) {

                return;
            }


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                voyage.voyage_id;


            option.textContent =
                voyage.nom ||
                voyage.voyage_id;


            filtreVoyage.appendChild(
                option
            );
        }
    );
}


// ==========================================================
// AFFICHAGE DES MARQUEURS
// ==========================================================

function afficherMarqueurs(
    voyageIdSelectionne = ""
) {

    // ------------------------------------------------------
    // SUPPRIMER LES ANCIENS MARQUEURS
    // ------------------------------------------------------

    marqueurs.forEach(

        marqueur => {

            marqueur.remove();
        }
    );


    marqueurs = [];


    // ------------------------------------------------------
    // FILTRER LES LIEUX
    // ------------------------------------------------------

    const lieuxFiltres =

        lieuxGeolocalises.filter(

            lieu => {

                if (
                    !voyageIdSelectionne
                ) {

                    return true;
                }


                return (
                    lieu.voyage_id ===
                    voyageIdSelectionne
                );
            }
        );


    // ------------------------------------------------------
    // COMPTEUR
    // ------------------------------------------------------

    compteur.textContent =

        lieuxFiltres.length +
        " lieu" +
        (
            lieuxFiltres.length > 1
                ? "x"
                : ""
        );


    // ------------------------------------------------------
    // NOUVEAUX MARQUEURS
    // ------------------------------------------------------

    const bounds =
        new maplibregl.LngLatBounds();


    lieuxFiltres.forEach(

        lieu => {

            const voyage =
                voyagesParId[
                    lieu.voyage_id
                ];


            const photosLieu =
                photosParLieu[
                    lieu.lieu_id
                ] || [];


            const popup =
                new maplibregl.Popup({

                    offset: 25,

                    maxWidth:
                        "420px"
                });


            popup.setHTML(

                creerFiche(

                    lieu,

                    voyage,

                    photosLieu
                )
            );


            const marqueur =
                new maplibregl.Marker()

                    .setLngLat([

                        Number(
                            lieu.longitude
                        ),

                        Number(
                            lieu.latitude
                        )

                    ])

                    .setPopup(
                        popup
                    )

                    .addTo(map);


            marqueurs.push(
                marqueur
            );


            bounds.extend([

                Number(
                    lieu.longitude
                ),

                Number(
                    lieu.latitude
                )

            ]);
        }
    );


    // ------------------------------------------------------
    // RECADRAGE
    // ------------------------------------------------------

    if (
        lieuxFiltres.length === 1
    ) {

        const lieu =
            lieuxFiltres[0];


        map.flyTo({

            center: [

                Number(
                    lieu.longitude
                ),

                Number(
                    lieu.latitude
                )

            ],

            zoom: 10,

            duration: 800
        });

    }

    else if (
        lieuxFiltres.length > 1
    ) {

        map.fitBounds(

            bounds,

            {

                padding: 70,

                maxZoom: 8,

                duration: 800
            }
        );

    }
}


// ==========================================================
// CHANGEMENT DU FILTRE
// ==========================================================

filtreVoyage.addEventListener(

    "change",

    function() {

        afficherMarqueurs(
            filtreVoyage.value
        );
    }
);


// ==========================================================
// CHARGEMENT DES DONNEES
// ==========================================================

async function chargerDonnees() {

    compteur.textContent =
        "Connexion à Supabase...";


    try {


        // ==================================================
        // 1. CHARGER LES LIEUX
        // ==================================================

        const urlLieux =

            SUPABASE_URL +

            "/rest/v1/lieux" +

            "?select=*" +

            "&order=lieu_id.asc";


        const responseLieux =

            await fetch(

                urlLieux,

                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Accept":
                            "application/json"
                    }
                }
            );


        if (
            !responseLieux.ok
        ) {

            throw new Error(

                "Lieux : HTTP " +

                responseLieux.status
            );
        }


        const lieux =
            await responseLieux.json();


        console.log(
            "Lieux chargés :",
            lieux.length
        );


        // ==================================================
        // 2. CHARGER LES VOYAGES
        // ==================================================

        const urlVoyages =

            SUPABASE_URL +

            "/rest/v1/voyages" +

            "?select=*";


        const responseVoyages =

            await fetch(

                urlVoyages,

                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Accept":
                            "application/json"
                    }
                }
            );


        if (
            !responseVoyages.ok
        ) {

            throw new Error(

                "Voyages : HTTP " +

                responseVoyages.status
            );
        }


        const voyages =
            await responseVoyages.json();


        console.log(
            "Voyages chargés :",
            voyages.length
        );


        // ==================================================
        // 3. CHARGER LES PHOTOS
        // ==================================================

        const urlPhotos =

            SUPABASE_URL +

            "/rest/v1/photos" +

            "?select=*" +

            "&order=ordre.asc";


        const responsePhotos =

            await fetch(

                urlPhotos,

                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Accept":
                            "application/json"
                    }
                }
            );


        if (
            !responsePhotos.ok
        ) {

            throw new Error(

                "Photos : HTTP " +

                responsePhotos.status
            );
        }


        const photos =
            await responsePhotos.json();


        console.log(
            "Photos chargées :",
            photos.length
        );


        // ==================================================
        // 4. STOCKER LES VOYAGES
        // ==================================================

        voyagesParId = {};


        voyages.forEach(

            voyage => {

                if (
                    voyage.voyage_id
                ) {

                    voyagesParId[
                        voyage.voyage_id
                    ] = voyage;
                }
            }
        );


        // ==================================================
        // 5. INDEXER LES PHOTOS
        // ==================================================

        photosParLieu = {};


        photos.forEach(

            photo => {

                if (!photo.lieu_id) {

                    return;
                }


                if (
                    !photosParLieu[
                        photo.lieu_id
                    ]
                ) {

                    photosParLieu[
                        photo.lieu_id
                    ] = [];
                }


                photosParLieu[
                    photo.lieu_id
                ].push(photo);
            }
        );


        // ==================================================
        // 6. LIEUX GEOLOCALISES
        // ==================================================

        lieuxGeolocalises =

            lieux.filter(

                lieu =>

                    lieu.latitude !== null &&

                    lieu.longitude !== null
            );


        console.log(

            "Lieux géolocalisés :",

            lieuxGeolocalises.length
        );


        // ==================================================
        // 7. CREER LE FILTRE
        // ==================================================

        creerFiltreVoyages(
            voyages
        );


        // ==================================================
        // 8. AFFICHER TOUS LES LIEUX
        // ==================================================

        afficherMarqueurs();


    }

    catch (erreur) {

        console.error(
            "ERREUR ATLAS :",
            erreur
        );


        afficherErreur(

            "Impossible de charger les données : " +

            erreur.message
        );
    }
}


// ==========================================================
// GALERIE PHOTO
// ==========================================================

document.addEventListener(

    "click",

    function(event) {


        const miniature =

            event.target.closest(
                ".fiche-miniature"
            );


        if (!miniature) {

            return;
        }


        const popup =

            miniature.closest(
                ".maplibregl-popup"
            );


        if (!popup) {

            return;
        }


        const grandePhoto =

            popup.querySelector(
                ".fiche-photo"
            );


        if (!grandePhoto) {

            return;
        }


        grandePhoto.src =

            miniature.dataset.photoUrl;


        grandePhoto.alt =

            miniature.dataset.photoTitre ||
            "";
    }
);


// ==========================================================
// LANCEMENT
// ==========================================================

chargerDonnees();


</script>


</body>

</html>
