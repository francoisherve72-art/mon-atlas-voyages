<!DOCTYPE html>
<html lang="fr">

    <meta charset="UTF-8">

    <meta

    >

    <title>Mon Atlas</title>

    <link

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* ==================================================
           EN-TÊTE
           ================================================== */

        header {
            min-height: 60px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 12px;

            padding: 0 20px;

            box-sizing: border-box;

            background: white;

            border-bottom: 1px solid #ddd;

            z-index: 10;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            white-space: nowrap;
        }

        #controle-voyage {
            display: flex;
            align-items: center;
            gap: 6px;

            font-size: 14px;
        }

        #select-voyage {
            max-width: 180px;

            padding: 6px 8px;

            border: 1px solid #ccc;

            border-radius: 5px;

            background: white;

            font-size: 14px;
        }

        #compteur {
            font-size: 14px;
            color: #666;
            white-space: nowrap;
        }

        /* ==================================================
           CARTE
           ================================================== */

        main {
            flex: 1;
            min-height: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* ==================================================
           MESSAGE D'ERREUR
           ================================================== */

        #message {
            position: fixed;

            top: 70px;
            left: 10px;
            right: 10px;

            z-index: 1000;

            padding: 10px;

            background: white;

            border-radius: 6px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.2);

            display: none;
        }

        /* ==================================================
           FICHE LIEU
           ================================================== */

        .fiche-lieu {
            font-family: Arial, sans-serif;
            line-height: 1.4;
        }

        .fiche-titre {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .fiche-localisation {
            color: #666;
            margin-bottom: 10px;
        }

        .fiche-rubrique {
            margin-top: 7px;
        }

        .fiche-description {
            margin-top: 12px;

            padding-top: 10px;

            border-top: 1px solid #ddd;
        }

        .fiche-notes {
            margin-top: 10px;

            padding-top: 10px;

            border-top: 1px solid #ddd;

            color: #555;
        }

        /* ==================================================
           PHOTO PRINCIPALE
           ================================================== */

        .fiche-photo {
            display: block;

            width: 100%;
            height: 220px;

            object-fit: cover;

            border-radius: 8px;

            margin-bottom: 10px;
        }

        /* ==================================================
           GALERIE
           ================================================== */

        .fiche-galerie {
            display: flex;

            gap: 5px;

            overflow-x: auto;

            margin-bottom: 10px;

            padding-bottom: 3px;
        }

        .fiche-miniature {
            width: 64px;
            height: 50px;

            object-fit: cover;

            border-radius: 6px;

            flex-shrink: 0;

            cursor: pointer;
        }

        .fiche-miniature:active {
            opacity: 0.7;
        }

        .icone {
            margin-right: 4px;
        }

        /* ==================================================
           MOBILE
           ================================================== */

        @media (max-width: 600px) {

            header {
                padding: 0 10px;

                gap: 8px;
            }

            h1 {
                font-size: 19px;
            }

            #controle-voyage {
                font-size: 13px;
            }

            #select-voyage {
                max-width: 130px;
                font-size: 13px;
            }

            #compteur {
                font-size: 12px;
            }
        }

    </style>

</head>

<script

</script>


<script>


// ==================================================
// SUPABASE
// ==================================================

const SUPABASE_URL =
    "https://xiddtmzehxwfncnyuvid.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_5Sgu_vod3bSaf1ecQeaD8A_BqZ_8HYj";


const MAPTILER_KEY =
    "knGFRadbYDcoOEytbBIZ";


// ==================================================
// ELEMENTS DE LA PAGE
// ==================================================

const compteur =
    document.getElementById("compteur");


const message =
    document.getElementById("message");


const selectVoyage =
    document.getElementById("select-voyage");


// ==================================================
// VARIABLES GLOBALES
// ==================================================

let tousLesLieux = [];

let lieuxGeolocalises = [];

let voyages = [];

let voyagesParId = {};

let photosParLieu = {};

let marqueursParLieu = {};


// ==================================================
// AFFICHAGE DES ERREURS
// ==================================================

function afficherErreur(texte) {

    compteur.textContent =
        "Erreur";

    message.textContent =
        texte;

    message.style.display =
        "block";
}


// ==================================================
// SECURITE HTML
// ==================================================

function echapperHTML(texte) {

    if (
        texte === null ||
        texte === undefined
    ) {
        return "";
    }

    return String(texte)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// ==================================================
// FORMATAGE DES DATES
// ==================================================

function formaterDate(date) {

    if (!date) {
        return "";
    }

    const morceaux =
        date.split("-");

    if (morceaux.length !== 3) {
        return date;
    }

    return (
        morceaux[2] +
        "/" +
        morceaux[1] +
        "/" +
        morceaux[0]
    );
}


function afficherPeriode(
    dateDebut,
    dateFin,
    precision,
    dateTexte
) {

    if (dateTexte) {

        return echapperHTML(
            dateTexte
        );
    }

    if (!dateDebut) {
        return "";
    }

    const debut =
        formaterDate(dateDebut);

    if (
        !dateFin ||
        dateFin === dateDebut
    ) {
        return debut;
    }

    return (
        debut +
        " → " +
        formaterDate(dateFin)
    );
}


// ==================================================
// CARTE
// ==================================================

const map =
    new maplibregl.Map({

        container: "map",

        style:
        `https://api.maptiler.com/maps/streets-v4/style.json?key=${MAPTILER_KEY}`,

        center: [
            2.5,
            46.5
        ],

        zoom: 4

    });


// ==================================================
// CREATION D'UNE FICHE
// ==================================================

function creerFiche(
    lieu,
    voyage,
    photos
) {

    let html = `

        <div class="fiche-lieu">

    `;


    // ==================================================
    // PHOTO PRINCIPALE
    // ==================================================

    const photoPrincipale =
        photos.find(
            photo =>
                photo.photo_principale === true
        ) || photos[0];


    if (
        photoPrincipale &&
        photoPrincipale.fichier
    ) {

        const urlPhotoPrincipale =
            SUPABASE_URL +
            "/storage/v1/object/public/photos/" +
            photoPrincipale.fichier;


        html += `

            <img

                class="fiche-photo"

                src="${echapperHTML(
                    urlPhotoPrincipale
                )}"

                alt="${echapperHTML(
                    photoPrincipale.titre ||
                    lieu.nom
                )}"

            >

        `;
    }


    // ==================================================
    // MINIATURES
    // ==================================================

    if (photos.length > 1) {

        html += `

            <div class="fiche-galerie">

        `;


        photos.forEach(
            photo => {

                if (!photo.fichier) {
                    return;
                }


                const urlPhoto =
                    SUPABASE_URL +
                    "/storage/v1/object/public/photos/" +
                    photo.fichier;


                html += `

                    <img

                        class="fiche-miniature"

                        src="${echapperHTML(
                            urlPhoto
                        )}"

                        data-photo-url="${echapperHTML(
                            urlPhoto
                        )}"

                        data-photo-titre="${echapperHTML(
                            photo.titre ||
                            lieu.nom
                        )}"

                        alt="${echapperHTML(
                            photo.titre ||
                            lieu.nom
                        )}"

                    >

                `;
            }
        );


        html += `

            </div>

        `;
    }


    // ==================================================
    // NOM
    // ==================================================

    html += `

        <div class="fiche-titre">

            ${echapperHTML(
                lieu.nom
            )}

        </div>

    `;


    // ==================================================
    // LOCALISATION
    // ==================================================

    const localisation = [

        lieu.ville,

        lieu.pays

    ]
        .filter(Boolean)
        .map(echapperHTML)
        .join(" · ");


    if (localisation) {

        html += `

            <div class="fiche-localisation">

                ${localisation}

            </div>

        `;
    }


    // ==================================================
    // VOYAGE
    // ==================================================

    if (voyage) {

        html += `

            <div class="fiche-rubrique">

                <span class="icone">
                    ✈️
                </span>

                <strong>
                    ${echapperHTML(
                        voyage.nom
                    )}
                </strong>

            </div>

        `;
    }


    // ==================================================
    // DATE DU LIEU
    // ==================================================

    const dateLieu =
        afficherPeriode(

            lieu.date_debut,

            lieu.date_fin,

            lieu.date_precision,

            lieu.date_texte

        );


    if (dateLieu) {

        html += `

            <div class="fiche-rubrique">

                <span class="icone">
                    📅
                </span>

                ${dateLieu}

            </div>

        `;
    }


    // ==================================================
    // DESCRIPTION
    // ==================================================

    if (lieu.description) {

        html += `

            <div class="fiche-description">

                ${echapperHTML(
                    lieu.description
                )}

            </div>

        `;
    }


    // ==================================================
    // NOTE
    // ==================================================

    if (
        lieu.note !== null &&
        lieu.note !== undefined
    ) {

        html += `

            <div class="fiche-rubrique">

                <span class="icone">
                    ⭐
                </span>

                ${echapperHTML(
                    lieu.note
                )}/5

            </div>

        `;
    }


    // ==================================================
    // TYPE DE LIEU
    // ==================================================

    if (lieu.type_lieu) {

        html += `

            <div class="fiche-rubrique">

                <strong>
                    Type :
                </strong>

                ${echapperHTML(
                    lieu.type_lieu
                )}

            </div>

        `;
    }


    // ==================================================
    // TYPE D'EXPERIENCE
    // ==================================================

    if (lieu.type_experience) {

        html += `

            <div class="fiche-rubrique">

                <strong>
                    Expérience :
                </strong>

                ${echapperHTML(
                    lieu.type_experience
                )}

            </div>

        `;
    }


    // ==================================================
    // ADRESSE
    // ==================================================

    if (lieu.adresse) {

        html += `

            <div class="fiche-rubrique">

                <strong>
                    Adresse :
                </strong>

                <br>

                ${echapperHTML(
                    lieu.adresse
                )}

            </div>

        `;
    }


    // ==================================================
    // NOTES
    // ==================================================

    if (lieu.notes) {

        html += `

            <div class="fiche-notes">

                ${echapperHTML(
                    lieu.notes
                )}

            </div>

        `;
    }


    html += `

        </div>

    `;


    return html;
}


// ==================================================
// CREER LES PINS
// ==================================================

function creerMarqueurs() {

    // Nettoyer les anciens marqueurs

    Object.values(
        marqueursParLieu
    ).forEach(
        marqueur => {

            marqueur.remove();

        }
    );


    marqueursParLieu = {};


    lieuxGeolocalises.forEach(
        lieu => {

            const voyage =
                voyagesParId[
                    lieu.voyage_id
                ];


            const photos =
                photosParLieu[
                    lieu.lieu_id
                ] || [];


            const popup =
                new maplibregl.Popup({

                    offset: 25,

                    maxWidth: "420px"

                })
                .setHTML(

                    creerFiche(
                        lieu,
                        voyage,
                        photos
                    )

                );


            const marqueur =
                new maplibregl.Marker()
