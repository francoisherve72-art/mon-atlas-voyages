<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mon Atlas</title>

    <!-- MAPLIBRE -->
    <link
        href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"
        rel="stylesheet"
    >

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
        }


        /* =====================================================
           EN-TÊTE
           ===================================================== */

        header {
            min-height: 60px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            padding: 0 20px;

            box-sizing: border-box;

            background: white;

            border-bottom: 1px solid #ddd;

            z-index: 10;
        }


        h1 {
            margin: 0;
            font-size: 22px;
            white-space: nowrap;
        }


        /* =====================================================
           FILTRES
           ===================================================== */

        #filtres {
            display: flex;

            align-items: center;

            gap: 8px;

            flex-wrap: wrap;

            justify-content: flex-end;
        }


        .filtre {
            padding: 7px 10px;

            border: 1px solid #ccc;

            border-radius: 6px;

            background: white;

            font-size: 13px;

            max-width: 180px;
        }


        #compteur {
            font-size: 13px;
            color: #666;
            white-space: nowrap;
        }


        /* =====================================================
           CARTE
           ===================================================== */

        main {
            flex: 1;
            min-height: 0;
        }


        #map {
            width: 100%;
            height: 100%;
        }


        /* =====================================================
           MESSAGE
           ===================================================== */

        #message {
            position: fixed;

            top: 70px;

            left: 10px;
            right: 10px;

            z-index: 1000;

            padding: 12px;

            background: white;

            border-radius: 8px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.2);

            display: none;

            color: #b00020;
        }


        /* =====================================================
           FICHE LIEU
           ===================================================== */

        .fiche-lieu {
            font-family: Arial, sans-serif;

            line-height: 1.4;

            width: 100%;
        }


        .fiche-titre {
            font-size: 19px;

            font-weight: bold;

            margin-bottom: 4px;
        }


        .fiche-localisation {
            color: #666;

            margin-bottom: 10px;
        }


        .fiche-rubrique {
            margin-top: 8px;
        }


        .fiche-infos {
            margin-top: 8px;
        }


        .fiche-sous-titre {
            font-weight: bold;

            margin-bottom: 5px;
        }


        .fiche-description {
            margin-top: 12px;

            padding-top: 10px;

            border-top: 1px solid #ddd;
        }


        .fiche-notes {
            margin-top: 10px;

            padding-top: 10px;

            border-top: 1px solid #ddd;

            color: #555;
        }


        /* =====================================================
           PHOTOS
           ===================================================== */

        .fiche-photo {
            display: block;

            width: 100%;

            height: 220px;

            object-fit: cover;

            border-radius: 8px;

            margin-bottom: 10px;

            cursor: pointer;
        }


        .fiche-galerie {
            display: flex;

            gap: 6px;

            overflow-x: auto;

            margin-bottom: 12px;

            padding-bottom: 3px;
        }


        .fiche-miniature {
            width: 64px;

            height: 50px;

            object-fit: cover;

            border-radius: 6px;

            flex-shrink: 0;

            cursor: pointer;
        }


        .fiche-miniature:hover {
            opacity: 0.75;
        }


        .icone {
            margin-right: 4px;
        }


        /* =====================================================
           VISITES
           ===================================================== */

        .fiche-visites {
            margin-top: 14px;

            padding-top: 10px;

            border-top: 1px solid #ddd;
        }


        .fiche-visite {
            margin-top: 10px;

            padding: 9px;

            background: #f7f7f7;

            border-radius: 7px;
        }


        .fiche-visite:first-child {
            margin-top: 6px;
        }


        .visite-contexte {
            font-weight: bold;

            margin-bottom: 5px;
        }


        .visite-ligne {
            margin-top: 4px;
        }


        .visite-description {
            margin-top: 7px;
        }


        .visite-notes {
            margin-top: 7px;

            color: #555;

            font-style: italic;
        }


        /* =====================================================
           MARQUEURS
           ===================================================== */

        .maplibregl-marker {
            cursor: pointer;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 700px) {

            header {
                min-height: auto;

                padding: 10px;

                align-items: flex-start;

                flex-direction: column;
            }


            #filtres {
                width: 100%;

                justify-content: flex-start;
            }


            .filtre {
                flex: 1;

                min-width: 0;

                max-width: none;
            }


            #compteur {
                width: 100%;
            }

        }

    </style>

</head>

<!-- =========================================================
     MAPLIBRE
     ========================================================= -->

<script
    src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js">
</script>


<script>


// ==========================================================
// CONFIGURATION
// ==========================================================

const SUPABASE_URL =
    "https://xiddtmzehxwfncnyuvid.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_5Sgu_vod3bSaf1ecQeaD8A_BqZ_8HYj";


const MAPTILER_KEY =
    "knGFRadbYDcoOEytbBIZ";


// ==========================================================
// ELEMENTS HTML
// ==========================================================

const compteur =
    document.getElementById("compteur");


const message =
    document.getElementById("message");


const filtreVoyage =
    document.getElementById("filtreVoyage");


const filtreContexte =
    document.getElementById("filtreContexte");


const filtreTypeLieu =
    document.getElementById("filtreTypeLieu");


const filtreExperience =
    document.getElementById("filtreExperience");


const modeCarte =
    document.getElementById("modeCarte");


// ==========================================================
// DONNEES GLOBALES
// ==========================================================

let tousLesLieux = [];

let toutesLesVisites = [];

let tousLesVoyages = [];

let tousLesContextes = [];

let toutesLesPhotos = [];


let voyagesParId = {};

let contextesParCode = {};

let visitesParLieu = {};

let photosParLieu = {};


let marqueurs = [];

let modeAffichage = "marqueurs";


// ==========================================================
// AFFICHAGE DES ERREURS
// ==========================================================

function afficherErreur(texte) {

    console.error(texte);

    compteur.textContent =
        "Erreur";

    message.textContent =
        "⚠️ " + texte;

    message.style.display =
        "block";
}


// ==========================================================
// ECHAPPEMENT HTML
// ==========================================================

function echapperHTML(texte) {

    if (
        texte === null ||
        texte === undefined
    ) {
        return "";
    }


    return String(texte)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}


// ==========================================================
// FORMAT DATE
// ==========================================================

function formaterDate(date) {

    if (!date) {
        return "";
    }


    const morceaux =
        String(date).split("-");


    if (morceaux.length !== 3) {
        return date;
    }


    return (
        morceaux[2] +
        "/" +
        morceaux[1] +
        "/" +
        morceaux[0]
    );
}


// ==========================================================
// PERIODE
// ==========================================================

function afficherPeriode(
    dateDebut,
    dateFin,
    precision,
    dateTexte
) {

    if (dateTexte) {

        return echapperHTML(
            dateTexte
        );
    }


    if (!dateDebut) {
        return "";
    }


    const debut =
        formaterDate(dateDebut);


    if (
        !dateFin ||
        dateFin === dateDebut
    ) {

        return debut;
    }


    return (
        debut +
        " → " +
        formaterDate(dateFin)
    );
}


// ==========================================================
// NOM DU CONTEXTE
// ==========================================================

function obtenirNomContexte(code) {

    if (!code) {
        return "";
    }


    const contexte =
        contextesParCode[code];


    if (!contexte) {
        return code;
    }


    /*
     * On accepte plusieurs noms possibles pour la colonne
     * descriptive afin de rendre le HTML robuste.
     */

    return (
        contexte.nom ||
        contexte.libelle ||
        contexte.label ||
        contexte.description ||
        contexte.code ||
        code
    );
}


// ==========================================================
// NOM DU VOYAGE
// ==========================================================

function obtenirNomVoyage(voyageId) {

    if (!voyageId) {
        return "";
    }


    const voyage =
        voyagesParId[voyageId];


    if (!voyage) {
        return voyageId;
    }


    return (
        voyage.nom ||
        voyage.voyage_id
    );
}


// ==========================================================
// CARTE
// ==========================================================

let map;


try {

    map =
        new maplibregl.Map({

            container: "map",

            style:
                "https://api.maptiler.com/maps/streets-v4/style.json?key=" +
                MAPTILER_KEY,

            center: [
                2.5,
                46.5
            ],

            zoom: 4
        });


    map.addControl(
        new maplibregl.NavigationControl(),
        "top-right"
    );


} catch (erreur) {

    afficherErreur(
        "Impossible d'initialiser la carte : " +
        erreur.message
    );
}


// ==========================================================
// CREATION DE LA FICHE D'UN LIEU
// ==========================================================

function creerFiche(
    lieu,
    photos
) {

    const visites =
        visitesParLieu[
            lieu.lieu_id
        ] || [];


    let html = `
        <div class="fiche-lieu">
    `;


    // ======================================================
    // PHOTO PRINCIPALE
    // ======================================================

    let photoPrincipale = null;


    if (Array.isArray(photos)) {

        photoPrincipale =
            photos.find(
                photo =>
                    photo.photo_principale === true
            ) || photos[0];
    }


    if (
        photoPrincipale &&
        photoPrincipale.fichier
    ) {

        const urlPhoto =
            SUPABASE_URL +
            "/storage/v1/object/public/photos/" +
            photoPrincipale.fichier;


        html += `

            <img
                class="fiche-photo"

                src="${echapperHTML(
                    urlPhoto
                )}"

                alt="${echapperHTML(
                    photoPrincipale.titre ||
                    lieu.nom
                )}"
            >

        `;
    }


    // ======================================================
    // GALERIE PHOTO
    // ======================================================

    if (
        Array.isArray(photos) &&
        photos.length > 1
    ) {

        html += `
            <div class="fiche-galerie">
        `;


        photos.forEach(
            photo => {

                if (!photo.fichier) {
                    return;
                }


                const urlPhoto =
                    SUPABASE_URL +
                    "/storage/v1/object/public/photos/" +
                    photo.fichier;


                html += `

                    <img
                        class="fiche-miniature"

                        src="${echapperHTML(
                            urlPhoto
                        )}"

                        data-photo-url="${echapperHTML(
                            urlPhoto
                        )}"

                        data-photo-titre="${echapperHTML(
                            photo.titre ||
                            lieu.nom
                        )}"

                        alt="${echapperHTML(
                            photo.titre ||
                            lieu.nom
                        )}"
                    >

                `;
            }
        );


        html += `
            </div>
        `;
    }


    // ======================================================
    // TITRE
    // ======================================================

    html += `

        <div class="fiche-titre">
            ${echapperHTML(lieu.nom)}
        </div>

    `;


    // ======================================================
    // LOCALISATION
    // ======================================================

    const localisation = [

        lieu.ville,

        lieu.pays

    ]

        .filter(Boolean)

        .map(echapperHTML)

        .join(" · ");


    if (localisation) {

        html += `

            <div class="fiche-localisation">
                📍 ${localisation}
            </div>

        `;
    }


    // ======================================================
    // INFORMATIONS PROPRES AU LIEU
    // ======================================================

    if (lieu.type_lieu) {

        html += `

            <div class="fiche-rubrique">

                <span class="icone">📍</span>

                <strong>Type :</strong>

                ${echapperHTML(
                    lieu.type_lieu
                )}

            </div>

        `;
    }


    if (lieu.adresse) {

        html += `

            <div class="fiche-rubrique">

                <span class="icone">🏠</span>

                <strong>Adresse :</strong><br>

                ${echapperHTML(
                    lieu.adresse
                )}

            </div>

        `;
    }


    // ======================================================
    // VISITES
    // ======================================================

    if (visites.length > 0) {

        html += `

            <div class="fiche-visites">

                <div class="fiche-sous-titre">
                    ✨ Visite${visites.length > 1 ? "s" : ""}
                </div>

        `;


        visites.forEach(
            visite => {

                html += `
                    <div class="fiche-visite">
                `;


                // ------------------------------------------
                // CONTEXTE
                // ------------------------------------------

                const nomContexte =
                    obtenirNomContexte(
                        visite.type_contexte
                    );


                if (nomContexte) {

                    html += `

                        <div class="visite-contexte">

                            🧭
                            ${echapperHTML(
                                nomContexte
                            )}

                        </div>

                    `;
                }


                // ------------------------------------------
                // VOYAGE
                // ------------------------------------------

                if (visite.voyage_id) {

                    html += `

                        <div class="visite-ligne">

                            ✈️

                            <strong>Voyage :</strong>

                            ${echapperHTML(
                                obtenirNomVoyage(
                                    visite.voyage_id
                                )
                            )}

                        </div>

                    `;
                }


                // ------------------------------------------
                // DATE
                // ------------------------------------------

                const periode =
                    afficherPeriode(

                        visite.date_debut,

                        visite.date_fin,

                        visite.date_precision,

                        visite.date_texte

                    );


                if (periode) {

                    html += `

                        <div class="visite-ligne">

                            📅

                            <strong>Date :</strong>

                            ${periode}

                        </div>

                    `;
                }


                // ------------------------------------------
                // EXPERIENCE
                // ------------------------------------------

                if (visite.type_experience) {

                    html += `

                        <div class="visite-ligne">

                            ✨

                            <strong>Expérience :</strong>

                            ${echapperHTML(
                                visite.type_experience
                            )}

                        </div>

                    `;
                }


                // ------------------------------------------
                // NOTE
                // ------------------------------------------

                if (
                    visite.note !== null &&
                    visite.note !== undefined
                ) {

                    html += `

                        <div class="visite-ligne">

                            ⭐

                            <strong>Note :</strong>

                            ${echapperHTML(
                                visite.note
                            )}/5

                        </div>

                    `;
                }


                // ------------------------------------------
                // DESCRIPTION
                // ------------------------------------------

                if (visite.description) {

                    html += `

                        <div class="visite-description">

                            ${echapperHTML(
                                visite.description
                            )}

                        </div>

                    `;
                }


                // ------------------------------------------
                // NOTES
                // ------------------------------------------

                if (visite.notes) {

                    html += `

                        <div class="visite-notes">

                            ${echapperHTML(
                                visite.notes
                            )}

                        </div>

                    `;
                }


                html += `
                    </div>
                `;
            }
        );


        html += `
            </div>
        `;
    }


    // ======================================================
    // DESCRIPTION PROPRE AU LIEU
    // ======================================================

    if (lieu.description) {

        html += `

            <div class="fiche-description">

                <div class="fiche-sous-titre">
                    Description du lieu
                </div>

                <div>
                    ${echapperHTML(
                        lieu.description
                    )}
                </div>

            </div>

        `;
    }


    // ======================================================
    // NOTES PROPRES AU LIEU
    // ======================================================

    if (lieu.notes) {

        html += `

            <div class="fiche-notes">

                <div class="fiche-sous-titre">
                    Notes personnelles
                </div>

                <div>
                    ${echapperHTML(
                        lieu.notes
                    )}
                </div>

            </div>

        `;
    }


    // ======================================================
    // FIN
    // ======================================================

    html += `
        </div>
    `;


    return html;
}


// ==========================================================
// REMPLISSAGE DES FILTRES
// ==========================================================

function remplirFiltres() {


    // ======================================================
    // VOYAGES
    // ======================================================

    filtreVoyage.innerHTML = `

        <option value="">
            Tous les voyages
        </option>

    `;


    [...tousLesVoyages]

        .sort(
            (a, b) =>
                String(a.nom || "")
                    .localeCompare(
                        String(b.nom || ""),
                        "fr"
                    )
        )

        .forEach(
            voyage => {

                if (!voyage.voyage_id) {
                    return;
                }


                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    voyage.voyage_id;


                option.textContent =
                    voyage.nom ||
                    voyage.voyage_id;


                filtreVoyage.appendChild(
                    option
                );
            }
        );


    // ======================================================
    // CONTEXTES
    // ======================================================

    filtreContexte.innerHTML = `

        <option value="">
            Tous les contextes
        </option>

    `;


    const codesContextes =
        [
            ...new Set(

                toutesLesVisites

                    .map(
                        visite =>
                            visite.type_contexte
                    )

                    .filter(Boolean)

            )
        ];


    codesContextes

        .sort(
            (a, b) =>
                String(
                    obtenirNomContexte(a)
                )
                .localeCompare(
                    String(
                        obtenirNomContexte(b)
                    ),
                    "fr"
                )
        )

        .forEach(
            code => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    code;


                option.textContent =
                    obtenirNomContexte(
                        code
                    );


                filtreContexte.appendChild(
                    option
                );
            }
        );


    // ======================================================
    // TYPES DE LIEU
    // ======================================================

    filtreTypeLieu.innerHTML = `

        <option value="">
            Tous les types
        </option>

    `;


    const typesLieu =
        [
            ...new Set(

                tousLesLieux

                    .map(
                        lieu =>
                            lieu.type_lieu
                    )

                    .filter(Boolean)

            )
        ];


    typesLieu

        .sort(
            (a, b) =>
                String(a)
                    .localeCompare(
                        String(b),
                        "fr"
                    )
        )

        .forEach(
            type => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    type;


                option.textContent =
                    type;


                filtreTypeLieu.appendChild(
                    option
                );
            }
        );


    // ======================================================
    // EXPERIENCES
    // ======================================================

    filtreExperience.innerHTML = `

        <option value="">
            Toutes les expériences
        </option>

    `;


    const experiences =
        [
            ...new Set(

                toutesLesVisites

                    .map(
                        visite =>
                            visite.type_experience
                    )

                    .filter(Boolean)

            )
        ];


    experiences

        .sort(
            (a, b) =>
                String(a)
                    .localeCompare(
                        String(b),
                        "fr"
                    )
        )

        .forEach(
            experience => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    experience;


                option.textContent =
                    experience;


                filtreExperience.appendChild(
                    option
                );
            }
        );
}


// ==========================================================
// SUPPRESSION DES MARQUEURS
// ==========================================================

function supprimerMarqueurs() {

    marqueurs.forEach(
        marqueur => {

            marqueur.remove();

        }
    );


    marqueurs = [];
}


// ==========================================================
// SUPPRESSION HEATMAP
// ==========================================================

function supprimerHeatmap() {

    if (
        !map ||
        !map.isStyleLoaded()
    ) {

        return;
    }


    if (
        map.getLayer(
            "heatmap-lieux"
        )
    ) {

        map.removeLayer(
            "heatmap-lieux"
        );
    }


    if (
        map.getSource(
            "lieux-heatmap"
        )
    ) {

        map.removeSource(
            "lieux-heatmap"
        );
    }
}


// ==========================================================
// FILTRAGE DES LIEUX
// ==========================================================

function lieuCorrespondAuxFiltres(lieu) {

    const voyageSelectionne =
        filtreVoyage.value;


    const contexteSelectionne =
        filtreContexte.value;


    const typeLieuSelectionne =
        filtreTypeLieu.value;


    const experienceSelectionnee =
        filtreExperience.value;


    // ======================================================
    // TYPE DE LIEU
    // ======================================================

    if (
        typeLieuSelectionne &&
        lieu.type_lieu !==
            typeLieuSelectionne
    ) {

        return false;
    }


    // ======================================================
    // FILTRES PORTANT SUR LES VISITES
    // ======================================================

    const visites =
        visitesParLieu[
            lieu.lieu_id
        ] || [];


    /*
     * Si aucun filtre de visite n'est sélectionné,
     * le lieu passe automatiquement.
     */

    if (
        !voyageSelectionne &&
        !contexteSelectionne &&
        !experienceSelectionnee
    ) {

        return true;
    }


    /*
     * IMPORTANT :
     *
     * Tous les critères doivent être satisfaits
     * par UNE MÊME visite.
     *
     * Cela permet d'éviter qu'un lieu soit affiché
     * parce qu'il possède par exemple :
     *
     * - un voyage correspondant
     * - mais une expérience correspondant à une autre visite.
     */

    return visites.some(
        visite => {

            if (
                voyageSelectionne &&
                String(
                    visite.voyage_id
                ) !==
                String(
                    voyageSelectionne
                )
            ) {

                return false;
            }


            if (
                contexteSelectionne &&
                String(
                    visite.type_contexte
                ) !==
                String(
                    contexteSelectionne
                )
            ) {

                return false;
            }


            if (
                experienceSelectionnee &&
                String(
                    visite.type_experience
                ) !==
                String(
                    experienceSelectionnee
                )
            ) {

                return false;
            }


            return true;
        }
    );
}


// ==========================================================
// AFFICHAGE DES LIEUX FILTRES
// ==========================================================

function afficherLieuxFiltres() {

    if (
        !map ||
        !map.isStyleLoaded()
    ) {

        return;
    }


    // ------------------------------------------------------
    // NETTOYAGE
    // ------------------------------------------------------

    supprimerMarqueurs();

    supprimerHeatmap();


    // ------------------------------------------------------
    // FILTRAGE
    // ------------------------------------------------------

    const lieuxFiltres =
        tousLesLieux.filter(
            lieu => {

                if (
                    !lieuCorrespondAuxFiltres(
                        lieu
                    )
                ) {

                    return false;
                }


                return (
                    lieu.latitude !== null &&
                    lieu.latitude !== undefined &&
                    lieu.longitude !== null &&
                    lieu.longitude !== undefined
                );

            }
        );


    // ------------------------------------------------------
    // COMPTEUR
    // ------------------------------------------------------

    const lieuxAvecCoordonnees =
        tousLesLieux.filter(
            lieu =>
                lieu.latitude !== null &&
                lieu.longitude !== null
        ).length;


    compteur.textContent =
        lieuxFiltres.length +
        " lieux";


    // ------------------------------------------------------
    // AUCUN RESULTAT
    // ------------------------------------------------------

    if (lieuxFiltres.length === 0) {

        return;
    }


    // ------------------------------------------------------
    // BOUNDS
    // ------------------------------------------------------

    const bounds =
        new maplibregl.LngLatBounds();


    lieuxFiltres.forEach(
        lieu => {

            bounds.extend([

                Number(
                    lieu.longitude
                ),

                Number(
                    lieu.latitude
                )

            ]);

        }
    );


    // ======================================================
    // HEATMAP
    // ======================================================

    if (
        modeAffichage === "heatmap"
    ) {

        const geojson = {

            type: "FeatureCollection",

            features:
                lieuxFiltres.map(
                    lieu => ({

                        type: "Feature",

                        geometry: {

                            type: "Point",

                            coordinates: [

                                Number(
                                    lieu.longitude
                                ),

                                Number(
                                    lieu.latitude
                                )

                            ]

                        },

                        properties: {

                            lieu_id:
                                lieu.lieu_id

                        }

                    })
                )

        };


        map.addSource(
            "lieux-heatmap",
            {

                type: "geojson",

                data: geojson

            }
        );


        map.addLayer({

            id: "heatmap-lieux",

            type: "heatmap",

            source: "lieux-heatmap",

            maxzoom: 12,

            paint: {

                "heatmap-intensity": [

                    "interpolate",

                    ["linear"],

                    ["zoom"],

                    2,
                    0.7,

                    4,
                    0.9,

                    6,
                    1.15,

                    8,
                    1.4,

                    10,
                    1.7,

                    12,
                    2.0

                ],


                "heatmap-radius": [

                    "interpolate",

                    ["linear"],

                    ["zoom"],

                    2,
                    14,

                    4,
                    20,

                    6,
                    27,

                    8,
                    34,

                    10,
                    40,

                    12,
                    46

                ],


                "heatmap-opacity": [

                    "interpolate",

                    ["linear"],

                    ["zoom"],

                    2,
                    0.70,

                    5,
                    0.75,

                    8,
                    0.80,

                    12,
                    0.84

                ],


                "heatmap-color": [

                    "interpolate",

                    ["linear"],

                    ["heatmap-density"],

                    0,
                    "rgba(33,102,172,0)",

                    0.08,
                    "rgba(33,102,172,0.30)",

                    0.20,
                    "rgba(103,169,207,0.55)",

                    0.35,
                    "rgba(209,229,240,0.70)",

                    0.50,
                    "rgba(253,219,199,0.78)",

                    0.65,
                    "rgba(239,138,98,0.84)",

                    0.80,
                    "rgba(215,48,39,0.90)",

                    1,
                    "rgba(165,0,38,0.96)"

                ]

            }

        });


        map.fitBounds(

            bounds,

            {

                padding: 70,

                maxZoom: 6,

                duration: 700

            }

        );


        return;
    }


    // ======================================================
    // MARQUEURS
    // ======================================================

    lieuxFiltres.forEach(
        lieu => {

            const photosLieu =
                photosParLieu[
                    lieu.lieu_id
                ] || [];


            const popup =
                new maplibregl.Popup({

                    offset: 25,

                    maxWidth:
                        "420px"

                });


            popup.setHTML(

                creerFiche(

                    lieu,

                    photosLieu

                )

            );


            const marqueur =
                new maplibregl.Marker()

                    .setLngLat([

                        Number(
                            lieu.longitude
                        ),

                        Number(
                            lieu.latitude
                        )

                    ])

                    .setPopup(
                        popup
                    )

                    .addTo(
                        map
                    );


            marqueurs.push(
                marqueur
            );

        }
    );


    // ======================================================
    // CADRAGE
    // ======================================================

    map.fitBounds(

        bounds,

        {

            padding: 70,

            maxZoom: 6,

            duration: 700

        }

    );
}


// ==========================================================
// REQUETE SUPABASE GENERIQUE
// ==========================================================

async function supabaseGet(
    table,
    params = ""
) {

    const url =
        SUPABASE_URL +
        "/rest/v1/" +
        table +
        "?select=*" +
        params;


    const response =
        await fetch(

            url,

            {

                method: "GET",

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_KEY,

                    "Accept":
                        "application/json"

                }

            }

        );


    if (!response.ok) {

        const texte =
            await response.text();


        throw new Error(

            table +
            " : HTTP " +
            response.status +
            " — " +
            texte

        );

    }


    return response.json();
}


// ==========================================================
// CHARGEMENT DES DONNEES
// ==========================================================

async function chargerDonnees() {

    compteur.textContent =
        "Connexion à Supabase...";


    try {

        // ==================================================
        // CHARGEMENT PARALLELE
        // ==================================================

        const [

            lieux,
            visites,
            voyages,
            contextes,
            photos

        ] = await Promise.all([

            supabaseGet(
                "lieux",
                "&order=lieu_id.asc"
            ),

            supabaseGet(
                "visites",
                "&order=visite_id.asc"
            ),

            supabaseGet(
                "voyages",
                "&order=voyage_id.asc"
            ),

            supabaseGet(
                "types_contexte",
                "&order=code.asc"
            ),

            supabaseGet(
                "photos",
                "&order=ordre.asc"
            )

        ]);


        // ==================================================
        // STOCKAGE
        // ==================================================

        tousLesLieux =
            lieux;


        toutesLesVisites =
            visites;


        tousLesVoyages =
            voyages;


        tousLesContextes =
            contextes;


        toutesLesPhotos =
            photos;


        console.log(
            "Lieux chargés :",
            tousLesLieux.length
        );


        console.log(
            "Visites chargées :",
            toutesLesVisites.length
        );


        console.log(
            "Voyages chargés :",
            tousLesVoyages.length
        );


        console.log(
            "Contextes chargés :",
            tousLesContextes.length
        );


        console.log(
            "Photos chargées :",
            toutesLesPhotos.length
        );


        // ==================================================
        // INDEX VOYAGES
        // ==================================================

        voyagesParId = {};


        tousLesVoyages.forEach(
            voyage => {

                if (
                    voyage.voyage_id
                ) {

                    voyagesParId[
                        voyage.voyage_id
                    ] = voyage;

                }

            }
        );


        // ==================================================
        // INDEX CONTEXTES
        // ==================================================

        contextesParCode = {};


        tousLesContextes.forEach(
            contexte => {

                if (
                    contexte.code
                ) {

                    contextesParCode[
                        contexte.code
                    ] = contexte;

                }

            }
        );


        // ==================================================
        // INDEX VISITES PAR LIEU
        // ==================================================

        visitesParLieu = {};


        toutesLesVisites.forEach(
            visite => {

                if (
                    !visite.lieu_id
                ) {

                    return;
                }


                if (
                    !visitesParLieu[
                        visite.lieu_id
                    ]
                ) {

                    visitesParLieu[
                        visite.lieu_id
                    ] = [];

                }


                visitesParLieu[
                    visite.lieu_id
                ].push(
                    visite
                );

            }
        );


        // ==================================================
        // INDEX PHOTOS PAR LIEU
        // ==================================================

        photosParLieu = {};


        toutesLesPhotos.forEach(
            photo => {

                if (
                    !photo.lieu_id
                ) {

                    return;
                }


                if (
                    !photosParLieu[
                        photo.lieu_id
                    ]
                ) {

                    photosParLieu[
                        photo.lieu_id
                    ] = [];

                }


                photosParLieu[
                    photo.lieu_id
                ].push(
                    photo
                );

            }
        );


        // ==================================================
        // FILTRES
        // ==================================================

        remplirFiltres();


        // ==================================================
        // MESSAGE DE CONTROLE
        // ==================================================

        const lieuxAvecCoordonnees =
            tousLesLieux.filter(
                lieu =>
                    lieu.latitude !== null &&
                    lieu.longitude !== null
            ).length;


        console.log(
            "Lieux cartographiables :",
            lieuxAvecCoordonnees
        );


        console.log(
            "Lieux sans coordonnées :",
            tousLesLieux.length -
            lieuxAvecCoordonnees
        );


        // ==================================================
        // AFFICHAGE
        // ==================================================

        if (
            map.isStyleLoaded()
        ) {

            afficherLieuxFiltres();

        } else {

            map.once(
                "load",
                function() {

                    afficherLieuxFiltres();

                }
            );

        }


    } catch (erreur) {

        console.error(
            "ERREUR ATLAS :",
            erreur
        );


        afficherErreur(

            "Impossible de charger les données : " +
            erreur.message

        );

    }

}

// ==========================================================

document.addEventListener(
    "click",

    function(event) {

        const miniature =
            event.target.closest(
                ".fiche-miniature"
            );


        if (!miniature) {
            return;
        }


        const popup =
            miniature.closest(
                ".maplibregl-popup"
            );


        if (!popup) {
            return;
        }


        const grandePhoto =
            popup.querySelector(
                ".fiche-photo"
            );


        if (!grandePhoto) {
            return;
        }


        grandePhoto.src =
            miniature.dataset.photoUrl;


        grandePhoto.alt =
            miniature.dataset.photoTitre ||
            "";

    }
);
