<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Mon Atlas</title>

<link
    href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"
    rel="stylesheet"
>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    flex-direction: column;
}


/* ==========================================================
   EN-TÊTE
   ========================================================== */

header {
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 8px 20px;
    box-sizing: border-box;
    background: white;
    border-bottom: 1px solid #ddd;
    z-index: 10;
}

h1 {
    margin: 0;
    font-size: 22px;
    white-space: nowrap;
}


/* ==========================================================
   FILTRES
   ========================================================== */

#filtres {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.filtre {
    padding: 7px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: white;
    font-size: 13px;
    max-width: 190px;
}

#compteur {
    font-size: 13px;
    color: #666;
    white-space: nowrap;
}


/* ==========================================================
   AUTHENTIFICATION
   ========================================================== */

#zone-auth {
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
}

.bouton {
    padding: 7px 11px;
    border: 1px solid #bbb;
    border-radius: 6px;
    background: white;
    cursor: pointer;
    font-size: 13px;
}

.bouton:hover {
    background: #f3f3f3;
}

.bouton-principal {
    background: #222;
    color: white;
    border-color: #222;
}

.bouton-principal:hover {
    background: #444;
}

.bouton-danger {
    color: #b00020;
    border-color: #d99;
}

.bouton:disabled {
    opacity: 0.6;
    cursor: wait;
}

#statut-auth {
    font-size: 12px;
    color: #555;
}


/* ==========================================================
   CARTE
   ========================================================== */

main {
    flex: 1;
    min-height: 0;
}

#map {
    width: 100%;
    height: 100%;
}


/* ==========================================================
   MESSAGE
   ========================================================== */

#message {
    position: fixed;
    top: 70px;
    left: 10px;
    right: 10px;
    z-index: 2000;
    padding: 12px;
    background: white;
    border-radius: 8px;
    box-shadow:
        0 2px 8px rgba(0,0,0,0.2);
    display: none;
    color: #b00020;
}


/* ==========================================================
   FICHE
   ========================================================== */

.fiche-lieu {
    font-family: Arial, sans-serif;
    line-height: 1.4;
    width: 100%;
}

.fiche-titre {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 4px;
}

.fiche-localisation {
    color: #666;
    margin-bottom: 10px;
}

.fiche-rubrique {
    margin-top: 8px;
}

.fiche-infos {
    margin-top: 8px;
}

.fiche-sous-titre {
    font-weight: bold;
    margin-bottom: 5px;
}

.fiche-description {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid #ddd;
}

.fiche-notes {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #ddd;
    color: #555;
}

.fiche-historique {
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid #ddd;
}

.fiche-visites-liste {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 8px;
}

.fiche-visite {
    padding: 9px 10px;
    border: 1px solid #ddd;
    border-radius: 7px;
    background: #fafafa;
}

.fiche-visite-date {
    font-weight: bold;
    margin-bottom: 4px;
}

.fiche-visite-meta {
    font-size: 12px;
    color: #555;
    line-height: 1.45;
}

.fiche-visite-detail {
    margin-top: 5px;
    font-size: 13px;
    line-height: 1.4;
}

.fiche-visite-notes {
    margin-top: 5px;
    font-size: 12px;
    color: #666;
}


/* ==========================================================
   PHOTOS
   ========================================================== */

.fiche-photo {
    display: block;
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 10px;
    cursor: pointer;
}

.fiche-galerie {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    margin-bottom: 12px;
    padding-bottom: 3px;
}

.fiche-miniature {
    width: 64px;
    height: 50px;
    object-fit: cover;
    border-radius: 6px;
    flex-shrink: 0;
    cursor: pointer;
}

.fiche-miniature:hover {
    opacity: 0.75;
}

/* ==========================================================
   VISIONNEUSE PHOTO
   ========================================================== */

#fond-visionneuse-photo {
    position: fixed;
    inset: 0;
    z-index: 5000;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.88);
    padding: 20px;
    box-sizing: border-box;
}

.visionneuse-photo-contenu {
    position: relative;
    width: min(1100px, 100%);
    height: min(92vh, 900px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
}

#visionneuse-photo-image {
    max-width: 100%;
    max-height: calc(100% - 90px);
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.45);
}

#visionneuse-photo-legende {
    width: min(850px, 100%);
    margin-top: 12px;
    color: white;
    text-align: center;
    line-height: 1.4;
    font-size: 14px;
}

#visionneuse-photo-titre {
    font-weight: bold;
    font-size: 16px;
}

#visionneuse-photo-description {
    margin-top: 4px;
    opacity: 0.9;
}

.visionneuse-photo-bouton {
    position: absolute;
    border: 0;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    background: rgba(255,255,255,0.9);
    color: #222;
    font-size: 26px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
}

.visionneuse-photo-bouton:hover {
    background: white;
}

#bouton-fermer-visionneuse {
    top: 0;
    right: 0;
}

#bouton-photo-precedente {
    left: 0;
    top: 45%;
}

#bouton-photo-suivante {
    right: 0;
    top: 45%;
}

#visionneuse-photo-compteur {
    margin-top: 5px;
    font-size: 12px;
    opacity: 0.8;
}

.icone {
    margin-right: 4px;
}


/* ==========================================================
   BOUTONS DANS POPUP
   ========================================================== */

.actions-lieu {
    display: flex;
    gap: 6px;
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid #ddd;
}


/* ==========================================================
   MODALE
   ========================================================== */

#fond-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 3000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
}

#modal {
    width: min(700px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background: white;
    border-radius: 10px;
    box-shadow:
        0 5px 30px rgba(0,0,0,0.3);
    padding: 22px;
    box-sizing: border-box;
}

#modal h2 {
    margin-top: 0;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.form-groupe {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.form-groupe.large {
    grid-column: 1 / -1;
}

.form-groupe label {
    font-size: 13px;
    font-weight: bold;
}

.form-groupe input,
.form-groupe select,
.form-groupe textarea {
    box-sizing: border-box;
    width: 100%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-family: Arial, sans-serif;
    font-size: 14px;
}

.form-groupe textarea {
    min-height: 90px;
    resize: vertical;
}

#actions-formulaire {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
    padding-top: 15px;
    border-top: 1px solid #ddd;
}

#message-formulaire {
    margin-top: 10px;
    color: #b00020;
    font-size: 13px;
}


/* ==========================================================
   MARQUEURS
   ========================================================== */

.maplibregl-marker {
    cursor: pointer;
}


/* ==========================================================
   GESTION VOYAGES / PHOTOS
   ========================================================== */

.fond-modal-gestion {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 3000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
}

.modal-gestion {
    width: min(900px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background: white;
    border-radius: 10px;
    box-shadow: 0 5px 30px rgba(0,0,0,0.3);
    padding: 22px;
    box-sizing: border-box;
}

.modal-gestion h2 {
    margin-top: 0;
}

.liste-gestion {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 15px;
}

.ligne-gestion {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 7px;
    background: #fafafa;
}

.ligne-gestion-principale {
    min-width: 0;
    flex: 1;
}

.ligne-gestion-titre {
    font-weight: bold;
}

.ligne-gestion-meta {
    color: #666;
    font-size: 12px;
    margin-top: 3px;
}

.actions-gestion {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
}

.formulaire-gestion {
    margin-top: 15px;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fafafa;
}

.photo-gestion-apercu {
    width: 110px;
    height: 75px;
    object-fit: cover;
    border-radius: 6px;
    flex-shrink: 0;
}

/* ==========================================================
   DETAIL D'UN VOYAGE
   ========================================================== */

.modal-voyage-detail { width: min(1050px, 100%); max-height: 92vh; overflow-y: auto; }
.voyage-detail-entete { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 20px; align-items: start; }
.voyage-detail-couverture { width: 100%; height: 170px; object-fit: cover; border-radius: 8px; background: #eee; }
.voyage-detail-titre { margin: 0 0 6px; font-size: 25px; }
.voyage-detail-meta { color: #666; margin-bottom: 12px; }
.voyage-detail-description { white-space: pre-line; line-height: 1.45; }
.voyage-detail-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0; }
.voyage-detail-stat { padding: 12px; border: 1px solid #ddd; border-radius: 8px; background: #fafafa; text-align: center; }
.voyage-detail-stat strong { display: block; font-size: 22px; }
.voyage-detail-section { margin-top: 20px; }
.voyage-detail-section h3 { margin: 0 0 10px; }
.voyage-detail-visite { padding: 11px 0; border-bottom: 1px solid #e5e5e5; }
.voyage-detail-visite:last-child { border-bottom: none; }
.voyage-detail-visite-date { font-weight: bold; }
.voyage-detail-lieu { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid #eee; }
.voyage-detail-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-top: 20px; padding-top: 15px; border-top: 1px solid #ddd; }

@media (max-width: 700px) {
    .voyage-detail-entete { grid-template-columns: 1fr; }
    .voyage-detail-couverture { height: 150px; }
    .voyage-detail-stats { grid-template-columns: 1fr; }
}

@media (max-width: 700px) {
    .ligne-gestion {
        align-items: flex-start;
        flex-direction: column;
    }

    .actions-gestion {
        width: 100%;
    }
}


/* ==========================================================
   MOBILE
   ========================================================== */

@media (max-width: 700px) {

    header {
        min-height: auto;
        padding: 10px;
        align-items: flex-start;
        flex-direction: column;
    }

    #filtres {
        width: 100%;
        justify-content: flex-start;
    }

    .filtre {
        flex: 1;
        min-width: 0;
        max-width: none;
    }

    #compteur {
        width: 100%;
    }

    #zone-auth {
        width: 100%;
        justify-content: flex-end;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-groupe.large {
        grid-column: auto;
    }

}


/* ==========================================================
   GESTION DES VISITES
   ========================================================== */

.modal-visites {
    width: min(900px, 96vw);
    max-height: 90vh;
    overflow-y: auto;
}

.liste-visites-gestion {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 16px 0;
}

.visite-gestion {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 12px;
    background: #fafafa;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: center;
}

.visite-gestion-titre {
    font-weight: 700;
}

.visite-gestion-meta {
    font-size: 0.9em;
    color: #666;
    margin-top: 4px;
}

.visite-gestion-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.form-visite-gestion {
    border-top: 1px solid #ddd;
    margin-top: 18px;
    padding-top: 18px;
}

@media (max-width: 650px) {
    .visite-gestion {
        grid-template-columns: 1fr;
    }
    .visite-gestion-actions {
        justify-content: flex-start;
    }
}

</style>

</head>


<body>


<header>

    <h1>Mon Atlas</h1>


    <div id="filtres">

        <select id="modeCarte" class="filtre">

            <option value="marqueurs">
                📍 Lieux
            </option>

            <option value="heatmap">
                🔥 Heatmap
            </option>

        </select>


        <select id="filtreVoyage" class="filtre">

            <option value="">
                Tous les voyages
            </option>

        </select>


        <select id="filtreContexte" class="filtre">

            <option value="">
                Tous les contextes
            </option>

        </select>


        <select id="filtreTypeLieu" class="filtre">

            <option value="">
                Tous les types
            </option>

        </select>


        <select id="filtreExperience" class="filtre">

            <option value="">
                Toutes les expériences
            </option>

        </select>


        <select id="filtreAnnee" class="filtre">

            <option value="">
                Toutes les années
            </option>

        </select>


        <span id="compteur">
            Chargement...
        </span>


        <div id="zone-auth">

            <span id="statut-auth">
                Non connecté
            </span>

            <button
                id="boutonConnexion"
                class="bouton"
            >
                🔐 Connexion
            </button>

            <button
                id="boutonDeconnexion"
                class="bouton"
                style="display:none"
            >
                Déconnexion
            </button>

            <button
                id="boutonAjouter"
                class="bouton bouton-principal"
                style="display:none"
            >
                ＋ Ajouter
            </button>

            <button
                id="boutonVoyages"
                class="bouton"
                style="display:none"
            >
                ✈️ Voyages
            </button>

            <button
                id="boutonPhotos"
                class="bouton"
                style="display:none"
            >
                🖼️ Photos
            </button>

        </div>

    </div>

</header>


<div id="message"></div>


<main>

    <div id="map"></div>

</main>


<!-- ========================================================
     MODALE FORMULAIRE
     ======================================================== -->

<div id="fond-modal">

    <div id="modal">

        <h2 id="titre-modal">
            Ajouter un lieu
        </h2>


        <form id="formulaire-lieu">

            <input
                type="hidden"
                id="champ-lieu-id"
            >


            <div class="form-grid">


                <div class="form-groupe large">

                    <label for="champ-nom">
                        Nom du lieu *
                    </label>

                    <input
                        id="champ-nom"
                        required
                    >

                </div>


                <div class="form-groupe">

                    <label for="champ-ville">
                        Ville
                    </label>

                    <input id="champ-ville">

                </div>


                <div class="form-groupe">

                    <label for="champ-pays">
                        Pays
                    </label>

                    <input id="champ-pays">

                </div>


                <div class="form-groupe">

                    <label for="champ-latitude">
                        Latitude
                    </label>

                    <input
                        id="champ-latitude"
                        type="number"
                        step="any"
                    >

                </div>


                <div class="form-groupe">

                    <label for="champ-longitude">
                        Longitude
                    </label>

                    <input
                        id="champ-longitude"
                        type="number"
                        step="any"
                    >

                </div>


                <div class="form-groupe">

                    <label for="champ-type-lieu">
                        Type de lieu
                    </label>

                    <input id="champ-type-lieu">

                </div>


                <div class="form-groupe">

                    <label for="champ-voyage">
                        Voyage
                    </label>

                    <select id="champ-voyage">

                        <option value="">
                            Aucun voyage
                        </option>

                    </select>

                </div>


                <div class="form-groupe">

                    <label for="champ-date-debut">
                        Date de début
                    </label>

                    <input
                        id="champ-date-debut"
                        type="date"
                    >

                </div>


                <div class="form-groupe">

                    <label for="champ-date-fin">
                        Date de fin
                    </label>

                    <input
                        id="champ-date-fin"
                        type="date"
                    >

                </div>


                <div class="form-groupe">

                    <label for="champ-date-texte">
                        Date en texte
                    </label>

                    <input
                        id="champ-date-texte"
                        placeholder="Ex. Été 2024"
                    >

                </div>


                <div class="form-groupe">

                    <label for="champ-contexte">
                        Contexte
                    </label>

                    <select id="champ-contexte">

                        <option value="">
                            Aucun contexte
                        </option>

                    </select>

                </div>


                <div class="form-groupe">

                    <label for="champ-experience">
                        Expérience
                    </label>

                    <input id="champ-experience">

                </div>


                <div class="form-groupe">

                    <label for="champ-note">
                        Note /5
                    </label>

                    <input
                        id="champ-note"
                        type="number"
                        min="0"
                        max="5"
                        step="1"
                    >

                </div>


                <div class="form-groupe large">

                    <label for="champ-adresse">
                        Adresse
                    </label>

                    <input id="champ-adresse">

                </div>


                <div class="form-groupe large">

                    <label for="champ-description">
                        Description
                    </label>

                    <textarea
                        id="champ-description"
                    ></textarea>

                </div>


                <div class="form-groupe large">

                    <label for="champ-notes">
                        Notes personnelles
                    </label>

                    <textarea
                        id="champ-notes"
                    ></textarea>

                </div>


            </div>


            <div id="message-formulaire"></div>


            <div id="actions-formulaire">

                <button
                    type="button"
                    id="boutonAnnuler"
                    class="bouton"
                >
                    Annuler
                </button>

                <button
                    type="button"
                    id="boutonGererVisites"
                    class="bouton"
                    style="display:none"
                >
                    🗓️ Gérer les visites
                </button>

                <button
                    type="submit"
                    id="boutonEnregistrer"
                    class="bouton bouton-principal"
                >
                    Enregistrer
                </button>

            </div>

        </form>

    </div>

</div>


<!-- ========================================================
     MODALE GESTION DES VISITES
     ======================================================== -->

<div id="fond-modal-visites" class="fond-modal-gestion">
    <div id="modal-visites" class="modal-visites">

        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
            <h2 id="titre-modal-visites">Visites</h2>
            <button type="button" id="boutonFermerVisites" class="bouton">Fermer</button>
        </div>

        <div id="liste-visites-gestion" class="liste-visites-gestion"></div>

        <div class="form-visite-gestion">
            <h3 id="titre-form-visite">Ajouter une visite</h3>
            <input type="hidden" id="champ-visite-id-gestion">
            <input type="hidden" id="champ-visite-lieu-id-gestion">

            <div class="form-grid">
                <div class="form-groupe">
                    <label for="champ-visite-voyage">Voyage</label>
                    <select id="champ-visite-voyage">
                        <option value="">Aucun voyage</option>
                    </select>
                </div>

                <div class="form-groupe">
                    <label for="champ-visite-contexte">Contexte *</label>
                    <select id="champ-visite-contexte">
                        <option value="">Choisir un contexte</option>
                    </select>
                </div>

                <div class="form-groupe">
                    <label for="champ-visite-date-debut">Date de début</label>
                    <input id="champ-visite-date-debut" type="date">
                </div>

                <div class="form-groupe">
                    <label for="champ-visite-date-fin">Date de fin</label>
                    <input id="champ-visite-date-fin" type="date">

// ==========================================================

function afficherErreur(texte) {

    console.error(texte);

    message.textContent =
        "⚠️ " + texte;

    message.style.display =
        "block";
}


// ==========================================================
// ECHAPPEMENT HTML
// ==========================================================

function echapperHTML(texte) {

    if (
        texte === null ||
        texte === undefined
    ) {
        return "";
    }

    return String(texte)

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// ==========================================================
// DATES
// ==========================================================

function formaterDate(date) {

    if (!date) {
        return "";
    }

    const morceaux =
        String(date).split("-");

    if (morceaux.length !== 3) {
        return String(date);
    }

    return (
        morceaux[2] +
        "/" +
        morceaux[1] +
        "/" +
        morceaux[0]
    );
}


function afficherPeriode(
    dateDebut,
    dateFin,
    precision,
    dateTexte
) {

    if (dateTexte) {
        return echapperHTML(dateTexte);
    }

    if (!dateDebut) {
        return "";
    }

    const debut =
        formaterDate(dateDebut);

    if (
        !dateFin ||
        dateFin === dateDebut
    ) {
        return debut;
    }

    return (
        debut +
        " → " +
        formaterDate(dateFin)
    );
}


// ==========================================================
// PHOTOS
// ==========================================================

function construireUrlPhoto(fichier) {

    if (!fichier) {
        return "";
    }

    const cheminEncode =
        String(fichier)
            .split("/")
            .map(
                segment =>
                    encodeURIComponent(segment)
            )
            .join("/");

    return (
        SUPABASE_URL +
        "/storage/v1/object/public/photos/" +
        cheminEncode
    );
}


// ==========================================================
// CARTE
// ==========================================================

let map;

try {

    map =
        new maplibregl.Map({

            container: "map",

            style:

                MAPTILER_KEY,

            center: [
                2.5,
                46.5
            ],

            zoom: 4
        });


    map.addControl(
        new maplibregl.NavigationControl(),
        "top-right"
    );


    // Important :
    // les données peuvent être chargées avant que
    // le style de la carte soit prêt.
    map.on(
        "load",
        function() {
            afficherLieuxFiltres();
        }
    );


} catch (erreur) {

    afficherErreur(
        "Impossible d'initialiser la carte : " +
        erreur.message
    );
}


// ==========================================================
// VISITE
// ==========================================================

function obtenirVisite(lieu) {

    if (!lieu || !lieu.lieu_id) {
        return null;
    }

    const visites =
        visitesParLieu[lieu.lieu_id];

    if (
        !Array.isArray(visites) ||
        visites.length === 0
    ) {
        return null;
    }

    return visites[0];
}


function obtenirNomContexte(visite) {

    if (
        !visite ||
        !visite.type_contexte
    ) {
        return "";
    }

    const contexte =
        typesContexteParCode[
            visite.type_contexte
        ];

    if (contexte) {

        return (
            contexte.nom ||
            contexte.code ||
            visite.type_contexte
        );
    }

    return visite.type_contexte;
}


// ==========================================================
// FICHE
// ==========================================================

function creerFiche(
    lieu,
    visites,
    photos
) {

    const visitesLieu =
        Array.isArray(visites)
            ? [...visites]
            : [];


    // On affiche les visites de la plus récente à la plus ancienne.
    visitesLieu.sort(
        (a, b) => {
            const dateA =
                a.date_debut ||
                a.date_fin ||
                "";

            const dateB =
                b.date_debut ||
                b.date_fin ||
                "";

            if (dateA !== dateB) {
                return String(dateB).localeCompare(String(dateA));
            }

            return String(a.date_texte || "").localeCompare(
                String(b.date_texte || ""),
                "fr"
            );
        }
    );


    let html = `
        <div class="fiche-lieu">
    `;


    // ------------------------------------------------------
    // PHOTOS : ordre principal puis ordre numérique
    // ------------------------------------------------------

    const photosAffichees = Array.isArray(photos)
        ? [...photos]
            .filter(photo => photo && photo.fichier)
            .sort((a, b) => {
                if (Boolean(b.photo_principale) !== Boolean(a.photo_principale)) {
                    return Boolean(b.photo_principale) ? 1 : -1;
                }
                return Number(a.ordre || 1) - Number(b.ordre || 1);
            })
        : [];

    const photoPrincipale = photosAffichees[0] || null;


    if (photoPrincipale) {

        const urlPhoto =
            construireUrlPhoto(
                photoPrincipale.fichier
            );

        html += `
            <img
                class="fiche-photo"
                src="${echapperHTML(urlPhoto)}"
                data-photo-index="0"
                data-photo-url="${echapperHTML(urlPhoto)}"
                data-photo-titre="${echapperHTML(photoPrincipale.titre || lieu.nom)}"
                data-photo-description="${echapperHTML(photoPrincipale.description || "")}"
                data-photo-date="${echapperHTML(photoPrincipale.date_photo || "")}"
                alt="${echapperHTML(photoPrincipale.titre || lieu.nom)}"
                title="Cliquer pour agrandir"
            >
        `;
    }


    // ------------------------------------------------------
    // MINI-GALERIE
    // ------------------------------------------------------

    if (
        Array.isArray(photos) &&
        photos.length > 1
    ) {

        html += `
            <div class="fiche-galerie">
        `;

        photosAffichees.forEach(
            (photo, index) => {

                const urlPhoto =
                    construireUrlPhoto(photo.fichier);

                html += `
                    <img
                        class="fiche-miniature"
                        src="${echapperHTML(urlPhoto)}"
                        data-photo-index="${index}"
                        data-photo-url="${echapperHTML(urlPhoto)}"
                        data-photo-titre="${echapperHTML(photo.titre || lieu.nom)}"
                        data-photo-description="${echapperHTML(photo.description || "")}"
                        data-photo-date="${echapperHTML(photo.date_photo || "")}"
                        alt="${echapperHTML(photo.titre || lieu.nom)}"
                        title="Cliquer pour agrandir"
                    >
                `;
            }
        );

        html += `
            </div>
        `;
    }


    if (photosAffichees.length > 0) {
        html += `
            <div class="fiche-visite-meta">
                📷 ${photosAffichees.length} photo${photosAffichees.length > 1 ? "s" : ""} · cliquer pour agrandir
            </div>
        `;
    }


    // ------------------------------------------------------
    // IDENTITE DU LIEU
    // ------------------------------------------------------

    html += `
        <div class="fiche-titre">
            ${echapperHTML(lieu.nom)}
        </div>
    `;


    const localisation = [
        lieu.ville,
        lieu.pays
    ]
        .filter(Boolean)
        .map(echapperHTML)
        .join(" · ");


    if (localisation) {
        html += `
            <div class="fiche-localisation">
                📍 ${localisation}
            </div>
        `;
    }


    if (lieu.type_lieu) {
        html += `
            <div class="fiche-rubrique">
                📍 <strong>Type :</strong>
                ${echapperHTML(lieu.type_lieu)}
            </div>
        `;
    }


    if (lieu.adresse) {
        html += `
            <div class="fiche-rubrique">
                🏠 <strong>Adresse :</strong><br>
                ${echapperHTML(lieu.adresse)}
            </div>
        `;
    }


    // ------------------------------------------------------
    // HISTORIQUE COMPLET DES VISITES
    // ------------------------------------------------------

    if (visitesLieu.length > 0) {

        html += `
            <div class="fiche-historique">
                <div class="fiche-sous-titre">
                    🗓️ Historique des visites (${visitesLieu.length})
                </div>
                <div class="fiche-visites-liste">
        `;

        visitesLieu.forEach(
            visite => {

                const dateVisite =
                    afficherPeriode(
                        visite.date_debut,
                        visite.date_fin,
                        visite.date_precision,
                        visite.date_texte
                    );

                const nomContexte =
                    obtenirNomContexte(visite);

                const voyageVisite =
                    voyagesParId[visite.voyage_id];

                html += `
                    <div class="fiche-visite">
                        <div class="fiche-visite-date">
                            📅 ${echapperHTML(
                                dateVisite || "Date non renseignée"
                            )}
                        </div>
                `;

                const meta = [];

                if (nomContexte) {
                    meta.push(
                        "🧭 " + echapperHTML(nomContexte)
                    );
                }

                if (voyageVisite) {
                    meta.push(
                        "✈️ " + echapperHTML(voyageVisite.nom)
                    );
                }

                if (visite.type_experience) {
                    meta.push(
                        "✨ " + echapperHTML(visite.type_experience)
                    );
                }

                if (
                    visite.note !== null &&
                    visite.note !== undefined
                ) {
                    meta.push(
                        "⭐ " + echapperHTML(visite.note) + "/5"
                    );
                }

                if (meta.length > 0) {
                    html += `
                        <div class="fiche-visite-meta">
                            ${meta.join(" · ")}
                        </div>
                    `;
                }

                if (visite.description) {
                    html += `
                        <div class="fiche-visite-detail">
                            ${echapperHTML(visite.description)}
                        </div>
                    `;
                }

                if (visite.notes) {
                    html += `
                        <div class="fiche-visite-notes">
                            📝 ${echapperHTML(visite.notes)}
                        </div>
                    `;
                }

                html += `
                    </div>
                `;
            }
        );

        html += `
                </div>
            </div>
        `;

    } else {

        // Informations historiques éventuellement stockées directement sur le lieu.
        const dateLieu =
            afficherPeriode(
                lieu.date_debut,
                lieu.date_fin,
                lieu.date_precision,
                lieu.date_texte
            );

        if (dateLieu) {
            html += `
                <div class="fiche-rubrique">
                    📅 <strong>Date :</strong>
                    ${echapperHTML(dateLieu)}
                </div>
            `;
        }
    }


    // ------------------------------------------------------
    // DESCRIPTION GENERALE DU LIEU
    // ------------------------------------------------------

    if (lieu.description) {
        html += `
            <div class="fiche-description">
                <div class="fiche-sous-titre">
                    Description du lieu
                </div>
                <div>
                    ${echapperHTML(lieu.description)}
                </div>
            </div>
        `;
    }


    if (lieu.notes) {
        html += `
            <div class="fiche-notes">
                <div class="fiche-sous-titre">
                    Notes personnelles
                </div>
                <div>
                    ${echapperHTML(lieu.notes)}
                </div>
            </div>
        `;
    }


    // ------------------------------------------------------
    // ACTIONS ADMINISTRATEUR
    // ------------------------------------------------------

    if (utilisateurConnecte) {

        html += `
            <div class="actions-lieu">
                <button
                    class="bouton bouton-modifier"
                    data-lieu-id="${echapperHTML(lieu.lieu_id)}"
                >
                    ✏️ Modifier
                </button>

                <button
                    class="bouton bouton-danger bouton-supprimer"
                    data-lieu-id="${echapperHTML(lieu.lieu_id)}"
                >
                    🗑️ Supprimer
                </button>
            </div>
        `;
    }


    html += `
        </div>
    `;

    return html;
}

// ==========================================================
// FILTRES
// ==========================================================

function remplirFiltres() {

    filtreVoyage.innerHTML = `
        <option value="">
            Tous les voyages
        </option>
    `;


    [...tousLesVoyages]

        .sort(
            (a, b) =>
                String(a.nom || "")
                    .localeCompare(
                        String(b.nom || ""),
                        "fr"
                    )
        )

        .forEach(
            voyage => {

                if (!voyage.voyage_id) {
                    return;
                }

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    voyage.voyage_id;

                option.textContent =
                    voyage.nom ||
                    voyage.voyage_id;

                filtreVoyage.appendChild(
                    option
                );
            }
        );


    filtreContexte.innerHTML = `
        <option value="">
            Tous les contextes
        </option>
    `;


    const contextesUtilises =
        new Set(
            toutesLesVisites
                .map(
                    visite =>
                        visite.type_contexte
                )
                .filter(Boolean)
        );


    [...tousLesTypesContexte]

        .filter(
            contexte =>
                contextesUtilises.has(
                    contexte.code
                )
        )

        .sort(
            (a, b) =>
                String(
                    a.nom || a.code || ""
                ).localeCompare(
                    String(
                        b.nom || b.code || ""
                    ),
                    "fr"
                )
        )

        .forEach(
            contexte => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    contexte.code;

                option.textContent =
                    contexte.nom ||
                    contexte.code;

                filtreContexte.appendChild(
                    option
                );
            }

        .sort(

        )

        .forEach(
            type => {

                const option =
                    document.createElement(

                    );

                option.value =
                    type;

                option.textContent =
                    type;

                filtreTypeLieu.appendChild(
                    option
                );
            }
        );


    filtreExperience.innerHTML = `
        <option value="">

        </option>

        ...new Set(
            toutesLesVisites
                .map(
                    visite =>
                        visite.type_experience

                .filter(Boolean)
        )
    ]

        .sort(
            (a, b) =>

                )
        )

        .forEach(

                    );

                option.value =

                option.textContent =

    toutesLesVisites.forEach(visite => {

            const annee = String(date).slice(0, 4);
            if (/^\d{4}$/.test(annee)) {

    [...anneesUtilisees]

function supprimerMarqueurs() {

    marqueurs.forEach(
        marqueur =>
            marqueur.remove()
    );

    marqueurs = [];
}


function supprimerHeatmap() {

    if (!map || !map.isStyleLoaded()) {
        return;
    }

    if (
        map.getLayer(
            "heatmap-lieux"
        )
    ) {

        map.removeLayer(
            "heatmap-lieux"
        );
    }

    if (
        map.getSource(
            "lieux-heatmap"
        )
    ) {

        map.removeSource(
            "lieux-heatmap"
        );
    }
}


function afficherLieuxFiltres() {

    if (
        !map ||
        !map.isStyleLoaded()
    ) {
        return;
    }


    supprimerMarqueurs();

    supprimerHeatmap();


    const voyageSelectionne =
        filtreVoyage.value;

    const contexteSelectionne =
        filtreContexte.value;

    const typeLieuSelectionne =
        filtreTypeLieu.value;

    const experienceSelectionnee =
        filtreExperience.value;

    const anneeSelectionnee =
        filtreAnnee.value;


    const lieuxFiltres =
        tousLesLieux.filter(lieu => {

            if (
                typeLieuSelectionne &&
                String(lieu.type_lieu || "") !==
                    String(typeLieuSelectionne)
            ) {
                return false;
            }


            const visitesLieu =
                toutesLesVisites.filter(
                    visite =>
                        String(visite.lieu_id) ===
                        String(lieu.lieu_id)
                );


            // Les filtres Voyage / Contexte / Expérience / Année
            // portent sur une même visite. Cela évite, par exemple,
            // de combiner le voyage d'une visite avec le contexte
            // d'une autre visite du même lieu.
            const filtreVisiteActif =
                Boolean(
                    voyageSelectionne ||
                    contexteSelectionne ||
                    experienceSelectionnee ||
                    anneeSelectionnee
                );


            if (!filtreVisiteActif) {
                return (
                    lieu.latitude !== null &&
                    lieu.longitude !== null
                );
            }


            const correspond =
                visitesLieu.some(visite => {

                    if (
                        voyageSelectionne &&
                        String(visite.voyage_id || "") !==
                            String(voyageSelectionne)
                    ) {
                        return false;
                    }

                    if (
                        contexteSelectionne &&
                        String(visite.type_contexte || "") !==
                            String(contexteSelectionne)
                    ) {
                        return false;
                    }

                    if (
                        experienceSelectionnee &&
                        String(visite.type_experience || "") !==
                            String(experienceSelectionnee)
                    ) {
                        return false;
                    }

                    if (anneeSelectionnee) {
                        const anneeDebut =
                            visite.date_debut
                                ? String(visite.date_debut).slice(0, 4)
                                : "";

                        const anneeFin =
                            visite.date_fin
                                ? String(visite.date_fin).slice(0, 4)
                                : "";

                        if (
                            anneeDebut !== anneeSelectionnee &&
                            anneeFin !== anneeSelectionnee
                        ) {
                            return false;
                        }
                    }

                    return true;
                });


            // Compatibilité avec les anciennes données :
            // si le voyage est encore porté uniquement par le lieu,
            // on continue à pouvoir le filtrer.
            if (
                voyageSelectionne &&
                visitesLieu.length === 0 &&
                String(lieu.voyage_id || "") ===
                    String(voyageSelectionne) &&
                !contexteSelectionne &&
                !experienceSelectionnee &&
                !anneeSelectionnee
            ) {
                return (
                    lieu.latitude !== null &&
                    lieu.longitude !== null
                );
            }


            return (
                correspond &&
                lieu.latitude !== null &&
                lieu.longitude !== null
            );
        });


    compteur.textContent =
        lieuxFiltres.length +
        (
            lieuxFiltres.length > 1
                ? " lieux"
                : " lieu"
        );


    if (lieuxFiltres.length === 0) {
        return;
    }


    const bounds =
        new maplibregl.LngLatBounds();


    lieuxFiltres.forEach(
        lieu => {

            bounds.extend([

                Number(
                    lieu.longitude
                ),

                Number(
                    lieu.latitude
                )

            ]);

        }
    );


    if (
        modeAffichage === "heatmap"
    ) {

        const geojson = {

            type: "FeatureCollection",

            features:
                lieuxFiltres.map(
                    lieu => ({

                        type: "Feature",

                        geometry: {

                            type: "Point",

                            coordinates: [

                                Number(
                                    lieu.longitude
                                ),

                                Number(
                                    lieu.latitude
                                )

                            ]

                        },

                        properties: {

                            lieu_id:
                                lieu.lieu_id

                        }

                    })
                )
        };


        map.addSource(
            "lieux-heatmap",
            {

                type: "geojson",

                data: geojson

            }
        );


        map.addLayer({

            id: "heatmap-lieux",

            type: "heatmap",

            source: "lieux-heatmap",

            maxzoom: 12,

            paint: {

                "heatmap-intensity": [

                    "interpolate",
                    ["linear"],
                    ["zoom"],

                    2, 0.7,
                    4, 0.9,
                    6, 1.15,
                    8, 1.4,
                    10, 1.7,
                    12, 2.0

                ],

                "heatmap-radius": [

                    "interpolate",
                    ["linear"],
                    ["zoom"],

                    2, 14,
                    4, 20,
                    6, 27,
                    8, 34,
                    10, 40,
                    12, 46

                ],

                "heatmap-opacity": [

                    "interpolate",
                    ["linear"],
                    ["zoom"],

                    2, 0.70,
                    5, 0.75,
                    8, 0.80,
                    12, 0.84

                ],

                "heatmap-color": [

                    "interpolate",
                    ["linear"],
                    ["heatmap-density"],

                    0,
                    "rgba(33,102,172,0)",

                    0.08,
                    "rgba(33,102,172,0.30)",

                    0.20,
                    "rgba(103,169,207,0.55)",

                    0.35,
                    "rgba(209,229,240,0.70)",

                    0.50,
                    "rgba(253,219,199,0.78)",

                    0.65,
                    "rgba(239,138,98,0.84)",

                    0.80,
                    "rgba(215,48,39,0.90)",

                    1,
                    "rgba(165,0,38,0.96)"

                ]

            }

        });


        map.fitBounds(
            bounds,
            {
                padding: 70,
                maxZoom: 6,
                duration: 700
            }
        );

        return;
    }


    lieuxFiltres.forEach(
        lieu => {

            const voyage =
                voyagesParId[
                    lieu.voyage_id
                ];

            const visitesLieu =
                visitesParLieu[
                    lieu.lieu_id
                ] || [];

            const photosLieu =
                photosParLieu[
                    lieu.lieu_id
                ] || [];


            const popup =
                new maplibregl.Popup({

                    offset: 25,

                    maxWidth:
                        "420px"

                });


            popup.setHTML(

                creerFiche(

                    lieu,
                    visitesLieu,
                    photosLieu

                )

            );


            const marqueur =
                new maplibregl.Marker()

                    .setLngLat([

                        Number(
                            lieu.longitude
                        ),

                        Number(
                            lieu.latitude
                        )

                    ])

                    .setPopup(popup)

                    .addTo(map);


            marqueurs.push(
                marqueur
            );

        }
    );


    map.fitBounds(

        bounds,

        {

            padding: 70,

            maxZoom: 6,

            duration: 700

        }

    );
}


// ==========================================================
// LECTURE SUPABASE
// ==========================================================

async function recupererTable(
    table,
    select = "*",
    order = null
) {

    let url =
        SUPABASE_URL +
        "/rest/v1/" +
        table +
        "?select=" +
        encodeURIComponent(select);


    if (order) {

        url +=
            "&order=" +
            encodeURIComponent(order);
    }


    const response =
        await fetch(

            url,

            {

                method: "GET",

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_KEY,

                    "Accept":
                        "application/json"

                }

            }

        );


    if (!response.ok) {

        throw new Error(
            table +
            " : HTTP " +
            response.status +
            " — " +
            await response.text()
        );
    }


    return await response.json();
}

async function chargerDonnees() {

    compteur.textContent =
        "Connexion à Supabase...";

    try {

        const [

            lieux,
            voyages,
            visites,
            typesContexte,
            photos

        ] = await Promise.all([

            recupererTable(
                "lieux",
                "*",
                "lieu_id.asc"
            ),

            recupererTable(
                "voyages",
                "*",
                "voyage_id.asc"
            ),

            recupererTable(
                "visites",
                "*",
                "lieu_id.asc"
            ),

            recupererTable(
                "types_contexte",
                "code,nom",
                "nom.asc"
            ),

            recupererTable(
                "photos",
                "*",
                "ordre.asc"
            )

        ]);


        tousLesLieux =
            lieux;

        tousLesVoyages =
            voyages;

        toutesLesVisites =
            visites;

        tousLesTypesContexte =
            typesContexte;

        toutesLesPhotos =
            photos;


        reconstruireTousLesIndex();

        remplirFiltres();

        afficherLieuxFiltres();


    } catch (erreur) {

        console.error(erreur);

        afficherErreur(
            "Impossible de charger les données : " +
            erreur.message
        );
    }
}


// ==========================================================
// RECONSTRUIRE TOUS LES INDEX
// ==========================================================

function reconstruireTousLesIndex() {

    voyagesParId = {};

    tousLesVoyages.forEach(
        voyage => {

            if (voyage.voyage_id) {

                voyagesParId[
                    voyage.voyage_id
                ] = voyage;

            }

        }
    );


    reconstruireIndexVisites();


    typesContexteParCode = {};

    tousLesTypesContexte.forEach(
        contexte => {

            if (contexte.code) {

                typesContexteParCode[
                    contexte.code
                ] = contexte;

            }

        }
    );


    photosParLieu = {};

    toutesLesPhotos.forEach(
        photo => {

            if (!photo.lieu_id) {
                return;
            }

            if (
                !photosParLieu[
                    photo.lieu_id
                ]
            ) {

                photosParLieu[
                    photo.lieu_id
                ] = [];

            }

            photosParLieu[
                photo.lieu_id
            ].push(photo);

        }
    );
}


// ==========================================================
// RECONSTRUIRE INDEX VISITES
// ==========================================================

function reconstruireIndexVisites() {

    visitesParLieu = {};

    toutesLesVisites.forEach(
        visite => {

            if (!visite.lieu_id) {
                return;
            }

            if (
                !visitesParLieu[
                    visite.lieu_id
                ]
            ) {

                visitesParLieu[
                    visite.lieu_id
                ] = [];

            }

            visitesParLieu[
                visite.lieu_id
            ].push(visite);

        }
    );
}

// ==========================================================
// GENERATION ID LIEU
// ==========================================================

function genererNouvelIdLieu() {

    let maximum = 0;


    tousLesLieux.forEach(
        lieu => {

            const match =
                String(
                    lieu.lieu_id || ""
                ).match(
                    /^L(\d+)$/
                );

            if (match) {

                maximum =
                    Math.max(
                        maximum,
                        Number(match[1])
                    );

            }

        }
    );


    return (
        "L" +
        String(
            maximum + 1
        ).padStart(4, "0")
    );
}

                ).value.trim() || null,

            latitude:
                latitude,

            longitude:
                longitude,

            type_lieu:
                document.getElementById(
                    "champ-type-lieu"
                ).value.trim() || null,

            voyage_id:
                voyageId,

            date_debut:
                dateDebut,

            date_fin:
                dateFin,

            date_texte:
                dateTexte,

            adresse:
                document.getElementById(
                    "champ-adresse"
                ).value.trim() || null

        };


        messageFormulaire.textContent =
            "Enregistrement...";

        boutonEnregistrer.disabled =
            true;


        try {


            // ==================================================
            // AJOUT
            // ==================================================

            if (!modification) {

                const nouvelId =
                    genererNouvelIdLieu();


                lieuData.lieu_id =
                    nouvelId;


                /*
                 * INSERT sans .select()
                 *
                 * Cela évite également d'avoir besoin
                 * d'une politique SELECT authenticated.
                 */

                const {
                    error: erreurLieu,
                    count: nombreLieux
                } =
                    await supabaseClient

                        .from("lieux")

                        .insert(
                            lieuData,
                            {
                                count: "exact"
                            }
                        );


                if (erreurLieu) {
                    throw erreurLieu;
                }


                /*
                 * On considère l'insertion réussie si Supabase
                 * ne renvoie pas d'erreur.
                 *
                 * On possède déjà toutes les données du nouveau lieu
                 * grâce au formulaire.
                 */

                tousLesLieux.push({
                    ...lieuData
                });


                // ----------------------------------------------
                // CREATION DE LA VISITE
                // ----------------------------------------------

                if (contexte) {

                    const nouvelleVisiteData = {

                        visite_id:
                            genererNouvelIdVisite(),

                        lieu_id:
                            nouvelId,

                        voyage_id:
                            voyageId,

                        type_contexte:
                            contexte,

                        date_debut:
                            dateDebut,

                        date_fin:
                            dateFin,

                        date_texte:
                            dateTexte,

                        type_experience:
                            experience,

                        description:
                            description,

                        note:
                            note,

                        notes:
                            notes

                    };


                    const {
                        error: erreurVisite
                    } =
                        await supabaseClient

                            .from("visites")

                            .insert(
                                nouvelleVisiteData
                            );


                    if (erreurVisite) {

                        /*
                         * Si la visite échoue, on supprime
                         * le lieu que nous venons de créer.
                         */

                        await supabaseClient
                            .from("lieux")
                            .delete()
                            .eq(
                                "lieu_id",
                                nouvelId
                            );


                        /*
                         * Et on retire également le lieu
                         * des données locales.
                         */

                        tousLesLieux =
                            tousLesLieux.filter(
                                item =>
                                    item.lieu_id !==
                                    nouvelId
                            );


                        throw erreurVisite;
                    }


                    toutesLesVisites.push(
                        nouvelleVisiteData
                    );

                }


                reconstruireTousLesIndex();

                remplirFiltres();

                afficherLieuxFiltres();

                fermerFormulaire();

                message.style.display =
                    "none";


            } else {


                // ==================================================
                // MODIFICATION
                // ==================================================

                const lieuExistant =
                    tousLesLieux.find(
                        lieu =>
                            lieu.lieu_id ===
                            lieuId
                    );


                if (!lieuExistant) {

                    throw new Error(
                        "Lieu introuvable dans les données locales."
                    );
                }


                const visiteExistante =
                    obtenirVisite(
                        lieuExistant
                    );


                // ----------------------------------------------
                // MODIFICATION DE lieux
                // ----------------------------------------------

                /*
                 * IMPORTANT :
                 *
                 * Pas de .select()
                 * Pas de .single()
                 *
                 * On demande uniquement à Supabase
                 * d'effectuer l'UPDATE.
                 */

                const {
                    data: lieuMisAJour,
                    error: erreurLieu
                } =
                    await supabaseClient

                        .from("lieux")

                        .update(
                            lieuData
                        )

                        .eq(
                            "lieu_id",
                            lieuId
                        )

                        /*
                         * On demande à Supabase de renvoyer la ligne
                         * réellement modifiée.
                         *
                         * C'est important : un UPDATE bloqué par une
                         * politique RLS peut sinon ne renvoyer aucune
                         * erreur tout en ne modifiant aucune ligne.
                         * .single() permet alors de détecter immédiatement
                         * ce cas au lieu de mettre à jour uniquement
                         * l'affichage local.
                         */
                        .select()
                        .single();


                if (erreurLieu) {
                    throw erreurLieu;
                }


                if (!lieuMisAJour) {
                    throw new Error(
                        "Supabase n'a renvoyé aucun lieu après la modification. Vérifiez les politiques RLS UPDATE/SELECT."
                    );
                }


                // ----------------------------------------------
                // MISE A JOUR LOCALE DU LIEU
                // ----------------------------------------------

                const indexLieu =
                    tousLesLieux.findIndex(
                        item =>
                            item.lieu_id ===
                            lieuId
                    );


                if (indexLieu !== -1) {

                    /*
                     * On utilise la ligne renvoyée par Supabase,
                     * et non seulement les données du formulaire.
                     */
                    tousLesLieux[
                        indexLieu
                    ] = {

                        ...tousLesLieux[
                            indexLieu
                        ],

                        ...lieuMisAJour

                    };

                }


                // ----------------------------------------------
                // MODIFICATION DE visites
                // ----------------------------------------------

                if (visiteExistante) {

                    /*
                     * IMPORTANT :
                     *
                     * visites.type_contexte est NOT NULL.
                     *
                     * Donc si l'utilisateur choisit
                     * "Aucun contexte", on supprime la visite
                     * plutôt que d'essayer de mettre
                     * type_contexte = null.
                     */

                    if (contexte) {

                        const visiteData = {

                            voyage_id:
                                voyageId,

                            type_contexte:
                                contexte,

                            date_debut:
                                dateDebut,

                            date_fin:
                                dateFin,

                            date_texte:
                                dateTexte,

                            type_experience:
                                experience,

                            description:
                                description,

                            note:
                                note,

                            notes:
                                notes

                        };


                        const {
                            data: visiteMiseAJour,
                            error: erreurVisite
                        } =
                            await supabaseClient

                                .from("visites")

                                .update(
                                    visiteData
                                )

                                .eq(
                                    "visite_id",
                                    visiteExistante.visite_id
                                )

                                /*
                                 * Même contrôle que pour lieux :
                                 * on vérifie qu'une ligne a réellement
                                 * été modifiée en base.
                                 */
                                .select()
                                .single();


                        if (erreurVisite) {
                            throw erreurVisite;
                        }


                        if (!visiteMiseAJour) {
                            throw new Error(
                                "Supabase n'a renvoyé aucune visite après la modification. Vérifiez les politiques RLS UPDATE/SELECT."
                            );
                        }


                        const indexVisite =
                            toutesLesVisites.findIndex(
                                item =>
                                    item.visite_id ===
                                    visiteExistante.visite_id
                            );


                        if (indexVisite !== -1) {

                            toutesLesVisites[
                                indexVisite
                            ] = {

                                ...toutesLesVisites[
                                    indexVisite
                                ],

                                ...visiteMiseAJour

                            };

                        }

                    } else {

                        /*
                         * Suppression de la visite
                         * si aucun contexte n'est sélectionné.
                         */

                        const {
                            error: erreurSuppressionVisite
                        } =
                            await supabaseClient

                                .from("visites")

                                .delete()

                                .eq(
                                    "visite_id",
                                    visiteExistante.visite_id
                                );


                        if (erreurSuppressionVisite) {
                            throw erreurSuppressionVisite;
                        }


                        toutesLesVisites =
                            toutesLesVisites.filter(
                                visite =>
                                    visite.visite_id !==
                                    visiteExistante.visite_id
                            );

                    }

                } else if (contexte) {

                    /*
                     * Le lieu n'avait pas encore de visite.
                     * On en crée une si un contexte est choisi.
                     */

                    const nouvelleVisiteData = {

                        visite_id:
                            genererNouvelIdVisite(),

                        lieu_id:
                            lieuId,

                        voyage_id:
                            voyageId,

                        type_contexte:
                            contexte,

                        date_debut:
                            dateDebut,

                        date_fin:
                            dateFin,

                        date_texte:
                            dateTexte,

                        type_experience:
                            experience,

                        description:
                            description,

                        note:
                            note,

                        notes:
                            notes

                    };


                    const {
                        error: erreurVisite
                    } =
                        await supabaseClient

                            .from("visites")

                            .insert(
                                nouvelleVisiteData
                            );


                    if (erreurVisite) {
                        throw erreurVisite;
                    }


                    toutesLesVisites.push(
                        nouvelleVisiteData
                    );

                }


                // ----------------------------------------------
                // RAFRAICHISSEMENT LOCAL
                // ----------------------------------------------

                reconstruireTousLesIndex();

                remplirFiltres();

                afficherLieuxFiltres();

                fermerFormulaire();

                message.style.display =
                    "none";


            }


        } catch (erreur) {

            console.error(
                "Erreur enregistrement :",
                erreur
            );


            messageFormulaire.textContent =
                "Erreur : " +
                (
                    erreur.message ||
                    String(erreur)
                );

        } finally {

            boutonEnregistrer.disabled =
                false;

        }

    }
);

const fondModalVoyages =
    document.getElementById("fond-modal-voyages");
const formulaireVoyage =
    document.getElementById("formulaire-voyage");
const listeVoyagesGestion =
    document.getElementById("liste-voyages-gestion");
