    document.getElementById("message-voyage-formulaire");
const boutonEnregistrerVoyage =
    document.getElementById("boutonEnregistrerVoyage");

function genererNouvelIdVoyage() {
    let maximum = 0;
    tousLesVoyages.forEach(voyage => {
        const match = String(voyage.voyage_id || "").match(/^V(\d+)$/i);
        if (match) maximum = Math.max(maximum, Number(match[1]));
    });
    return "V" + String(maximum + 1).padStart(4, "0");
}

function reinitialiserFormulaireVoyage() {
    formulaireVoyage.reset();
    document.getElementById("champ-voyage-id-gestion").value = "";
    document.getElementById("champ-voyage-photo").value = "";
    messageVoyageFormulaire.textContent = "";
}

function ouvrirGestionVoyages() {
    if (!utilisateurConnecte) return;
    reinitialiserFormulaireVoyage();
    afficherListeVoyagesGestion();
    fondModalVoyages.style.display = "flex";
}

function fermerGestionVoyages() {
    fondModalVoyages.style.display = "none";
}

function chargerVoyageDansFormulaire(voyageId) {
    const voyage = tousLesVoyages.find(v => v.voyage_id === voyageId);
    if (!voyage) return;
    document.getElementById("champ-voyage-id-gestion").value = voyage.voyage_id || "";
    document.getElementById("champ-voyage-nom").value = voyage.nom || "";
    document.getElementById("champ-voyage-date-debut").value = voyage.date_debut || "";
    document.getElementById("champ-voyage-date-fin").value = voyage.date_fin || "";
    document.getElementById("champ-voyage-pays").value = voyage.pays_principal || "";
    document.getElementById("champ-voyage-photo").value = voyage.photo_couverture || "";
    document.getElementById("champ-voyage-date-texte").value = voyage.date_precision === "texte" ? (voyage.date_texte || "") : (voyage.date_texte || "");
    document.getElementById("champ-voyage-description").value = voyage.description || "";
    document.getElementById("champ-voyage-notes").value = voyage.notes || "";
    messageVoyageFormulaire.textContent = "Modification du voyage « " + (voyage.nom || voyage.voyage_id) + " ».";
}

function afficherListeVoyagesGestion() {
    listeVoyagesGestion.innerHTML = "";
    [...tousLesVoyages]
        .sort((a, b) => String(a.nom || "").localeCompare(String(b.nom || ""), "fr"))
        .forEach(voyage => {
            const nombreLieux = tousLesLieux.filter(l => l.voyage_id === voyage.voyage_id).length;
            const div = document.createElement("div");
            div.className = "ligne-gestion";
            div.innerHTML = `
                <div class="ligne-gestion-principale">
                    <div class="ligne-gestion-titre">${echapperHTML(voyage.nom || voyage.voyage_id)}</div>
                    <div class="ligne-gestion-meta">
                        ${echapperHTML(afficherPeriode(voyage.date_debut, voyage.date_fin, voyage.date_precision, voyage.date_texte))}
                        ${voyage.pays_principal ? " · " + echapperHTML(voyage.pays_principal) : ""}
                        · ${nombreLieux} lieu${nombreLieux > 1 ? "x" : ""}
                    </div>
                </div>
                <div class="actions-gestion">
                    <button class="bouton bouton-voir-voyage" data-voyage-id="${echapperHTML(voyage.voyage_id)}">Voir</button>
                    <button class="bouton bouton-editer-voyage" data-voyage-id="${echapperHTML(voyage.voyage_id)}">Modifier</button>
                    <button class="bouton bouton-supprimer-voyage" data-voyage-id="${echapperHTML(voyage.voyage_id)}">Supprimer</button>
                </div>`;
            listeVoyagesGestion.appendChild(div);
        });

    if (!tousLesVoyages.length) {
        listeVoyagesGestion.innerHTML = "<div>Aucun voyage enregistré.</div>";
    }
}

formulaireVoyage.addEventListener("submit", async event => {
    event.preventDefault();
    if (!utilisateurConnecte) return;

    const voyageId = document.getElementById("champ-voyage-id-gestion").value.trim();
    const nom = document.getElementById("champ-voyage-nom").value.trim();
    if (!nom) {
        messageVoyageFormulaire.textContent = "Le nom du voyage est obligatoire.";
        return;
    }

    const voyageData = {
        nom,
        date_debut: document.getElementById("champ-voyage-date-debut").value || null,
        date_fin: document.getElementById("champ-voyage-date-fin").value || null,
        date_texte: document.getElementById("champ-voyage-date-texte").value.trim() || null,
        pays_principal: document.getElementById("champ-voyage-pays").value.trim() || null,
        photo_couverture: document.getElementById("champ-voyage-photo").value.trim() || null,
        description: document.getElementById("champ-voyage-description").value.trim() || null,
        notes: document.getElementById("champ-voyage-notes").value.trim() || null
    };

    boutonEnregistrerVoyage.disabled = true;
    messageVoyageFormulaire.textContent = "Enregistrement...";

    try {
        if (voyageId) {
            const { data, error } = await supabaseClient
                .from("voyages")
                .update(voyageData)
                .eq("voyage_id", voyageId)
                .select()
                .single();
            if (error) throw error;
            const index = tousLesVoyages.findIndex(v => v.voyage_id === voyageId);
            if (index !== -1) tousLesVoyages[index] = data;
        } else {
            const nouvelId = genererNouvelIdVoyage();
            const { data, error } = await supabaseClient
                .from("voyages")
                .insert({ ...voyageData, voyage_id: nouvelId })
                .select()
                .single();
            if (error) throw error;
            tousLesVoyages.push(data);
        }

        reconstruireTousLesIndex();
        remplirFiltres();
        afficherLieuxFiltres();
        reinitialiserFormulaireVoyage();
        afficherListeVoyagesGestion();
    } catch (erreur) {
        console.error("Erreur voyage :", erreur);
        messageVoyageFormulaire.textContent = "Erreur : " + (erreur.message || String(erreur));
    } finally {
        boutonEnregistrerVoyage.disabled = false;
    }
});

async function supprimerVoyage(voyageId) {
    const voyage = tousLesVoyages.find(v => v.voyage_id === voyageId);
    if (!voyage) return;

    const nombreVisites = toutesLesVisites.filter(v => v.voyage_id === voyageId).length;
    if (nombreVisites > 0) {
        alert("Ce voyage ne peut pas être supprimé tant que " + nombreVisites + " visite(s) lui sont rattachée(s). Modifiez ou supprimez d'abord ces visites.");
        return;
    }

    const nombreLieux = tousLesLieux.filter(l => l.voyage_id === voyageId).length;
    const confirmation = confirm(
        "Supprimer définitivement le voyage « " + voyage.nom + " » ?\n\n" +
        (nombreLieux ? nombreLieux + " lieu(x) seront conservés mais ne seront plus rattachés au voyage.\n" : "") +
        "Les photos explicitement rattachées à ce voyage peuvent également être supprimées par la base."
    );
    if (!confirmation) return;

    try {
        const { error } = await supabaseClient.from("voyages").delete().eq("voyage_id", voyageId);
        if (error) throw error;
        tousLesVoyages = tousLesVoyages.filter(v => v.voyage_id !== voyageId);
        tousLesLieux = tousLesLieux.map(l => l.voyage_id === voyageId ? { ...l, voyage_id: null } : l);
        toutesLesPhotos = toutesLesPhotos.filter(p => p.voyage_id !== voyageId);
        reconstruireTousLesIndex();
        remplirFiltres();
        afficherLieuxFiltres();
        afficherListeVoyagesGestion();
    } catch (erreur) {
        console.error("Erreur suppression voyage :", erreur);
        messageVoyageFormulaire.textContent = "Erreur : " + (erreur.message || String(erreur));
    }
}

boutonVoyages.addEventListener("click", ouvrirGestionVoyages);
document.getElementById("boutonFermerVoyages").addEventListener("click", fermerGestionVoyages);
document.getElementById("boutonNouveauVoyage").addEventListener("click", reinitialiserFormulaireVoyage);
fondModalVoyages.addEventListener("click", event => {
    if (event.target === fondModalVoyages) fermerGestionVoyages();
});
listeVoyagesGestion.addEventListener("click", event => {
    const voir = event.target.closest(".bouton-voir-voyage");
    if (voir) {
        ouvrirDetailVoyage(voir.dataset.voyageId);
        return;
    }
    const edit = event.target.closest(".bouton-editer-voyage");
    if (edit) chargerVoyageDansFormulaire(edit.dataset.voyageId);
    const del = event.target.closest(".bouton-supprimer-voyage");
    if (del) supprimerVoyage(del.dataset.voyageId);
});

function obtenirUrlPhotoVoyage(voyage) {
    if (!voyage || !voyage.photo_couverture) return "";
    const valeur = String(voyage.photo_couverture);
    if (/^https?:\/\//i.test(valeur)) return valeur;
    return construireUrlPhoto(valeur);
}

        .filter(v => String(v.voyage_id || "") === String(voyageId))

            html += `<div class="voyage-detail-visite"><div class="voyage-detail-visite-date">📅 ${echapperHTML(dateVisite || "Date non renseignée")}</div><div class="fiche-visite-meta">${lieu ? "📍 " + echapperHTML(lieu.nom) + (lieu.ville ? " · " + echapperHTML(lieu.ville) : "") : "Lieu inconnu"}${meta.length ? " · " + meta.join(" · ") : ""}</div>${visite.description ? `<div class="fiche-visite-detail">${echapperHTML(visite.description)}</div>` : ""}</div>`;

    } else {

function genererNouvelIdPhoto() {
    let maximum = 0;
    toutesLesPhotos.forEach(photo => {
        const match = String(photo.photo_id || "").match(/^P(\d+)$/i);
        if (match) maximum = Math.max(maximum, Number(match[1]));
    });
    return "P" + String(maximum + 1).padStart(4, "0");
}

async function mettrePhotoPrincipale(photoId, lieuId) {
    const autres = toutesLesPhotos.filter(p => p.lieu_id === lieuId && p.photo_id !== photoId && p.photo_principale);
    for (const photo of autres) {
        const { error } = await supabaseClient.from("photos").update({ photo_principale: false }).eq("photo_id", photo.photo_id);
        if (error) throw error;
        photo.photo_principale = false;
    }
}

async function supprimerFichierStorage(fichier) {
    if (!fichier) return;
    const { error } = await supabaseClient.storage.from("photos").remove([fichier]);
    if (error) console.warn("Suppression fichier Storage non bloquante :", error);
}

function chargerPhotoDansFormulaire(photoId) {

    document.getElementById("champ-photo-fichier").value = "";

}

formulairePhoto.addEventListener("submit", async event => {
    event.preventDefault();
    if (!utilisateurConnecte) return;

    const photoId = document.getElementById("champ-photo-id-gestion").value.trim();
    const lieuId = document.getElementById("champ-photo-lieu").value;
    const fichierSelectionne = document.getElementById("champ-photo-fichier").files[0] || null;
    if (!lieuId) {
        messagePhotoFormulaire.textContent = "Le lieu est obligatoire.";
        return;
    }
    if (!photoId && !fichierSelectionne) {
        messagePhotoFormulaire.textContent = "Sélectionnez un fichier photo.";
        return;
    }

    const lieu = tousLesLieux.find(l => l.lieu_id === lieuId);
    const voyageId = lieu?.voyage_id || null;
    const estPrincipale = document.getElementById("champ-photo-principale").value === "true";
    const ordre = Math.max(1, Number(document.getElementById("champ-photo-ordre").value || 1));
    const titre = document.getElementById("champ-photo-titre").value.trim() || null;
    const datePhoto = document.getElementById("champ-photo-date").value || null;
    const description = document.getElementById("champ-photo-description").value.trim() || null;

    boutonEnregistrerPhoto.disabled = true;
    messagePhotoFormulaire.textContent = "Enregistrement...";

    try {
        if (photoId) {
            const ancienne = toutesLesPhotos.find(p => p.photo_id === photoId);
            if (!ancienne) throw new Error("Photo introuvable.");
            let fichier = ancienne.fichier;

            if (fichierSelectionne) {
                const extension = (fichierSelectionne.name.split(".").pop() || "jpg").toLowerCase();
                const nouveauChemin = lieuId + "/" + photoId + "." + extension;
                const { error: uploadError } = await supabaseClient.storage.from("photos").upload(nouveauChemin, fichierSelectionne, { upsert: true, contentType: fichierSelectionne.type || undefined });
                if (uploadError) throw uploadError;
                if (ancienne.fichier && ancienne.fichier !== nouveauChemin) await supprimerFichierStorage(ancienne.fichier);
                fichier = nouveauChemin;
            }

            if (estPrincipale) await mettrePhotoPrincipale(photoId, lieuId);
            const photoData = { lieu_id: lieuId, voyage_id: voyageId, fichier, titre, date_photo: datePhoto, description, ordre, photo_principale: estPrincipale };
            const { data, error } = await supabaseClient.from("photos").update(photoData).eq("photo_id", photoId).select().single();
            if (error) throw error;
            const index = toutesLesPhotos.findIndex(p => p.photo_id === photoId);
            if (index !== -1) toutesLesPhotos[index] = data;
        } else {
            const nouvelId = genererNouvelIdPhoto();
            const extension = (fichierSelectionne.name.split(".").pop() || "jpg").toLowerCase();
            const chemin = lieuId + "/" + nouvelId + "." + extension;
            const { error: uploadError } = await supabaseClient.storage.from("photos").upload(chemin, fichierSelectionne, { upsert: false, contentType: fichierSelectionne.type || undefined });
            if (uploadError) throw uploadError;
            try {
                if (estPrincipale) await mettrePhotoPrincipale(nouvelId, lieuId);
                const photoData = { photo_id: nouvelId, lieu_id: lieuId, voyage_id: voyageId, fichier: chemin, titre, date_photo: datePhoto, description, photo_principale: estPrincipale, ordre };
                const { data, error } = await supabaseClient.from("photos").insert(photoData).select().single();
                if (error) throw error;
                toutesLesPhotos.push(data);
            } catch (erreur) {
                await supprimerFichierStorage(chemin);
                throw erreur;
            }
        }

        reconstruireTousLesIndex();
        afficherLieuxFiltres();
        reinitialiserFormulairePhoto();
        afficherListePhotosGestion();
    } catch (erreur) {
        console.error("Erreur photo :", erreur);
        messagePhotoFormulaire.textContent = "Erreur : " + (erreur.message || String(erreur));
    } finally {
        boutonEnregistrerPhoto.disabled = false;
    }
});

async function supprimerPhoto(photoId) {
    const photo = toutesLesPhotos.find(p => p.photo_id === photoId);
    if (!photo) return;
    if (!confirm("Supprimer définitivement cette photo ?")) return;

    try {
        const { error } = await supabaseClient.from("photos").delete().eq("photo_id", photoId);
        if (error) throw error;
        await supprimerFichierStorage(photo.fichier);
        toutesLesPhotos = toutesLesPhotos.filter(p => p.photo_id !== photoId);
        reconstruireTousLesIndex();
        afficherLieuxFiltres();
        afficherListePhotosGestion();
    } catch (erreur) {
        console.error("Erreur suppression photo :", erreur);
        messagePhotoFormulaire.textContent = "Erreur : " + (erreur.message || String(erreur));
    }
}

async function enregistrerVisiteGestion() {

    if (!utilisateurConnecte) return;

    const lieuId =
        document.getElementById("champ-visite-lieu-id-gestion").value;

    const visiteId =
        document.getElementById("champ-visite-id-gestion").value.trim();

    const contexte =
        document.getElementById("champ-visite-contexte").value;

    if (!lieuId) {
        document.getElementById("message-visite-formulaire").textContent =
            "Lieu introuvable.";
        return;
    }

    if (!contexte) {
        document.getElementById("message-visite-formulaire").textContent =
            "Le contexte est obligatoire pour une visite.";
        return;
    }

    const noteValeur = document.getElementById("champ-visite-note").value;
    const note = noteValeur === "" ? null : Number(noteValeur);

    const visiteData = {
        lieu_id: lieuId,
        voyage_id: document.getElementById("champ-visite-voyage").value || null,
        type_contexte: contexte,
        date_debut: document.getElementById("champ-visite-date-debut").value || null,
        date_fin: document.getElementById("champ-visite-date-fin").value || null,
        date_texte: document.getElementById("champ-visite-date-texte").value.trim() || null,
        type_experience: document.getElementById("champ-visite-experience").value.trim() || null,
        description: document.getElementById("champ-visite-description").value.trim() || null,
        note,
        notes: document.getElementById("champ-visite-notes").value.trim() || null
    };

    boutonEnregistrerVisite.disabled = true;
    document.getElementById("message-visite-formulaire").textContent = "Enregistrement...";

    try {

        if (visiteId) {

            const { data, error } =
                await supabaseClient
                    .from("visites")
                    .update(visiteData)
                    .eq("visite_id", visiteId)
                    .select()
                    .single();

            if (error) throw error;
            if (!data) throw new Error("Aucune visite n'a été renvoyée après modification.");

            const index =
                toutesLesVisites.findIndex(item => item.visite_id === visiteId);

            if (index !== -1) {
                toutesLesVisites[index] = data;
            }

        } else {

            const nouvelleVisite = {
                visite_id: genererNouvelIdVisite(),
                ...visiteData
            };

            const { data, error } =
                await supabaseClient
                    .from("visites")
                    .insert(nouvelleVisite)
                    .select()
                    .single();

            if (error) throw error;
            if (!data) throw new Error("Aucune visite n'a été renvoyée après création.");

            toutesLesVisites.push(data);
        }

        reconstruireTousLesIndex();
        remplirFiltres();
        afficherLieuxFiltres();

        document.getElementById("message-visite-formulaire").textContent =
            "Visite enregistrée.";

        reinitialiserFormulaireVisiteGestion();
        document.getElementById("champ-visite-lieu-id-gestion").value = lieuId;
        afficherListeVisitesGestion(lieuId);

    } catch (erreur) {

        console.error("Erreur visite :", erreur);
        document.getElementById("message-visite-formulaire").textContent =
            "Erreur : " + (erreur.message || String(erreur));

    } finally {
        boutonEnregistrerVisite.disabled = false;
    }
}


async function supprimerVisiteGestion(visiteId) {

    const visite =
        toutesLesVisites.find(item => item.visite_id === visiteId);

    if (!visite) return;

    if (!confirm("Supprimer définitivement cette visite ?")) return;

    try {

        const { error } =
            await supabaseClient
                .from("visites")
                .delete()
                .eq("visite_id", visiteId);

        if (error) throw error;

        toutesLesVisites =
            toutesLesVisites.filter(item => item.visite_id !== visiteId);

        reconstruireTousLesIndex();
        remplirFiltres();
        afficherLieuxFiltres();
        afficherListeVisitesGestion(visite.lieu_id);
        reinitialiserFormulaireVisiteGestion();
        document.getElementById("champ-visite-lieu-id-gestion").value = visite.lieu_id;
        afficherListeVisitesGestion(visite.lieu_id);

    } catch (erreur) {
        console.error("Erreur suppression visite :", erreur);
        document.getElementById("message-visite-formulaire").textContent =
            "Erreur : " + (erreur.message || String(erreur));
    }
}

async function supprimerLieu(lieuId) {

    if (!utilisateurConnecte) {

        afficherErreur(
            "Vous devez être connecté."
        );

        return;
    }


    const lieu =
        tousLesLieux.find(
            item =>
                item.lieu_id === lieuId
        );


    if (!lieu) {
        return;
    }


    const confirmation =
        confirm(
            "Supprimer définitivement « " +
            lieu.nom +
            " » ?\n\n" +
            "Le lieu, sa visite et ses photos seront supprimés."
        );


    if (!confirmation) {
        return;
    }


    try {

        const visites =
            visitesParLieu[
                lieuId
            ] || [];


        for (
            const visite
            of visites
        ) {

            const {
                error
            } =
                await supabaseClient

                    .from("visites")

                    .delete()

                    .eq(
                        "visite_id",
                        visite.visite_id
                    );


            if (error) {
                throw error;
            }

        }


        const {
            error
        } =
            await supabaseClient

                .from("lieux")

                .delete()

                .eq(
                    "lieu_id",
                    lieuId
                );


        if (error) {
            throw error;
        }


        // ----------------------------------------------
        // MISE A JOUR LOCALE
        // ----------------------------------------------

        tousLesLieux =
            tousLesLieux.filter(
                item =>
                    item.lieu_id !== lieuId
            );


        toutesLesVisites =
            toutesLesVisites.filter(
                visite =>
                    visite.lieu_id !== lieuId
            );


        toutesLesPhotos =
            toutesLesPhotos.filter(
                photo =>
                    photo.lieu_id !== lieuId
            );


        reconstruireTousLesIndex();

        remplirFiltres();

        afficherLieuxFiltres();

        message.style.display =
            "none";


    } catch (erreur) {

        console.error(
            "Erreur suppression :",
            erreur
        );


        afficherErreur(
            "Impossible de supprimer le lieu : " +
            (
                erreur.message ||
                String(erreur)
            )
        );

    }
}


// ==========================================================
// VISIONNEUSE PHOTO + CLICS DANS LES POPUPS
// ==========================================================

const fondVisionneusePhoto =
    document.getElementById("fond-visionneuse-photo");

const imageVisionneusePhoto =
    document.getElementById("visionneuse-photo-image");

const titreVisionneusePhoto =
    document.getElementById("visionneuse-photo-titre");

const descriptionVisionneusePhoto =
    document.getElementById("visionneuse-photo-description");

const compteurVisionneusePhoto =
    document.getElementById("visionneuse-photo-compteur");

const boutonFermerVisionneuse =
    document.getElementById("bouton-fermer-visionneuse");

const boutonPhotoPrecedente =
    document.getElementById("bouton-photo-precedente");

const boutonPhotoSuivante =
    document.getElementById("bouton-photo-suivante");

let photosVisionneuse = [];
let indexPhotoVisionneuse = 0;

function ouvrirVisionneusePhoto(images, index) {

    if (!Array.isArray(images) || images.length === 0) {
        return;
    }

    photosVisionneuse = images;
    indexPhotoVisionneuse = Math.max(
        0,
        Math.min(Number(index) || 0, photosVisionneuse.length - 1)
    );

    afficherPhotoVisionneuse();
    fondVisionneusePhoto.style.display = "flex";
    fondVisionneusePhoto.setAttribute("aria-hidden", "false");
}

function afficherPhotoVisionneuse() {

    const photo = photosVisionneuse[indexPhotoVisionneuse];

    if (!photo) return;

    imageVisionneusePhoto.src = photo.url;
    imageVisionneusePhoto.alt = photo.titre || "Photo";

    titreVisionneusePhoto.textContent = photo.titre || "";

    const informations = [];

    if (photo.date) {
        informations.push("📅 " + photo.date);
    }

    if (photo.description) {
        informations.push(photo.description);
    }

    descriptionVisionneusePhoto.textContent =
        informations.join(" · ");

    compteurVisionneusePhoto.textContent =
        (indexPhotoVisionneuse + 1) +
        " / " +
        photosVisionneuse.length;

    const plusieurs = photosVisionneuse.length > 1;

    boutonPhotoPrecedente.style.display = plusieurs ? "flex" : "none";
    boutonPhotoSuivante.style.display = plusieurs ? "flex" : "none";
}

function fermerVisionneusePhoto() {
    fondVisionneusePhoto.style.display = "none";
    fondVisionneusePhoto.setAttribute("aria-hidden", "true");
    imageVisionneusePhoto.src = "";
    photosVisionneuse = [];
}

function photoVisionneuseSuivante() {
    if (!photosVisionneuse.length) return;
    indexPhotoVisionneuse =
        (indexPhotoVisionneuse + 1) % photosVisionneuse.length;
    afficherPhotoVisionneuse();
}

function photoVisionneusePrecedente() {
    if (!photosVisionneuse.length) return;
    indexPhotoVisionneuse =
        (indexPhotoVisionneuse - 1 + photosVisionneuse.length) % photosVisionneuse.length;
    afficherPhotoVisionneuse();
}

boutonFermerVisionneuse.addEventListener(
    "click",
    fermerVisionneusePhoto
);

boutonPhotoSuivante.addEventListener(
    "click",
    photoVisionneuseSuivante
);

boutonPhotoPrecedente.addEventListener(
    "click",
    photoVisionneusePrecedente
);

fondVisionneusePhoto.addEventListener(
    "click",
    event => {
        if (event.target === fondVisionneusePhoto) {
            fermerVisionneusePhoto();
        }
    }
);

document.addEventListener(
    "keydown",
    event => {
        if (fondVisionneusePhoto.style.display !== "flex") return;

        if (event.key === "Escape") {
            fermerVisionneusePhoto();
        } else if (event.key === "ArrowRight") {
            photoVisionneuseSuivante();
        } else if (event.key === "ArrowLeft") {
            photoVisionneusePrecedente();
        }
    }
);

document.addEventListener(
    "click",
    function(event) {

        const boutonModifier =
            event.target.closest(".bouton-modifier");

        if (boutonModifier) {
            ouvrirFormulaireModification(
                boutonModifier.dataset.lieuId
            );
            return;
        }

        const boutonSupprimer =
            event.target.closest(".bouton-supprimer");

        if (boutonSupprimer) {
            supprimerLieu(
                boutonSupprimer.dataset.lieuId
            );
            return;
        }

        const elementPhoto =
            event.target.closest(".fiche-photo, .fiche-miniature");

        if (!elementPhoto) {
            return;
        }

        const popup =
            elementPhoto.closest(".maplibregl-popup");

        if (!popup) {
            return;
        }

        // Les miniatures représentent déjà l'ensemble de la galerie.
        // La grande photo n'est utilisée comme source que lorsqu'il n'y a
        // qu'une seule photo (donc pas de miniatures).
        const elementsPhotos =
            [...popup.querySelectorAll(".fiche-miniature")];

        const sources =
            elementsPhotos.length > 0
                ? elementsPhotos
                : [popup.querySelector(".fiche-photo")].filter(Boolean);

        const images = sources
            .map(element => ({
                url: element.dataset.photoUrl || element.src,
                titre: element.dataset.photoTitre || element.alt || "",
                description: element.dataset.photoDescription || "",
                date: element.dataset.photoDate || ""
            }))
            .filter(photo => photo.url);

        if (!images.length) {
            return;
        }

        const index = elementsPhotos.length > 0
            ? Math.max(0, Number(elementPhoto.dataset.photoIndex || 0))
            : 0;

        ouvrirVisionneusePhoto(images, index);
    }
);

        afficherInterfaceAuthentification();

    }
);


// ==========================================================
// LANCEMENT
// ==========================================================

async function initialiser() {

    try {

        /*
         * On récupère la session initiale et les données
         * en parallèle.
         */

        const [
            resultatSession
        ] =
            await Promise.all([

                supabaseClient.auth.getSession(),

                chargerDonnees()

            ]);


        mettreAJourInterfaceAvecSession(
            resultatSession.data.session
        );


    } catch (erreur) {

        console.error(
            "Erreur initialisation :",
            erreur
        );

        afficherErreur(
            "Erreur lors de l'initialisation : " +
            (
                erreur.message ||
                String(erreur)
            )
        );

    }

}


initialiser();
